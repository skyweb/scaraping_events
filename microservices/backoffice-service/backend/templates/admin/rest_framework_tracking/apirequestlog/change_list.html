{% extends "admin/change_list.html" %}

{% block content %}
{% if api_stats_html %}
{{ api_stats_html }}
{% endif %}

{% if chart_data %}
<div style="background:#fff;border:1px solid #e5e7eb;border-radius:0.5rem;padding:1rem;margin-bottom:1rem;">
    <h3 style="font-size:0.875rem;font-weight:600;color:#374151;margin:0 0 0.75rem 0;">Ultimi 30 giorni</h3>
    <canvas id="apiChart" height="80"></canvas>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var ctx = document.getElementById('apiChart').getContext('2d');
    var rawData = {{ chart_data|safe }};
    new Chart(ctx, {
        data: {
            labels: rawData.labels,
            datasets: rawData.datasets
        },
        options: {
            responsive: true,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { font: { size: 11 } } }
            },
            scales: {
                y: {
                    type: 'linear',
                    display: true,
                    position: 'left',
                    title: { display: true, text: 'Richieste', font: { size: 11 } },
                    beginAtZero: true,
                    ticks: { precision: 0 }
                },
                y1: {
                    type: 'linear',
                    display: true,
                    position: 'right',
                    title: { display: true, text: 'ms', font: { size: 11 } },
                    beginAtZero: true,
                    grid: { drawOnChartArea: false }
                }
            }
        }
    });
});
</script>
{% endif %}

{{ block.super }}
{% endblock %}
