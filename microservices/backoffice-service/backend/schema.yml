  /api/waf/rules/add/:
    post:
      operationId: api_waf_rules_add_create
      description: |
        Aggiunge una nuova SecRule Coraza. La regola viene applicata immediatamente a tutto il traffico.

        **Formato regola:**
        ```
        SecRule VARIABILE "@OPERATORE pattern" "id:NNNN,phase:N,deny,status:403,log,msg:Descrizione"
        ```

        **Variabili comuni:**
        - `ARGS|ARGS_NAMES` — parametri query string e body
        - `REQUEST_URI` — URL della richiesta
        - `REQUEST_HEADERS:Header-Name` — header HTTP specifico
        - `REQUEST_BODY` — corpo della richiesta

        **Operatori:**
        - `@rx` — regex
        - `@contains` — contiene stringa
        - `@eq` — uguale

        **Fasi:**
        - `phase:1` — request headers (prima del body)
        - `phase:2` — request body
        - `phase:3` — response headers
        - `phase:4` — response body
      summary: Aggiungi regola WAF
      tags:
      - WAF
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - rule
              properties:
                rule:
                  type: string
                  description: SecRule completa
            examples:
              BloccaSQLInjection:
                value:
                  rule: SecRule ARGS|ARGS_NAMES "@rx (?i)(union.*select|drop\s+table)"
                    "id:2001,phase:2,deny,status:403,log,msg:Custom SQL Injection
                    rule"
                summary: Blocca SQL Injection
              BloccaUser-AgentSpecifico:
                value:
                  rule: SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap)"
                    "id:2002,phase:1,deny,status:403,log,msg:Scanner blocked"
                summary: Blocca User-Agent specifico
              BloccaUploadFilePericolosi:
                value:
                  rule: SecRule REQUEST_HEADERS:Content-Type "@rx (?i)(application/x-php|text/x-php)"
                    "id:2003,phase:1,deny,status:403,log,msg:PHP upload blocked"
                summary: Blocca upload file pericolosi
      security:
      - cookieAuth: []
      - BearerAuth: []
      - ApiKeyAuth: []
      - SessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  rules_count:
                    type: integer
          description: ''
  /api/waf/rules/test/:
    post:
      operationId: api_waf_rules_test_create
