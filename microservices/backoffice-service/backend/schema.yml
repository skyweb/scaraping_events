openapi: 3.0.3
info:
  title: Events Backoffice API
  version: 1.0.0
  description: "\n## API REST - Events Backoffice\n\nAPI per la gestione degli eventi,\
    \ monitoraggio ETL e integrazione con servizi esterni.\n\n### Autenticazione\n\
    \n- **API interne**: Session authentication (Django admin login)\n- **API esterne**\
    \ (`/api/v1/events/`): OAuth2 Client Credentials via Keycloak (versionata)\n-\
    \ **CMS** (`/api/cms/`): Pubblico, senza autenticazione\n- **Comuni ISTAT Ingestion**\
    \ (`/api/comuni-istat/`): Session authentication\n\n#### OAuth2 Flow\n\n1. Crea\
    \ un API Consumer dal Django admin (`/admin/api_consumers/apiconsumer/`)\n2. Ottieni\
    \ un access token: `POST https://webservice.127.0.0.1.nip.io/auth/token` con `grant_type=client_credentials`\n\
    3. Usa il token: `Authorization: Bearer <access_token>`\n\n### Permessi\n\nI permessi\
    \ sono gestiti per risorsa e azione dalla matrice API Consumers:\n- `events:read`\
    \ - Lettura staging events\n- `events:create` - Creazione staging events (singola\
    \ e bulk)\n- `events:update` - Aggiornamento staging events\n- `events:delete`\
    \ - Eliminazione staging events\n\n### Versioning\n\nLe API esterne sono versionate\
    \ tramite URL path:\n- Versione corrente: **v1** → `/api/v1/events/staging/`\n\
    - Endpoint info versione: `GET /api/version/` (senza autenticazione)\n- Header\
    \ `X-API-Version` presente in ogni risposta API\n\nLe API interne (`/api/events/`,\
    \ `/api/dashboard/`, ecc.) usano header versioning:\n- Header: `Accept: application/vnd.todayevents.v1+json`\n\
    - Default: v1 (se header assente)\n    "
paths:
