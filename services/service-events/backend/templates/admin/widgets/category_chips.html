<div class="category-chips-container">
    <div id="chips-{{ widget.name }}" class="chips-display" style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem;">
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
        <input type="text"
               id="input-{{ widget.name }}"
               placeholder="Aggiungi categoria e premi Invio"
               class="vTextField"
               style="flex: 1;">
        <button type="button" onclick="addChip_{{ widget.name|cut:'-' }}()"
                class="button" style="padding: 0.5rem 1rem; background: #0ea5e9; color: white; border: none; border-radius: 0.375rem; cursor: pointer;">
            Aggiungi
        </button>
    </div>
    <input type="hidden"
           name="{{ widget.name }}"
           id="hidden-{{ widget.name }}"
           value="{{ widget.value }}">
</div>

<style>
.chip {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.25rem 0.75rem;
    background: #e0f2fe;
    color: #0369a1;
    border-radius: 9999px;
    font-size: 0.875rem;
    font-weight: 500;
}
.chip-remove {
    cursor: pointer;
    margin-left: 0.25rem;
    font-weight: bold;
    opacity: 0.7;
}
.chip-remove:hover {
    opacity: 1;
    color: #dc2626;
}
</style>

<script>
(function() {
    const widgetName = '{{ widget.name }}';
    const safeWidgetName = widgetName.replace(/-/g, '_');
    const hiddenInput = document.getElementById('hidden-{{ widget.name }}');
    const chipsContainer = document.getElementById('chips-{{ widget.name }}');
    const textInput = document.getElementById('input-{{ widget.name }}');

    let categories = [];

    // Parse initial value
    const initialValue = hiddenInput.value;
    if (initialValue) {
        categories = initialValue.split(',').map(s => s.trim()).filter(s => s);
    }

    function renderChips() {
        chipsContainer.innerHTML = '';
        categories.forEach((cat, index) => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.innerHTML = cat + '<span class="chip-remove" onclick="removeChip_' + safeWidgetName + '(' + index + ')">×</span>';
            chipsContainer.appendChild(chip);
        });
        hiddenInput.value = categories.join(',');
    }

    window['addChip_' + safeWidgetName] = function() {
        const value = textInput.value.trim();
        if (value && !categories.includes(value)) {
            categories.push(value);
            renderChips();
            textInput.value = '';
        }
        textInput.focus();
    };

    window['removeChip_' + safeWidgetName] = function(index) {
        categories.splice(index, 1);
        renderChips();
    };

    textInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            window['addChip_' + safeWidgetName]();
        }
    });

    renderChips();
})();
</script>
