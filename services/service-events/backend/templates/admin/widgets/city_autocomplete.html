<input type="text"
       name="{{ widget.name }}"
       {% if widget.value %}value="{{ widget.value }}"{% endif %}
       list="comuni-list"
       autocomplete="off"
       class="vTextField"
       {% for attr, val in widget.attrs.items %}{{ attr }}="{{ val }}" {% endfor %}
       style="width: 100%;">
<datalist id="comuni-list">
    {% for comune in comuni %}
    <option value="{{ comune }}">
    {% endfor %}
</datalist>
