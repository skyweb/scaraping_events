# Configurazione Scrapyd
#
# Documentazione: https://scrapyd.readthedocs.io/en/stable/config.html

[scrapyd]
# Indirizzo e porta del server
bind_address = 0.0.0.0
http_port = 6800

# Directory per eggs, logs e dbs
eggs_dir = /var/lib/scrapyd/eggs
logs_dir = /var/lib/scrapyd/logs
dbs_dir = /var/lib/scrapyd/dbs

# Numero massimo di spider concorrenti
max_proc = 4
max_proc_per_cpu = 2

# Timeout per spider (secondi, 0 = nessun limite)
runner = scrapyd.runner

# Log level
debug = off

# Mantieni log e item per N giorni (0 = sempre)
logs_to_keep = 7
jobs_to_keep = 100

# Dimensione massima upload egg (bytes)
max_egg_size = 16777216

[services]
schedule.json = scrapyd.webservice.Schedule
cancel.json = scrapyd.webservice.Cancel
addversion.json = scrapyd.webservice.AddVersion
listprojects.json = scrapyd.webservice.ListProjects
listversions.json = scrapyd.webservice.ListVersions
listspiders.json = scrapyd.webservice.ListSpiders
delproject.json = scrapyd.webservice.DeleteProject
delversion.json = scrapyd.webservice.DeleteVersion
listjobs.json = scrapyd.webservice.ListJobs
daemonstatus.json = scrapyd.webservice.DaemonStatus
