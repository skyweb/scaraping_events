---
# Domain Setup - HTTPS routing via sottodomini per tutti i servizi K8s
# Traefik gestisce TLS (Let's Encrypt ACME) e L7 routing.
# Tutte le IngressRoute usano entryPoint websecure + certResolver letsencrypt.
# Auth per-servizio: ogni servizio protetto puo' essere escluso dall'auth via auth_<servizio>: false
#
# Prerequisiti: post-cluster-setup.yml (Traefik con ACME), DNS A record configurati
#
# Uso: ansible-playbook ansible/playbooks/domain-setup.yml
- name: OKE Domain Setup (HTTPS IngressRoute per tutti i servizi)
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  vars:
    domain_auth: "{{ auth_subdomain | default('auth') }}.{{ base_domain }}"
    auth_middleware_name: "google-auth"
    auth_available: "{{ install_oauth2_proxy | default(false) }}"
    # Entrypoint: sempre websecure (Traefik gestisce TLS)
    route_entrypoint: "websecure"

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica che base_domain sia definito
      ansible.builtin.assert:
        that: base_domain is defined
        fail_msg: "base_domain non definito in oke.yml. Configurare per abilitare HTTPS routing."

    - name: Verifica kubectl disponibile
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Verifica che OAuth2 Proxy sia configurato
      ansible.builtin.debug:
        msg: >
          ATTENZIONE: install_oauth2_proxy non abilitato in oke.yml.
          Le IngressRoute per servizi protetti non avranno autenticazione.
      when: not (auth_available | bool)

    # =========================================================================
    # OAuth2 Proxy (Google SSO)
    # Deploy: ConfigMap email + Deployment + Service + ForwardAuth Middleware
    # IngressRoute: auth.DOMAIN (callback) + catch-all /oauth2/ (sign-in)
    # =========================================================================
    - name: Crea ConfigMap email autorizzate
      ansible.builtin.shell: |
        kubectl create configmap oauth2-proxy-emails \
          --namespace traefik \
          --from-literal=allowed-emails.txt="{{ oauth2_proxy_allowed_emails | join('\n') }}" \
          --dry-run=client -o yaml | kubectl apply -f -
      register: cm_result
      changed_when: "'created' in cm_result.stdout or 'configured' in cm_result.stdout"
      when: install_oauth2_proxy | default(false)

    - name: Deploy OAuth2 Proxy
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: oauth2-proxy
            namespace: traefik
            labels:
              app: oauth2-proxy
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: oauth2-proxy
            template:
              metadata:
                labels:
                  app: oauth2-proxy
              spec:
                nodeSelector:
                  workload: light
                containers:
                  - name: oauth2-proxy
                    image: quay.io/oauth2-proxy/oauth2-proxy:latest
                    args:
                      - --provider=google
                      - --client-id={{ oauth2_proxy_client_id }}
                      - --client-secret={{ oauth2_proxy_client_secret }}
                      - --cookie-secret={{ oauth2_proxy_cookie_secret }}
                      - --cookie-domain=.{{ base_domain }}
                      - --whitelist-domain=.{{ base_domain }}
                      - --email-domain=*
                      - --authenticated-emails-file=/config/allowed-emails.txt
                      - --reverse-proxy=true
                      - --set-xauthrequest=true
                      - --upstream=static://202
                      - --redirect-url=https://{{ domain_auth }}/oauth2/callback
                      - --http-address=0.0.0.0:4180
                    ports:
                      - containerPort: 4180
                    resources:
                      limits:
                        cpu: 100m
                        memory: 128Mi
                      requests:
                        cpu: 10m
                        memory: 32Mi
                    volumeMounts:
                      - name: emails
                        mountPath: /config
                        readOnly: true
                volumes:
                  - name: emails
                    configMap:
                      name: oauth2-proxy-emails
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: oauth2-proxy
            namespace: traefik
            labels:
              app: oauth2-proxy
          spec:
            selector:
              app: oauth2-proxy
            ports:
              - name: http
                port: 4180
                targetPort: 4180
      register: oauth2_result
      changed_when: "'created' in oauth2_result.stdout or 'configured' in oauth2_result.stdout"
      when: install_oauth2_proxy | default(false)

    - name: Attendi OAuth2 Proxy ready
      ansible.builtin.command: >
        kubectl rollout status deployment oauth2-proxy
        --namespace traefik --timeout=120s
      changed_when: false
      when: install_oauth2_proxy | default(false)

    - name: Crea Middleware ForwardAuth (Google SSO)
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: google-auth
            namespace: traefik
          spec:
            forwardAuth:
              address: http://oauth2-proxy.traefik.svc:4180
              trustForwardHeader: true
              authResponseHeaders:
                - X-Auth-Request-User
                - X-Auth-Request-Email
      register: fa_result
      changed_when: "'created' in fa_result.stdout or 'configured' in fa_result.stdout"
      when: install_oauth2_proxy | default(false)

    - name: Crea IngressRoute auth.DOMAIN (OAuth2 callback da Google)
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: oauth2-proxy-auth-domain
            namespace: traefik
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_auth }}`)
                kind: Rule
                services:
                  - name: oauth2-proxy
                    port: 4180
            tls:
              certResolver: letsencrypt
      register: auth_route_result
      changed_when: "'created' in auth_route_result.stdout or 'configured' in auth_route_result.stdout"
      when: install_oauth2_proxy | default(false)

    - name: Crea IngressRoute catch-all /oauth2/ (sign-in su qualsiasi host)
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: oauth2-proxy-catchall
            namespace: traefik
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: PathPrefix(`/oauth2/`)
                kind: Rule
                priority: 1000
                services:
                  - name: oauth2-proxy
                    port: 4180
            tls:
              certResolver: letsencrypt
      register: catchall_result
      changed_when: "'created' in catchall_result.stdout or 'configured' in catchall_result.stdout"
      when: install_oauth2_proxy | default(false)

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Riepilogo Domain Setup
      ansible.builtin.debug:
        msg:
          - "=== Domain Setup Completato ==="
          - ""
          - "Base domain:     {{ base_domain }}"
          - "Modalita':       Traefik ACME Let's Encrypt ({{ 'TCP forwarding via micro-gw' if (install_reverse_proxy | default(false)) else 'diretto' }})"
          - "Entrypoint:      websecure"
          - "Auth:            {{ 'OAuth2 Proxy (Google SSO)' if (install_oauth2_proxy | default(false)) else 'NESSUNO' }}"
          - ""
          - "--- IngressRoute (gestite da questo playbook) ---"
          - "OAuth2 Proxy: {{ 'https://' ~ domain_auth if (install_oauth2_proxy | default(false)) else 'saltato' }}"
          - ""
          - "--- Verifica ---"
          - "kubectl get ingressroute -A"
