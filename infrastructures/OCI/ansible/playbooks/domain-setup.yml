---
# Domain Setup - HTTPS routing via sottodomini per tutti i servizi K8s
# Supporta BasicAuth (htpasswd) OPPURE OAuth2 Proxy (Google SSO)
# Supporta due modalita':
#   1. Traefik diretto (ACME): IngressRoute con entryPoint websecure + certResolver
#   2. Reverse Proxy (Caddy): IngressRoute con entryPoint web (HTTP da Caddy, TLS gestito da Caddy)
# Auth per-servizio: ogni servizio protetto puo' essere escluso dall'auth via auth_<servizio>: false
#
# Prerequisiti: post-cluster-setup.yml (Traefik), DNS A record configurati
#
# Uso: ansible-playbook ansible/playbooks/domain-setup.yml
- name: OKE Domain Setup (HTTPS IngressRoute per tutti i servizi)
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  vars:
    domain_traefik: "{{ traefik_subdomain | default('traefik') }}.{{ base_domain }}"
    domain_argocd: "{{ argocd_subdomain | default('argocd') }}.{{ base_domain }}"
    domain_tekton: "{{ tekton_subdomain | default('tekton') }}.{{ base_domain }}"
    domain_prometheus: "{{ prometheus_subdomain | default('prometheus') }}.{{ base_domain }}"
    domain_alertmanager: "{{ alertmanager_subdomain | default('alertmanager') }}.{{ base_domain }}"
    domain_loki: "{{ loki_subdomain | default('loki') }}.{{ base_domain }}"
    domain_dashboard: "{{ dashboard_subdomain | default('dashboard') }}.{{ base_domain }}"
    domain_jaeger: "{{ jaeger_subdomain | default('jaeger') }}.{{ base_domain }}"
    domain_auth: "{{ auth_subdomain | default('auth') }}.{{ base_domain }}"
    domain_events: "{{ events_subdomain | default('events') }}.{{ base_domain }}"
    domain_airflow: "{{ airflow_subdomain | default('airflow') }}.{{ base_domain }}"
    domain_velero: "{{ velero_subdomain | default('velero') }}.{{ base_domain }}"
    domain_vpn: "{{ vpn_subdomain | default('vpn') }}.{{ base_domain }}"
    # Middleware dinamico: google-auth (OAuth2 Proxy) oppure basicauth (htpasswd)
    auth_middleware_name: "{{ 'google-auth' if (install_oauth2_proxy | default(false)) else 'basicauth' }}"
    auth_available: "{{ (install_oauth2_proxy | default(false)) or (basicauth_users is defined) }}"
    # Entrypoint: web (HTTP da Caddy) oppure websecure (HTTPS diretto)
    route_entrypoint: "{{ 'web' if (install_reverse_proxy | default(false)) else 'websecure' }}"

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica che base_domain sia definito
      ansible.builtin.assert:
        that: base_domain is defined
        fail_msg: "base_domain non definito in oke.yml. Configurare per abilitare HTTPS routing."

    - name: Verifica kubectl disponibile
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Verifica che almeno un metodo di auth sia configurato
      ansible.builtin.debug:
        msg: >
          ATTENZIONE: nessun metodo di autenticazione configurato.
          Configurare basicauth_users OPPURE install_oauth2_proxy in oke.yml.
          Le IngressRoute per servizi protetti non verranno create.
      when: not (auth_available | bool)

    # =========================================================================
    # Opzione A: BasicAuth Secret + Middleware (quando OAuth2 Proxy NON attivo)
    # =========================================================================
    - name: Crea Secret BasicAuth per Traefik
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: basicauth-secret
            namespace: traefik
          type: Opaque
          stringData:
            users: "{{ basicauth_users }}"
      register: secret_result
      changed_when: "'created' in secret_result.stdout or 'configured' in secret_result.stdout"
      when:
        - basicauth_users is defined
        - not (install_oauth2_proxy | default(false))

    - name: Crea Middleware BasicAuth
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: basicauth
            namespace: traefik
          spec:
            basicAuth:
              secret: basicauth-secret
      register: mw_result
      changed_when: "'created' in mw_result.stdout or 'configured' in mw_result.stdout"
      when:
        - basicauth_users is defined
        - not (install_oauth2_proxy | default(false))

    # =========================================================================
    # Opzione B: OAuth2 Proxy (Google SSO)
    # Deploy: ConfigMap email + Deployment + Service + ForwardAuth Middleware
    # IngressRoute: auth.DOMAIN (callback) + catch-all /oauth2/ (sign-in)
    # =========================================================================
    - name: Crea ConfigMap email autorizzate
      ansible.builtin.shell: |
        kubectl create configmap oauth2-proxy-emails \
          --namespace traefik \
          --from-literal=allowed-emails.txt="{{ oauth2_proxy_allowed_emails | join('\n') }}" \
          --dry-run=client -o yaml | kubectl apply -f -
      register: cm_result
      changed_when: "'created' in cm_result.stdout or 'configured' in cm_result.stdout"
      when: install_oauth2_proxy | default(false)

    - name: Deploy OAuth2 Proxy
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: oauth2-proxy
            namespace: traefik
            labels:
              app: oauth2-proxy
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: oauth2-proxy
            template:
              metadata:
                labels:
                  app: oauth2-proxy
              spec:
                nodeSelector:
                  workload: light
                containers:
                  - name: oauth2-proxy
                    image: quay.io/oauth2-proxy/oauth2-proxy:latest
                    args:
                      - --provider=google
                      - --client-id={{ oauth2_proxy_client_id }}
                      - --client-secret={{ oauth2_proxy_client_secret }}
                      - --cookie-secret={{ oauth2_proxy_cookie_secret }}
                      - --cookie-domain=.{{ base_domain }}
                      - --whitelist-domain=.{{ base_domain }}
                      - --email-domain=*
                      - --authenticated-emails-file=/config/allowed-emails.txt
                      - --reverse-proxy=true
                      - --set-xauthrequest=true
                      - --upstream=static://202
                      - --redirect-url=https://{{ domain_auth }}/oauth2/callback
                      - --http-address=0.0.0.0:4180
                    ports:
                      - containerPort: 4180
                    resources:
                      limits:
                        cpu: 100m
                        memory: 128Mi
                      requests:
                        cpu: 10m
                        memory: 32Mi
                    volumeMounts:
                      - name: emails
                        mountPath: /config
                        readOnly: true
                volumes:
                  - name: emails
                    configMap:
                      name: oauth2-proxy-emails
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: oauth2-proxy
            namespace: traefik
            labels:
              app: oauth2-proxy
          spec:
            selector:
              app: oauth2-proxy
            ports:
              - name: http
                port: 4180
                targetPort: 4180
      register: oauth2_result
      changed_when: "'created' in oauth2_result.stdout or 'configured' in oauth2_result.stdout"
      when: install_oauth2_proxy | default(false)

    - name: Attendi OAuth2 Proxy ready
      ansible.builtin.command: >
        kubectl rollout status deployment oauth2-proxy
        --namespace traefik --timeout=120s
      changed_when: false
      when: install_oauth2_proxy | default(false)

    - name: Crea Middleware ForwardAuth (Google SSO)
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: google-auth
            namespace: traefik
          spec:
            forwardAuth:
              address: http://oauth2-proxy.traefik.svc:4180
              trustForwardHeader: true
              authResponseHeaders:
                - X-Auth-Request-User
                - X-Auth-Request-Email
      register: fa_result
      changed_when: "'created' in fa_result.stdout or 'configured' in fa_result.stdout"
      when: install_oauth2_proxy | default(false)

    - name: Crea IngressRoute auth.DOMAIN (OAuth2 callback da Google)
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: oauth2-proxy-auth-domain
            namespace: traefik
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_auth }}`)
                kind: Rule
                services:
                  - name: oauth2-proxy
                    port: 4180
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: auth_route_result
      changed_when: "'created' in auth_route_result.stdout or 'configured' in auth_route_result.stdout"
      when: install_oauth2_proxy | default(false)

    - name: Crea IngressRoute catch-all /oauth2/ (sign-in su qualsiasi host)
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: oauth2-proxy-catchall
            namespace: traefik
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: PathPrefix(`/oauth2/`)
                kind: Rule
                priority: 1000
                services:
                  - name: oauth2-proxy
                    port: 4180
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: catchall_result
      changed_when: "'created' in catchall_result.stdout or 'configured' in catchall_result.stdout"
      when: install_oauth2_proxy | default(false)

    # =========================================================================
    # Traefik Dashboard (HTTPS + auth per-servizio)
    # =========================================================================
    - name: Crea IngressRoute per Traefik Dashboard
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: traefik-dashboard-https
            namespace: traefik
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_traefik }}`)
                kind: Rule
                services:
                  - kind: TraefikService
                    name: api@internal
          {% if (auth_traefik | default(true)) and (auth_available | bool) %}
                middlewares:
                  - name: {{ auth_middleware_name }}
                    namespace: traefik
          {% endif %}
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: route_result
      changed_when: "'created' in route_result.stdout or 'configured' in route_result.stdout"
      when: install_traefik | default(false)

    # =========================================================================
    # ArgoCD (HTTPS, no auth middleware - ha auth nativa)
    # =========================================================================
    - name: Rimuovi vecchia IngressRoute PathPrefix ArgoCD
      ansible.builtin.command: >
        kubectl delete ingressroute argocd-server
        --namespace argocd --ignore-not-found
      register: delete_result
      changed_when: "'deleted' in delete_result.stdout"
      when: install_argocd | default(false)

    - name: Rimuovi vecchia Middleware stripprefix ArgoCD
      ansible.builtin.command: >
        kubectl delete middleware argocd-stripprefix
        --namespace argocd --ignore-not-found
      register: delete_result
      changed_when: "'deleted' in delete_result.stdout"
      when: install_argocd | default(false)

    - name: Crea IngressRoute per ArgoCD
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: argocd-server-https
            namespace: argocd
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_argocd }}`)
                kind: Rule
                services:
                  - name: argocd-server
                    port: 80
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: route_result
      changed_when: "'created' in route_result.stdout or 'configured' in route_result.stdout"
      when: install_argocd | default(false)

    # =========================================================================
    # Tekton Dashboard (HTTPS, no auth middleware)
    # =========================================================================
    - name: Rimuovi vecchia IngressRoute PathPrefix Tekton
      ansible.builtin.command: >
        kubectl delete ingressroute tekton-dashboard
        --namespace tekton-pipelines --ignore-not-found
      register: delete_result
      changed_when: "'deleted' in delete_result.stdout"
      when: install_tekton | default(false)

    - name: Rimuovi vecchia Middleware stripprefix Tekton
      ansible.builtin.command: >
        kubectl delete middleware tekton-stripprefix
        --namespace tekton-pipelines --ignore-not-found
      register: delete_result
      changed_when: "'deleted' in delete_result.stdout"
      when: install_tekton | default(false)

    - name: Crea IngressRoute per Tekton Dashboard
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: tekton-dashboard-https
            namespace: tekton-pipelines
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_tekton }}`)
                kind: Rule
                services:
                  - name: tekton-dashboard
                    port: 9097
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: route_result
      changed_when: "'created' in route_result.stdout or 'configured' in route_result.stdout"
      when: install_tekton | default(false)

    # =========================================================================
    # Prometheus (HTTPS + auth per-servizio)
    # =========================================================================
    - name: Crea IngressRoute per Prometheus
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: prometheus-https
            namespace: monitoring
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_prometheus }}`)
                kind: Rule
                services:
                  - name: prometheus-server
                    port: 80
          {% if (auth_prometheus | default(true)) and (auth_available | bool) %}
                middlewares:
                  - name: {{ auth_middleware_name }}
                    namespace: traefik
          {% endif %}
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: route_result
      changed_when: "'created' in route_result.stdout or 'configured' in route_result.stdout"
      when: install_prometheus | default(false)

    # =========================================================================
    # Alertmanager (HTTPS + auth per-servizio)
    # =========================================================================
    - name: Crea IngressRoute per Alertmanager
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: alertmanager-https
            namespace: monitoring
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_alertmanager }}`)
                kind: Rule
                services:
                  - name: prometheus-alertmanager
                    port: 9093
          {% if (auth_alertmanager | default(true)) and (auth_available | bool) %}
                middlewares:
                  - name: {{ auth_middleware_name }}
                    namespace: traefik
          {% endif %}
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: route_result
      changed_when: "'created' in route_result.stdout or 'configured' in route_result.stdout"
      when: install_alertmanager | default(false)

    # =========================================================================
    # Loki (HTTPS + auth per-servizio)
    # =========================================================================
    - name: Crea IngressRoute per Loki
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: loki-https
            namespace: monitoring
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_loki }}`)
                kind: Rule
                services:
                  - name: loki
                    port: 3100
          {% if (auth_loki | default(true)) and (auth_available | bool) %}
                middlewares:
                  - name: {{ auth_middleware_name }}
                    namespace: traefik
          {% endif %}
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: route_result
      changed_when: "'created' in route_result.stdout or 'configured' in route_result.stdout"
      when: install_loki | default(false)

    # =========================================================================
    # Kubernetes Dashboard (HTTPS + auth per-servizio + insecureSkipVerify)
    # =========================================================================
    - name: Crea ServersTransport per K8s Dashboard (skip self-signed cert)
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: ServersTransport
          metadata:
            name: dashboard-transport
            namespace: monitoring
          spec:
            insecureSkipVerify: true
      register: transport_result
      changed_when: "'created' in transport_result.stdout or 'configured' in transport_result.stdout"
      when: install_dashboard | default(false)

    - name: Crea IngressRoute per K8s Dashboard
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: kubernetes-dashboard-https
            namespace: monitoring
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_dashboard }}`)
                kind: Rule
                services:
                  - name: kubernetes-dashboard-kong-proxy
                    port: 443
                    serversTransport: dashboard-transport
                    scheme: https
          {% if (auth_dashboard | default(true)) and (auth_available | bool) %}
                middlewares:
                  - name: {{ auth_middleware_name }}
                    namespace: traefik
          {% endif %}
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: route_result
      changed_when: "'created' in route_result.stdout or 'configured' in route_result.stdout"
      when: install_dashboard | default(false)

    # =========================================================================
    # Jaeger (HTTPS + auth per-servizio)
    # =========================================================================
    - name: Crea IngressRoute per Jaeger
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: jaeger-https
            namespace: monitoring
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_jaeger }}`)
                kind: Rule
                services:
                  - name: jaeger
                    port: 16686
          {% if (auth_jaeger | default(true)) and (auth_available | bool) %}
                middlewares:
                  - name: {{ auth_middleware_name }}
                    namespace: traefik
          {% endif %}
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: route_result
      changed_when: "'created' in route_result.stdout or 'configured' in route_result.stdout"
      when: install_jaeger | default(false)

    # =========================================================================
    # Backoffice Django (HTTPS, no auth middleware - ha auth nativa: Django admin + OAuth2 API)
    # =========================================================================
    - name: Crea IngressRoute per Backoffice Django
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: events-backoffice-https
            namespace: events
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_events }}`)
                kind: Rule
                services:
                  - name: backoffice
                    port: 8000
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: route_result
      changed_when: "'created' in route_result.stdout or 'configured' in route_result.stdout"
      when: install_backoffice | default(false)

    # =========================================================================
    # Airflow (HTTPS + auth per-servizio — extra layer sopra auth nativa Airflow)
    # =========================================================================
    - name: Crea IngressRoute per Airflow
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: airflow-webserver-https
            namespace: airflow
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_airflow }}`)
                kind: Rule
                services:
                  - name: airflow-webserver
                    port: 8080
          {% if (auth_airflow | default(true)) and (auth_available | bool) %}
                middlewares:
                  - name: {{ auth_middleware_name }}
                    namespace: traefik
          {% endif %}
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: route_result
      changed_when: "'created' in route_result.stdout or 'configured' in route_result.stdout"
      when: install_airflow | default(false)

    # =========================================================================
    # Velero UI (HTTPS + auth per-servizio — extra layer sopra BasicAuth nativo)
    # =========================================================================
    - name: Crea IngressRoute per Velero UI
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: velero-ui-https
            namespace: velero
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_velero }}`)
                kind: Rule
                services:
                  - name: velero-ui
                    port: 80
          {% if (auth_velero | default(true)) and (auth_available | bool) %}
                middlewares:
                  - name: {{ auth_middleware_name }}
                    namespace: traefik
          {% endif %}
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: route_result
      changed_when: "'created' in route_result.stdout or 'configured' in route_result.stdout"
      when: install_velero_ui | default(false)

    # =========================================================================
    # WireGuard VPN Web UI (HTTPS + auth per-servizio)
    # =========================================================================
    - name: Crea IngressRoute per WireGuard VPN Web UI
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: wireguard-ui-https
            namespace: wireguard
          spec:
            entryPoints:
              - {{ route_entrypoint }}
            routes:
              - match: Host(`{{ domain_vpn }}`)
                kind: Rule
                services:
                  - name: wireguard
                    port: 51821
          {% if (auth_vpn | default(true)) and (auth_available | bool) %}
                middlewares:
                  - name: {{ auth_middleware_name }}
                    namespace: traefik
          {% endif %}
          {% if not (install_reverse_proxy | default(false)) %}
            tls:
              certResolver: letsencrypt
          {% endif %}
      register: route_result
      changed_when: "'created' in route_result.stdout or 'configured' in route_result.stdout"
      when: install_wireguard | default(false)

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Riepilogo Domain Setup
      ansible.builtin.debug:
        msg:
          - "=== Domain Setup Completato ==="
          - ""
          - "Base domain:     {{ base_domain }}"
          - "Modalita':       {{ 'Reverse Proxy (Caddy su micro-cirunner)' if (install_reverse_proxy | default(false)) else 'Traefik diretto (ACME Let''s Encrypt)' }}"
          - "Entrypoint:      {{ route_entrypoint }}"
          - "Auth:            {{ 'OAuth2 Proxy (Google SSO)' if (install_oauth2_proxy | default(false)) else ('BasicAuth (htpasswd)' if (basicauth_users is defined) else 'NESSUNO') }}"
          - ""
          - "--- IngressRoute ---"
          - "Traefik Dashboard: {{ 'https://' ~ domain_traefik ~ (' (' ~ auth_middleware_name ~ ')' if ((auth_traefik | default(true)) and (auth_available | bool)) else ' (no auth)') if (install_traefik | default(false)) else 'saltato' }}"
          - "ArgoCD:            {{ 'https://' ~ domain_argocd ~ ' (auth nativa)' if (install_argocd | default(false)) else 'saltato' }}"
