---
# Domain Setup — OAuth2 Proxy (Google SSO) per servizi K8s
# Crea Secret e ConfigMap, poi applica i manifest da k8s/oauth/
#
# Prerequisiti:
#   - install_oauth2_proxy: true in oke.yml
#   - Credenziali Google OAuth in oke-vault.yml
#   - Traefik installato (traefik-setup.yml)
#   - DNS A record: auth.oci.santocaruso.eu verso IP pubblico
#
# Uso: ansible-playbook ansible/playbooks/domain-setup.yml --ask-vault-pass
- name: OKE Domain Setup (OAuth2 Proxy)
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  vars:
    oauth_k8s_dir: "{{ playbook_dir }}/../../k8s/oauth"

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica che install_oauth2_proxy sia abilitato
      ansible.builtin.assert:
        that: install_oauth2_proxy | default(false)
        fail_msg: "install_oauth2_proxy non abilitato in oke.yml."

    - name: Verifica kubectl disponibile
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    # =========================================================================
    # Secret
    # =========================================================================
    - name: Crea Secret oauth2-proxy-secret
      ansible.builtin.command: >
        kubectl create secret generic oauth2-proxy-secret
        --namespace traefik
        --from-literal=client-id={{ oauth2_proxy_client_id }}
        --from-literal=client-secret={{ oauth2_proxy_client_secret }}
        --from-literal=cookie-secret={{ oauth2_proxy_cookie_secret }}
      register: secret_result
      changed_when: "'created' in secret_result.stdout"
      failed_when:
        - secret_result.rc != 0
        - "'already exists' not in secret_result.stderr"

    # =========================================================================
    # ConfigMap (email autorizzate)
    # =========================================================================
    - name: Crea ConfigMap email autorizzate
      ansible.builtin.shell: |
        kubectl create configmap oauth2-proxy-emails \
          --namespace traefik \
          --from-literal=allowed-emails.txt="{{ oauth2_proxy_allowed_emails | join('\n') }}" \
          --dry-run=client -o yaml | kubectl apply -f -
      register: cm_result
      changed_when: "'created' in cm_result.stdout or 'configured' in cm_result.stdout"

    # =========================================================================
    # Manifest K8s (Kustomize)
    # =========================================================================
    - name: Applica manifest Kustomize (Deployment, Service, Middleware, IngressRoute)
      ansible.builtin.command: kubectl apply -k {{ oauth_k8s_dir }}
      register: kustomize_result
      changed_when: "'created' in kustomize_result.stdout or 'configured' in kustomize_result.stdout"

    - name: Attendi OAuth2 Proxy ready
      ansible.builtin.command: >
        kubectl rollout status deployment oauth2-proxy
        --namespace traefik --timeout=120s
      changed_when: false

    # =========================================================================
    # Verifica
    # =========================================================================
    - name: Verifica pods OAuth2 Proxy
      ansible.builtin.command: kubectl get pods -n traefik -l app=oauth2-proxy
      register: pods_result
      changed_when: false

    - name: Verifica Middleware
      ansible.builtin.command: kubectl get middleware -n traefik
      register: mw_result
      changed_when: false

    - name: Verifica IngressRoute
      ansible.builtin.command: kubectl get ingressroute -n traefik
      register: ingress_result
      changed_when: false

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Riepilogo Domain Setup
      ansible.builtin.debug:
        msg:
          - "=== OAuth2 Proxy Setup Completato ==="
          - ""
          - "Auth URL:    https://auth.oci.santocaruso.eu"
          - "Middleware:   google-auth (namespace traefik)"
          - "Email:       {{ oauth2_proxy_allowed_emails | join(', ') }}"
          - ""
          - "--- Pods ---"
          - "{{ pods_result.stdout }}"
          - ""
          - "--- Middleware ---"
          - "{{ mw_result.stdout }}"
          - ""
          - "--- IngressRoute ---"
          - "{{ ingress_result.stdout }}"
