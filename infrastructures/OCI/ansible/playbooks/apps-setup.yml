---
# Apps — Backoffice Django + Secret con credenziali sensibili
# Crea namespace apps, OCIR imagePullSecret, Secret e applica manifest K8s
#
# Prerequisiti:
#   - PostgreSQL già installato (database-setup.yml)
#   - Redis già installato (k8s/redis/)
#   - Keycloak già installato (apisix-keycloak-setup.yml)
#   - Secret vars in oke-vault.yml
#   - kubectl configurato
#
# Uso: ansible-playbook ansible/playbooks/apps-setup.yml --ask-vault-pass
- name: Apps (Backoffice) Setup
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  vars:
    backoffice_k8s_dir: "{{ playbook_dir }}/../../k8s/events-backoffice"

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica kubectl disponibile
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    # =========================================================================
    # Namespace
    # =========================================================================
    - name: Crea namespace apps
      ansible.builtin.command: kubectl create namespace apps
      register: ns_result
      changed_when: "'created' in ns_result.stdout"
      failed_when:
        - ns_result.rc != 0
        - "'already exists' not in ns_result.stderr"

    # =========================================================================
    # OCIR imagePullSecret
    # =========================================================================
    - name: Crea OCIR imagePullSecret in namespace apps
      ansible.builtin.command:
        cmd: >
          kubectl create secret docker-registry ocir-secret
          --namespace apps
          --docker-server={{ ocir_endpoint }}
          --docker-username={{ ocir_username }}
          --docker-password={{ ocir_auth_token }}
          --dry-run=client -o yaml | kubectl apply -f -
      register: ocir_result
      changed_when: "'created' in ocir_result.stdout or 'configured' in ocir_result.stdout"

    # =========================================================================
    # Secret — credenziali sensibili per Backoffice Django
    # =========================================================================
    - name: Crea Secret backoffice-secret
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: backoffice-secret
            namespace: apps
          type: Opaque
          stringData:
            DJANGO_SECRET_KEY: "{{ backoffice_django_secret_key }}"
            POSTGRES_PASSWORD: "{{ postgres_password }}"
            GEMINI_API_KEY: "{{ backoffice_gemini_api_key }}"
            GROQ_API_KEY: "{{ backoffice_groq_api_key }}"
            CELERY_BROKER_URL: "{{ backoffice_celery_broker_url }}"
            CACHE_REDIS_URL: "{{ backoffice_cache_redis_url }}"
            AIRFLOW_API_USER: "{{ airflow_api_user }}"
            AIRFLOW_API_PASSWORD: "{{ airflow_api_password }}"
      register: secret_result
      changed_when: "'created' in secret_result.stdout or 'configured' in secret_result.stdout"

    # =========================================================================
    # Manifest K8s (Kustomize)
    # =========================================================================
    - name: Applica manifest Kustomize (ConfigMap, Deployment, Service)
      ansible.builtin.command: kubectl apply -k {{ backoffice_k8s_dir }}
      register: kustomize_result
      changed_when: "'created' in kustomize_result.stdout or 'configured' in kustomize_result.stdout"

    - name: Attendi Backoffice ready
      ansible.builtin.command: >
        kubectl rollout status deployment backoffice
        --namespace apps --timeout=300s
      changed_when: false

    # =========================================================================
    # Verifica
    # =========================================================================
    - name: Verifica pods Backoffice
      ansible.builtin.command: kubectl get pods -n apps -l app=backoffice
      register: pods_result
      changed_when: false

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Riepilogo Apps Setup
      ansible.builtin.debug:
        msg:
          - "=== Apps (Backoffice) Setup Completato ==="
          - ""
          - "URL:          https://events.oci.santocaruso.eu"
          - "Admin:        https://events.oci.santocaruso.eu/admin/"
          - "API Docs:     https://events.oci.santocaruso.eu/docs/"
          - "PostgreSQL:   postgres.database.svc:5432 (database: events, user: events)"
          - ""
          - "--- Pods ---"
          - "{{ pods_result.stdout }}"
