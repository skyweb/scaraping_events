---
# Observability stack K8s: Prometheus, Loki, Promtail, OTEL Collector, Jaeger,
# Redis Exporter, Celery Exporter
# Esegue su localhost (richiede kubectl + helm configurati)
#
# Uso: ansible-playbook ansible/playbooks/observability-cluster-setup.yml
- name: OKE Observability - Cluster Stack
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica kubectl disponibile
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Verifica Helm disponibile
      ansible.builtin.command: helm version --short
      register: helm_version
      changed_when: false

    - name: Verifica namespace monitoring esiste
      ansible.builtin.command: kubectl get namespace monitoring
      register: ns_check
      changed_when: false
      failed_when: false

    - name: Crea namespace monitoring se mancante
      ansible.builtin.command: kubectl create namespace monitoring
      when: ns_check.rc != 0
      register: ns_result
      changed_when: "'created' in ns_result.stdout"

    # =========================================================================
    # Prometheus (prometheus-community/prometheus)
    # Server + kube-state-metrics + node-exporter + Alertmanager
    # =========================================================================
    - name: Aggiungi Helm repo prometheus-community
      ansible.builtin.command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      register: repo_result
      changed_when: "'has been added' in repo_result.stdout"
      failed_when:
        - repo_result.rc != 0
        - "'already exists' not in repo_result.stderr"
      when: install_prometheus | default(false)

    - name: Aggiorna Helm repos
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Crea values file Prometheus
      ansible.builtin.copy:
        dest: /tmp/prometheus-values.yml
        mode: "0644"
        content: |
          server:
            retention: {{ prometheus_retention | default('7d') }}
            persistentVolume:
              size: {{ prometheus_storage_size | default('10Gi') }}
            resources:
              limits:
                cpu: {{ prometheus_server_cpu_limit | default('500m') }}
                memory: {{ prometheus_server_memory_limit | default('512Mi') }}
              requests:
                cpu: 50m
                memory: 128Mi
            nodeSelector:
              workload: light
            service:
              type: NodePort
              nodePort: {{ prometheus_nodeport | default(31090) }}

          alertmanager:
            enabled: {{ install_alertmanager | default(false) | lower }}
            nodeSelector:
              workload: light
            resources:
              limits:
                cpu: {{ alertmanager_cpu_limit | default('100m') }}
                memory: {{ alertmanager_memory_limit | default('128Mi') }}
              requests:
                cpu: 10m
                memory: 32Mi
            service:
              type: NodePort
              nodePort: {{ alertmanager_nodeport | default(31093) }}
            persistentVolume:
              size: 2Gi

          prometheus-pushgateway:
            enabled: false

          kube-state-metrics:
            resources:
              limits:
                cpu: 100m
                memory: 64Mi
              requests:
                cpu: 10m
                memory: 32Mi

          prometheus-node-exporter:
            resources:
              limits:
                cpu: 100m
                memory: 64Mi
              requests:
                cpu: 10m
                memory: 32Mi

          # Scrape target applicativi (i target non ancora deployati restano "down")
          extraScrapeConfigs: |
            - job_name: otel-spanmetrics
              static_configs:
                - targets: ['otel-collector-opentelemetry-collector.monitoring.svc:8889']
              metrics_path: /metrics
              scrape_interval: 15s

            - job_name: django
              static_configs:
                - targets: ['backoffice.events.svc:8000']
              metrics_path: /metrics
              scrape_interval: 15s

            - job_name: redis-exporter
              static_configs:
                - targets: ['redis-exporter.monitoring.svc:9121']
              metrics_path: /metrics
              scrape_interval: 15s

            - job_name: celery-exporter
              static_configs:
                - targets: ['celery-exporter.monitoring.svc:9808']
              metrics_path: /metrics
              scrape_interval: 15s

            - job_name: jaeger-spanmetrics
              static_configs:
                - targets: ['jaeger.monitoring.svc:8889']
              metrics_path: /metrics
              scrape_interval: 15s
      when: install_prometheus | default(false)

    - name: Installa Prometheus via Helm
      ansible.builtin.command: >
        helm upgrade --install prometheus prometheus-community/prometheus
        --namespace monitoring
        --values /tmp/prometheus-values.yml
      register: prom_result
      changed_when: "'STATUS: deployed' in prom_result.stdout"
      when: install_prometheus | default(false)

    - name: Attendi Prometheus server ready
      ansible.builtin.command: >
        kubectl rollout status deployment prometheus-server
        --namespace monitoring --timeout=180s
      changed_when: false
      when: install_prometheus | default(false)

    - name: Attendi Alertmanager ready
      ansible.builtin.command: >
        kubectl rollout status statefulset prometheus-alertmanager
        --namespace monitoring --timeout=180s
      changed_when: false
      when:
        - install_prometheus | default(false)
        - install_alertmanager | default(false)

    # =========================================================================
    # Loki (grafana/loki) - SingleBinary mode
    # =========================================================================
    - name: Aggiungi Helm repo grafana
      ansible.builtin.command: helm repo add grafana https://grafana.github.io/helm-charts
      register: repo_result
      changed_when: "'has been added' in repo_result.stdout"
      failed_when:
        - repo_result.rc != 0
        - "'already exists' not in repo_result.stderr"
      when: install_loki | default(false)

    - name: Aggiorna Helm repos (grafana)
      ansible.builtin.command: helm repo update
      changed_when: false
      when: install_loki | default(false)

    - name: Crea values file Loki
      ansible.builtin.copy:
        dest: /tmp/loki-values.yml
        mode: "0644"
        content: |
          deploymentMode: SingleBinary
          loki:
            auth_enabled: false
            commonConfig:
              replication_factor: 1
            storage:
              type: filesystem
            limits_config:
              retention_period: {{ loki_retention_period | default('168h') }}
            schemaConfig:
              configs:
                - from: "2024-01-01"
                  store: tsdb
                  object_store: filesystem
                  schema: v13
                  index:
                    prefix: index_
                    period: 24h
          singleBinary:
            replicas: 1
            resources:
              limits:
                cpu: {{ loki_cpu_limit | default('250m') }}
                memory: {{ loki_memory_limit | default('256Mi') }}
              requests:
                cpu: 10m
                memory: 64Mi
            nodeSelector:
              workload: light
          read:
            replicas: 0
          write:
            replicas: 0
          backend:
            replicas: 0
          gateway:
            enabled: false
          chunksCache:
            enabled: false
          resultsCache:
            enabled: false
      when: install_loki | default(false)

    - name: Installa Loki via Helm (SingleBinary)
      ansible.builtin.command: >
        helm upgrade --install loki grafana/loki
        --namespace monitoring
        --values /tmp/loki-values.yml
      register: loki_result
      changed_when: "'STATUS: deployed' in loki_result.stdout"
      when: install_loki | default(false)

    - name: Attendi Loki ready
      ansible.builtin.command: >
        kubectl rollout status statefulset loki
        --namespace monitoring --timeout=180s
      changed_when: false
      when: install_loki | default(false)

    - name: Crea Loki NodePort Service
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: v1
          kind: Service
          metadata:
            name: loki-nodeport
            namespace: monitoring
            labels:
              app: loki
          spec:
            type: NodePort
            selector:
              app.kubernetes.io/name: loki
              app.kubernetes.io/component: single-binary
            ports:
              - name: http
                port: 3100
                targetPort: http-metrics
                nodePort: {{ loki_nodeport | default(31100) }}
      register: loki_svc_result
      changed_when: "'created' in loki_svc_result.stdout or 'configured' in loki_svc_result.stdout"
      when: install_loki | default(false)

    # =========================================================================
    # Promtail (grafana/promtail) - DaemonSet log shipper
    # Pipeline stages per parsing JSON log Django/Celery su K8s
    # =========================================================================
    - name: Crea values file Promtail
      ansible.builtin.copy:
        dest: /tmp/promtail-values.yml
        mode: "0644"
        content: |
          resources:
            limits:
              cpu: {{ promtail_cpu_limit | default('100m') }}
              memory: {{ promtail_memory_limit | default('64Mi') }}
            requests:
              cpu: 10m
              memory: 32Mi
          config:
            clients:
              - url: http://loki:3100/loki/api/v1/push
            snippets:
              pipelineStages:
                - cri: {}
                - match:
                    selector: '{namespace="events", container=~"backoffice|celery-worker|celery-beat"}'
                    stages:
                      - json:
                          expressions:
                            level: level
                            logger: logger
                      - labels:
                          level:
                          logger:
      when: install_promtail | default(false)

    - name: Installa Promtail via Helm
      ansible.builtin.command: >
        helm upgrade --install promtail grafana/promtail
        --namespace monitoring
        --values /tmp/promtail-values.yml
      register: promtail_result
      changed_when: "'STATUS: deployed' in promtail_result.stdout"
      when: install_promtail | default(false)

    - name: Attendi Promtail DaemonSet ready
      ansible.builtin.command: >
        kubectl rollout status daemonset promtail
        --namespace monitoring --timeout=120s
      changed_when: false
      when: install_promtail | default(false)

    # =========================================================================
    # OpenTelemetry Collector (DaemonSet) - contrib image
    # Receivers: OTLP gRPC/HTTP
    # Connectors: spanmetrics
    # Exporters: prometheusremotewrite, otlphttp/jaeger, prometheus, debug
    # =========================================================================
    - name: Aggiungi Helm repo open-telemetry
      ansible.builtin.command: helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
      register: repo_result
      changed_when: "'has been added' in repo_result.stdout"
      failed_when:
        - repo_result.rc != 0
        - "'already exists' not in repo_result.stderr"
      when: install_otel_collector | default(false)

    - name: Aggiorna Helm repos (open-telemetry)
      ansible.builtin.command: helm repo update
      changed_when: false
      when: install_otel_collector | default(false)

    - name: Crea values file OTEL Collector
      ansible.builtin.copy:
        dest: /tmp/otel-collector-values.yml
        mode: "0644"
        content: |
          mode: daemonset
          image:
            repository: docker.io/otel/opentelemetry-collector-contrib
          resources:
            limits:
              cpu: {{ otel_cpu_limit | default('200m') }}
              memory: {{ otel_memory_limit | default('128Mi') }}
            requests:
              cpu: 10m
              memory: 64Mi
          ports:
            spanmetrics:
              enabled: true
              containerPort: 8889
              servicePort: 8889
              protocol: TCP
          config:
            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                  http:
                    endpoint: 0.0.0.0:4318
            connectors:
              spanmetrics:
                histogram:
                  explicit:
                    buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
                dimensions:
                  - name: http.method
                  - name: http.status_code
                  - name: http.route
            processors:
              batch:
                timeout: 5s
                send_batch_size: 512
              memory_limiter:
                check_interval: 5s
                limit_mib: 100
                spike_limit_mib: 20
              resourcedetection:
                detectors: [env, system]
                timeout: 5s
                override: false
                system:
                  hostname_sources: ["os"]
                  resource_attributes:
                    host.name:
                      enabled: true
                    os.type:
                      enabled: true
                    host.arch:
                      enabled: true
            exporters:
              prometheusremotewrite:
                endpoint: http://prometheus-server.monitoring.svc:80/api/v1/write
              otlphttp/jaeger:
                endpoint: http://jaeger.monitoring.svc:4318
              prometheus:
                endpoint: 0.0.0.0:8889
              debug:
                verbosity: basic
            service:
              pipelines:
                traces:
                  receivers: [otlp]
                  processors: [memory_limiter, resourcedetection, batch]
                  exporters: [otlphttp/jaeger, spanmetrics, debug]
                metrics/spanmetrics:
                  receivers: [spanmetrics]
                  exporters: [prometheus]
                metrics:
                  receivers: [otlp]
                  processors: [memory_limiter, resourcedetection, batch]
                  exporters: [prometheusremotewrite, debug]
      when: install_otel_collector | default(false)

    - name: Installa OpenTelemetry Collector via Helm (DaemonSet)
      ansible.builtin.command: >
        helm upgrade --install otel-collector open-telemetry/opentelemetry-collector
        --namespace monitoring
        --values /tmp/otel-collector-values.yml
      register: otel_result
      changed_when: "'STATUS: deployed' in otel_result.stdout"
      when: install_otel_collector | default(false)

    - name: Attendi OTEL Collector DaemonSet ready
      ansible.builtin.command: >
        kubectl rollout status daemonset otel-collector-opentelemetry-collector-agent
        --namespace monitoring --timeout=120s
      changed_when: false
      when: install_otel_collector | default(false)

    # =========================================================================
    # Jaeger All-in-One (jaegertracing/jaeger) - Tracing UI
    # Storage in-memory, SPM abilitato via Prometheus
    # =========================================================================
    - name: Aggiungi Helm repo jaegertracing
      ansible.builtin.command: helm repo add jaegertracing https://jaegertracing.github.io/helm-charts
      register: repo_result
      changed_when: "'has been added' in repo_result.stdout"
      failed_when:
        - repo_result.rc != 0
        - "'already exists' not in repo_result.stderr"
      when: install_jaeger | default(false)

    - name: Aggiorna Helm repos (jaegertracing)
      ansible.builtin.command: helm repo update
      changed_when: false
      when: install_jaeger | default(false)

    - name: Crea values file Jaeger
      ansible.builtin.copy:
        dest: /tmp/jaeger-values.yml
        mode: "0644"
        content: |
          provisionDataStore:
            cassandra: false
          image:
            registry: docker.io
          allInOne:
            enabled: true
            replicas: 1
            extraEnv:
              - name: METRICS_STORAGE_TYPE
                value: prometheus
              - name: PROMETHEUS_SERVER_URL
                value: http://prometheus-server.monitoring.svc:80
              - name: PROMETHEUS_QUERY_NORMALIZE_CALLS
                value: "true"
              - name: PROMETHEUS_QUERY_NORMALIZE_DURATION
                value: "true"
            resources:
              limits:
                cpu: {{ jaeger_cpu_limit | default('500m') }}
                memory: {{ jaeger_memory_limit | default('512Mi') }}
              requests:
                cpu: 50m
                memory: 128Mi
            nodeSelector:
              workload: light
          storage:
            type: memory
          agent:
            enabled: false
          collector:
            enabled: false
          query:
            enabled: false
      when: install_jaeger | default(false)

    - name: Installa Jaeger via Helm (All-in-One)
      ansible.builtin.command: >
        helm upgrade --install jaeger jaegertracing/jaeger
        --namespace monitoring
        --values /tmp/jaeger-values.yml
      register: jaeger_result
      changed_when: "'STATUS: deployed' in jaeger_result.stdout"
      when: install_jaeger | default(false)

    - name: Attendi Jaeger ready
      ansible.builtin.command: >
        kubectl rollout status deployment jaeger
        --namespace monitoring --timeout=180s
      changed_when: false
      when: install_jaeger | default(false)

    - name: Crea Jaeger NodePort Service
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: v1
          kind: Service
          metadata:
            name: jaeger-nodeport
            namespace: monitoring
            labels:
              app: jaeger
          spec:
            type: NodePort
            selector:
              app.kubernetes.io/name: jaeger
              app.kubernetes.io/component: all-in-one
            ports:
              - name: http-query
                port: 16686
                targetPort: 16686
                nodePort: {{ jaeger_nodeport | default(31686) }}
      register: jaeger_svc_result
      changed_when: "'created' in jaeger_svc_result.stdout or 'configured' in jaeger_svc_result.stdout"
      when: install_jaeger | default(false)

    # =========================================================================
    # Redis Exporter (oliver006/redis_exporter)
    # Deployment + Service in namespace monitoring
    # =========================================================================
    - name: Deploy Redis Exporter
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: redis-exporter
            namespace: monitoring
            labels:
              app: redis-exporter
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: redis-exporter
            template:
              metadata:
                labels:
                  app: redis-exporter
              spec:
                nodeSelector:
                  workload: light
                containers:
                  - name: redis-exporter
                    image: docker.io/oliver006/redis_exporter:latest
                    ports:
                      - containerPort: 9121
                    env:
                      - name: REDIS_ADDR
                        value: "{{ redis_k8s_host | default('redis://redis.events.svc:6379') }}"
                      - name: REDIS_PASSWORD
                        value: "{{ redis_k8s_password | default('') }}"
                    resources:
                      limits:
                        cpu: {{ redis_exporter_cpu_limit | default('50m') }}
                        memory: {{ redis_exporter_memory_limit | default('64Mi') }}
                      requests:
                        cpu: 10m
                        memory: 32Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: redis-exporter
            namespace: monitoring
            labels:
              app: redis-exporter
          spec:
            selector:
              app: redis-exporter
            ports:
              - name: metrics
                port: 9121
                targetPort: 9121
      register: redis_exp_result
      changed_when: "'created' in redis_exp_result.stdout or 'configured' in redis_exp_result.stdout"
      when: install_redis_exporter | default(false)

    # =========================================================================
    # Celery Exporter (danihodovic/celery-exporter)
    # Deployment + Service in namespace monitoring
    # =========================================================================
    - name: Deploy Celery Exporter
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: celery-exporter
            namespace: monitoring
            labels:
              app: celery-exporter
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: celery-exporter
            template:
              metadata:
                labels:
                  app: celery-exporter
              spec:
                nodeSelector:
                  workload: light
                containers:
                  - name: celery-exporter
                    image: docker.io/danihodovic/celery-exporter:latest
                    ports:
                      - containerPort: 9808
                    args:
                      - --broker-url={{ celery_broker_url | default('redis://:CHANGE_ME@redis.events.svc:6379/0') }}
                    resources:
                      limits:
                        cpu: {{ celery_exporter_cpu_limit | default('50m') }}
                        memory: {{ celery_exporter_memory_limit | default('64Mi') }}
                      requests:
                        cpu: 10m
                        memory: 32Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: celery-exporter
            namespace: monitoring
            labels:
              app: celery-exporter
          spec:
            selector:
              app: celery-exporter
            ports:
              - name: metrics
                port: 9808
                targetPort: 9808
      register: celery_exp_result
      changed_when: "'created' in celery_exp_result.stdout or 'configured' in celery_exp_result.stdout"
      when: install_celery_exporter | default(false)

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Riepilogo Observability Cluster
      ansible.builtin.debug:
        msg:
          - "=== Observability Cluster Setup Completato ==="
          - ""
          - "--- Componenti installati (namespace: monitoring) ---"
          - "Prometheus:      {{ 'NodePort ' ~ (prometheus_nodeport | default(31090)) ~ ' | retention: ' ~ (prometheus_retention | default('7d')) ~ ' | extraScrapeConfigs: otel-spanmetrics, django, redis, celery, jaeger' if (install_prometheus | default(false)) else 'saltato' }}"
          - "Alertmanager:    {{ 'NodePort ' ~ (alertmanager_nodeport | default(31093)) if (install_alertmanager | default(false)) else 'saltato' }}"
          - "Loki:            {{ 'NodePort ' ~ (loki_nodeport | default(31100)) ~ ' | SingleBinary | retention: ' ~ (loki_retention_period | default('168h')) if (install_loki | default(false)) else 'saltato' }}"
          - "Promtail:        {{ 'DaemonSet → Loki | pipeline stages: CRI + JSON parsing (events namespace)' if (install_promtail | default(false)) else 'saltato' }}"
          - "OTEL Collector:  {{ 'DaemonSet | contrib image | OTLP → Jaeger + spanmetrics + Prometheus' if (install_otel_collector | default(false)) else 'saltato' }}"
          - "Jaeger:          {{ 'NodePort ' ~ (jaeger_nodeport | default(31686)) ~ ' | All-in-One | memory storage | SPM via Prometheus' if (install_jaeger | default(false)) else 'saltato' }}"
          - "Redis Exporter:  {{ 'ClusterIP :9121 → ' ~ (redis_k8s_host | default('redis.events.svc')) if (install_redis_exporter | default(false)) else 'saltato (abilita con install_redis_exporter: true)' }}"
          - "Celery Exporter: {{ 'ClusterIP :9808' if (install_celery_exporter | default(false)) else 'saltato (abilita con install_celery_exporter: true)' }}"
          - ""
          - "--- Verifica ---"
          - "kubectl get pods -n monitoring"
          - "kubectl get svc -n monitoring"
          - ""
          - "--- Prossimo step: Grafana su micro VM ---"
          - "./scripts/generate-inventory.sh"
          - "ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/observability-vm-setup.yml"
