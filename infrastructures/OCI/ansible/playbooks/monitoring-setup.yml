---
# Monitoring Stack completo per OKE
# Installa tutti i componenti di observability usando i file in k8s/monitoring/
#
# Componenti: Prometheus, Loki, Promtail, Tempo, Grafana, OTEL Collector
# Manifest: redis-exporter, celery-exporter, IngressRoute (Kustomize)
#
# Prerequisiti:
#   - namespace monitoring esistente (creato da post-cluster-setup)
#   - grafana_admin_password in oke-vault.yml
#   - kubectl e helm configurati
#
# Uso: ansible-playbook ansible/playbooks/monitoring-setup.yml --ask-vault-pass
- name: OKE Monitoring Stack Setup
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  vars:
    monitoring_k8s_dir: "{{ playbook_dir }}/../../k8s/monitoring"

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica kubectl disponibile
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Verifica Helm disponibile
      ansible.builtin.command: helm version --short
      register: helm_version
      changed_when: false

    - name: Verifica namespace monitoring esiste
      ansible.builtin.command: kubectl get namespace monitoring
      changed_when: false

    # =========================================================================
    # Secret
    # =========================================================================
    - name: Crea Secret grafana-secret
      ansible.builtin.command: >
        kubectl create secret generic grafana-secret
        --namespace monitoring
        --from-literal=GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}
      register: secret_result
      changed_when: "'created' in secret_result.stdout"
      failed_when:
        - secret_result.rc != 0
        - "'already exists' not in secret_result.stderr"
      when: install_grafana | default(false)

    # =========================================================================
    # Helm repos
    # =========================================================================
    - name: Aggiungi Helm repo prometheus-community
      ansible.builtin.command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      register: repo_result
      changed_when: "'has been added' in repo_result.stdout"
      failed_when:
        - repo_result.rc != 0
        - "'already exists' not in repo_result.stderr"

    - name: Aggiungi Helm repo grafana
      ansible.builtin.command: helm repo add grafana https://grafana.github.io/helm-charts
      register: repo_result
      changed_when: "'has been added' in repo_result.stdout"
      failed_when:
        - repo_result.rc != 0
        - "'already exists' not in repo_result.stderr"

    - name: Aggiungi Helm repo open-telemetry
      ansible.builtin.command: helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
      register: repo_result
      changed_when: "'has been added' in repo_result.stdout"
      failed_when:
        - repo_result.rc != 0
        - "'already exists' not in repo_result.stderr"

    - name: Aggiorna Helm repos
      ansible.builtin.command: helm repo update
      changed_when: false

    # =========================================================================
    # Helm — Prometheus
    # =========================================================================
    - name: Installa Prometheus via Helm
      ansible.builtin.command: >
        helm upgrade --install prometheus prometheus-community/prometheus
        --namespace monitoring
        -f {{ monitoring_k8s_dir }}/prometheus-values.yml
      register: prometheus_result
      changed_when: "'STATUS: deployed' in prometheus_result.stdout"

    - name: Attendi Prometheus ready
      ansible.builtin.command: >
        kubectl rollout status deployment prometheus-server
        --namespace monitoring --timeout=180s
      changed_when: false

    # =========================================================================
    # Helm — Loki
    # =========================================================================
    - name: Installa Loki via Helm
      ansible.builtin.command: >
        helm upgrade --install loki grafana/loki
        --namespace monitoring
        -f {{ monitoring_k8s_dir }}/loki-values.yml
      register: loki_result
      changed_when: "'STATUS: deployed' in loki_result.stdout"

    - name: Attendi Loki ready
      ansible.builtin.command: >
        kubectl rollout status statefulset loki
        --namespace monitoring --timeout=180s
      changed_when: false

    # =========================================================================
    # Helm — Promtail
    # =========================================================================
    - name: Installa Promtail via Helm
      ansible.builtin.command: >
        helm upgrade --install promtail grafana/promtail
        --namespace monitoring
        -f {{ monitoring_k8s_dir }}/promtail-values.yml
      register: promtail_result
      changed_when: "'STATUS: deployed' in promtail_result.stdout"

    - name: Attendi Promtail ready
      ansible.builtin.command: >
        kubectl rollout status daemonset promtail
        --namespace monitoring --timeout=180s
      changed_when: false

    # =========================================================================
    # Helm — Tempo
    # =========================================================================
    - name: Installa Tempo via Helm
      ansible.builtin.command: >
        helm upgrade --install tempo grafana/tempo
        --namespace monitoring
        -f {{ monitoring_k8s_dir }}/tempo-values.yml
      register: tempo_result
      changed_when: "'STATUS: deployed' in tempo_result.stdout"
      when: install_tempo | default(false)

    - name: Attendi Tempo ready
      ansible.builtin.command: >
        kubectl rollout status statefulset tempo
        --namespace monitoring --timeout=180s
      changed_when: false
      when: install_tempo | default(false)

    # =========================================================================
    # Helm — Grafana
    # =========================================================================
    - name: Installa Grafana via Helm
      ansible.builtin.command: >
        helm upgrade --install grafana grafana/grafana
        --namespace monitoring
        -f {{ monitoring_k8s_dir }}/grafana-values.yml
      register: grafana_result
      changed_when: "'STATUS: deployed' in grafana_result.stdout"
      when: install_grafana | default(false)

    - name: Attendi Grafana ready
      ansible.builtin.command: >
        kubectl rollout status deployment grafana
        --namespace monitoring --timeout=180s
      changed_when: false
      when: install_grafana | default(false)

    # =========================================================================
    # Helm — OTEL Collector
    # =========================================================================
    - name: Installa OTEL Collector via Helm
      ansible.builtin.command: >
        helm upgrade --install otel-collector open-telemetry/opentelemetry-collector
        --namespace monitoring
        -f {{ monitoring_k8s_dir }}/otel-collector-values.yml
      register: otel_result
      changed_when: "'STATUS: deployed' in otel_result.stdout"

    - name: Attendi OTEL Collector ready
      ansible.builtin.command: >
        kubectl rollout status daemonset otel-collector-opentelemetry-collector
        --namespace monitoring --timeout=180s
      changed_when: false

    # =========================================================================
    # Manifest K8s (Kustomize)
    # =========================================================================
    - name: Applica manifest Kustomize (exporter, IngressRoute)
      ansible.builtin.command: kubectl apply -k {{ monitoring_k8s_dir }}
      register: kustomize_result
      changed_when: "'created' in kustomize_result.stdout or 'configured' in kustomize_result.stdout"

    # =========================================================================
    # Verifica
    # =========================================================================
    - name: Verifica pods monitoring
      ansible.builtin.command: kubectl get pods -n monitoring
      register: pods_result
      changed_when: false

    - name: Verifica services monitoring
      ansible.builtin.command: kubectl get svc -n monitoring
      register: svc_result
      changed_when: false

    - name: Verifica IngressRoute monitoring
      ansible.builtin.command: kubectl get ingressroute -n monitoring
      register: ingress_result
      changed_when: false

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Riepilogo Monitoring Stack
      ansible.builtin.debug:
        msg:
          - "=== Monitoring Stack Setup Completato ==="
          - ""
          - "--- Componenti Helm ---"
          - "Prometheus:      installato"
          - "Loki:            installato"
          - "Promtail:        installato"
          - "Tempo:           {{ 'installato' if (install_tempo | default(false)) else 'saltato' }}"
          - "Grafana:         {{ 'installato — https://grafana.oci.santocaruso.eu' if (install_grafana | default(false)) else 'saltato' }}"
          - "OTEL Collector:  installato"
          - ""
          - "--- Manifest Kustomize ---"
          - "redis-exporter, celery-exporter, IngressRoute (prometheus, alertmanager, loki, grafana, dashboard, traefik)"
          - ""
          - "--- Pods ---"
          - "{{ pods_result.stdout }}"
          - ""
          - "--- IngressRoute ---"
          - "{{ ingress_result.stdout }}"
