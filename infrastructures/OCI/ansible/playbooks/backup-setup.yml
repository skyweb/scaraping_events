---
# Backup & Disaster Recovery per OKE con Velero
# Installa Velero via Helm usando i file in k8s/velero/ e applica i manifest Kustomize.
#
# Prima di eseguire:
#   1. Crea un bucket OCI Object Storage (velero-backups)
#   2. Genera Customer Secret Key: OCI Console > User Settings > Customer Secret Keys
#   3. Configura ansible/vars/oke.yml e oke-vault.yml con le credenziali
#
# Uso: ansible-playbook ansible/playbooks/backup-setup.yml --ask-vault-pass
- name: OKE Backup Setup (Velero)
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  vars:
    velero_k8s_dir: "{{ playbook_dir }}/../../k8s/velero"

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica che install_velero sia abilitato
      ansible.builtin.assert:
        that: install_velero | default(false)
        fail_msg: "install_velero non abilitato in oke.yml."

    - name: Verifica kubectl disponibile
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Verifica Helm disponibile
      ansible.builtin.command: helm version --short
      register: helm_version
      changed_when: false

    # =========================================================================
    # Namespace
    # =========================================================================
    - name: Crea namespace velero
      ansible.builtin.command: kubectl create namespace velero
      register: ns_result
      changed_when: "'created' in ns_result.stdout"
      failed_when:
        - ns_result.rc != 0
        - "'already exists' not in ns_result.stderr"

    # =========================================================================
    # Credenziali OCI Object Storage
    # =========================================================================
    - name: Crea file credenziali temporaneo per Velero
      ansible.builtin.copy:
        dest: /tmp/velero-credentials
        mode: "0600"
        content: |
          [default]
          aws_access_key_id={{ velero_aws_access_key_id }}
          aws_secret_access_key={{ velero_aws_secret_access_key }}

    - name: Crea Secret velero-credentials
      ansible.builtin.command: >
        kubectl create secret generic velero-credentials
        --from-file=cloud=/tmp/velero-credentials
        --namespace=velero
      register: secret_result
      changed_when: "'created' in secret_result.stdout"
      failed_when:
        - secret_result.rc != 0
        - "'already exists' not in secret_result.stderr"

    - name: Rimuovi file credenziali temporaneo
      ansible.builtin.file:
        path: /tmp/velero-credentials
        state: absent

    # =========================================================================
    # Helm — Velero
    # =========================================================================
    - name: Aggiungi Helm repo vmware-tanzu
      ansible.builtin.command: helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
      register: repo_result
      changed_when: "'has been added' in repo_result.stdout"
      failed_when:
        - repo_result.rc != 0
        - "'already exists' not in repo_result.stderr"

    - name: Aggiorna Helm repos
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Installa Velero via Helm
      ansible.builtin.command: >
        helm upgrade --install velero vmware-tanzu/velero
        --namespace velero
        -f {{ velero_k8s_dir }}/velero-values.yml
        --set configuration.backupStorageLocation[0].bucket={{ velero_bucket_name }}
        --set configuration.backupStorageLocation[0].config.region={{ velero_s3_region }}
        --set configuration.backupStorageLocation[0].config.s3Url={{ velero_s3_url }}
        --set configuration.volumeSnapshotLocation[0].config.region={{ velero_s3_region }}
      register: velero_result
      changed_when: "'STATUS: deployed' in velero_result.stdout"

    - name: Attendi Velero ready
      ansible.builtin.command: >
        kubectl rollout status deployment velero
        --namespace velero --timeout=180s
      changed_when: false

    # =========================================================================
    # Velero UI — Secret + Manifest Kustomize
    # =========================================================================
    - name: Crea Secret velero-ui-secret
      ansible.builtin.command: >
        kubectl create secret generic velero-ui-secret
        --namespace velero
        --from-literal=BASIC_AUTH_PASSWORD={{ velero_ui_password }}
      register: velero_ui_secret_result
      changed_when: "'created' in velero_ui_secret_result.stdout"
      failed_when:
        - velero_ui_secret_result.rc != 0
        - "'already exists' not in velero_ui_secret_result.stderr"
      when: install_velero_ui | default(false)

    - name: Applica manifest Kustomize (Velero UI + IngressRoute)
      ansible.builtin.command: kubectl apply -k {{ velero_k8s_dir }}
      register: kustomize_result
      changed_when: "'created' in kustomize_result.stdout or 'configured' in kustomize_result.stdout"
      when: install_velero_ui | default(false)

    # =========================================================================
    # Backup schedule
    # =========================================================================
    - name: Applica schedule backup giornaliero
      ansible.builtin.command: kubectl apply -f {{ velero_k8s_dir }}/daily-schedule.yml
      register: daily_result
      changed_when: "'created' in daily_result.stdout or 'configured' in daily_result.stdout"

    - name: Applica schedule backup settimanale cluster
      ansible.builtin.command: kubectl apply -f {{ velero_k8s_dir }}/weekly-schedule.yml
      register: weekly_result
      changed_when: "'created' in weekly_result.stdout or 'configured' in weekly_result.stdout"

    # =========================================================================
    # Verifica
    # =========================================================================
    - name: Verifica BackupStorageLocation
      ansible.builtin.command: kubectl get backupstoragelocation -n velero
      register: bsl_result
      changed_when: false

    - name: Verifica pods Velero
      ansible.builtin.command: kubectl get pods -n velero
      register: pods_result
      changed_when: false

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Riepilogo Velero
      ansible.builtin.debug:
        msg:
          - "=== Velero Backup Setup Completato ==="
          - ""
          - "Backup Storage: OCI Object Storage ({{ velero_bucket_name }})"
          - "S3 Endpoint:    {{ velero_s3_url }}"
          - "Velero UI:      {{ 'kubectl apply -k (ns velero)' if (install_velero_ui | default(false)) else 'non installato' }}"
          - ""
          - "--- BackupStorageLocation ---"
          - "{{ bsl_result.stdout }}"
          - ""
          - "--- Pods ---"
          - "{{ pods_result.stdout }}"
          - ""
          - "--- Schedule ---"
          - "daily-full-backup:     02:00 (ns: events, monitoring) - retention 7 giorni"
          - "weekly-cluster-backup: dom 03:00 (tutto il cluster) - retention 30 giorni"
          - ""
          - "--- Comandi utili ---"
          - "velero backup get                                     # lista backup"
          - "velero backup create manual-backup --include-namespaces events  # backup manuale"
          - "velero restore create --from-backup manual-backup     # restore"
          - "velero schedule get                                   # lista schedule"
