---
# Linkerd — Service Mesh con mTLS automatico
# Installa Linkerd CRDs, control plane e viz via Helm.
# Usa cert-manager per generare i certificati trust anchor e issuer.
#
# Prerequisiti:
#   - install_linkerd: true in oke.yml
#   - cert-manager installato (post-cluster-setup.yml)
#   - kubectl e helm configurati
#   - Traefik installato (traefik-setup.yml)
#   - OAuth2 Proxy installato (domain-setup.yml) per dashboard viz
#   - DNS A record: linkerd.oci.santocaruso.eu verso IP pubblico
#
# Uso: ansible-playbook ansible/playbooks/linkerd-setup.yml --ask-vault-pass
- name: Linkerd Setup
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  vars:
    linkerd_k8s_dir: "{{ playbook_dir }}/../../k8s/linkerd"

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica che install_linkerd sia abilitato
      ansible.builtin.assert:
        that: install_linkerd | default(false)
        fail_msg: "install_linkerd non abilitato in oke.yml."

    - name: Verifica kubectl disponibile
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Verifica Helm disponibile
      ansible.builtin.command: helm version --short
      register: helm_version
      changed_when: false

    - name: Verifica cert-manager installato
      ansible.builtin.command: kubectl get deployment cert-manager -n cert-manager
      register: cm_check
      changed_when: false

    # =========================================================================
    # Namespace
    # =========================================================================
    - name: Crea namespace linkerd
      ansible.builtin.command: kubectl create namespace linkerd
      register: ns_result
      changed_when: "'created' in ns_result.stdout"
      failed_when:
        - ns_result.rc != 0
        - "'already exists' not in ns_result.stderr"

    - name: Crea namespace linkerd-viz
      ansible.builtin.command: kubectl create namespace linkerd-viz
      register: ns_viz_result
      changed_when: "'created' in ns_viz_result.stdout"
      failed_when:
        - ns_viz_result.rc != 0
        - "'already exists' not in ns_viz_result.stderr"

    # =========================================================================
    # Certificati — Trust Anchor e Issuer via cert-manager
    # =========================================================================
    - name: Crea Trust Anchor CA (self-signed)
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: linkerd-trust-anchor-selfsigned
            namespace: linkerd
          spec:
            selfSigned: {}
          ---
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: linkerd-trust-anchor
            namespace: linkerd
          spec:
            isCA: true
            commonName: root.linkerd.cluster.local
            secretName: linkerd-trust-anchor
            duration: 87600h  # 10 anni
            renewBefore: 8760h  # rinnova 1 anno prima
            privateKey:
              algorithm: ECDSA
              size: 256
            issuerRef:
              name: linkerd-trust-anchor-selfsigned
              kind: Issuer
      register: anchor_result
      changed_when: "'created' in anchor_result.stdout or 'configured' in anchor_result.stdout"

    - name: Attendi che il certificato trust anchor sia pronto
      ansible.builtin.command: >
        kubectl wait certificate/linkerd-trust-anchor
        --namespace linkerd --for=condition=Ready --timeout=120s
      changed_when: false

    - name: Crea Identity Issuer (firmato dal trust anchor)
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: linkerd-identity-issuer
            namespace: linkerd
          spec:
            ca:
              secretName: linkerd-trust-anchor
          ---
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: linkerd-identity-issuer
            namespace: linkerd
          spec:
            isCA: true
            commonName: identity.linkerd.cluster.local
            secretName: linkerd-identity-issuer
            duration: 48h
            renewBefore: 25h
            privateKey:
              algorithm: ECDSA
              size: 256
            issuerRef:
              name: linkerd-identity-issuer
              kind: Issuer
            dnsNames:
              - identity.linkerd.cluster.local
      register: issuer_result
      changed_when: "'created' in issuer_result.stdout or 'configured' in issuer_result.stdout"

    - name: Attendi che il certificato identity issuer sia pronto
      ansible.builtin.command: >
        kubectl wait certificate/linkerd-identity-issuer
        --namespace linkerd --for=condition=Ready --timeout=120s
      changed_when: false

    # =========================================================================
    # Leggi Trust Anchor PEM per Helm values
    # =========================================================================
    - name: Leggi Trust Anchor CA PEM
      ansible.builtin.command: >
        kubectl get secret linkerd-trust-anchor -n linkerd
        -o jsonpath='{.data.ca\.crt}'
      register: trust_anchor_b64
      changed_when: false

    - name: Decodifica Trust Anchor PEM
      ansible.builtin.shell: echo '{{ trust_anchor_b64.stdout }}' | base64 -d
      register: trust_anchor_pem
      changed_when: false

    # =========================================================================
    # Helm — Linkerd CRDs
    # =========================================================================
    - name: Aggiungi Helm repo linkerd
      ansible.builtin.command: helm repo add linkerd https://helm.linkerd.io/edge
      register: repo_result
      changed_when: "'has been added' in repo_result.stdout"
      failed_when:
        - repo_result.rc != 0
        - "'already exists' not in repo_result.stderr"

    - name: Aggiorna Helm repos
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Installa Linkerd CRDs
      ansible.builtin.command: >
        helm upgrade --install linkerd-crds linkerd/linkerd-crds
        --namespace linkerd
      register: crds_result
      changed_when: "'STATUS: deployed' in crds_result.stdout"

    # =========================================================================
    # Helm — Linkerd Control Plane
    # =========================================================================
    - name: Installa Linkerd Control Plane
      ansible.builtin.shell: |
        helm upgrade --install linkerd-control-plane linkerd/linkerd-control-plane \
          --namespace linkerd \
          -f {{ linkerd_k8s_dir }}/linkerd-values.yml \
          --set identityTrustAnchorsPEM="{{ trust_anchor_pem.stdout }}" \
          --set identity.issuer.scheme=kubernetes.io/tls
      register: linkerd_result
      changed_when: "'STATUS: deployed' in linkerd_result.stdout"

    - name: Attendi Linkerd Control Plane ready
      ansible.builtin.command: >
        kubectl rollout status deployment linkerd-destination
        --namespace linkerd --timeout=300s
      changed_when: false

    - name: Attendi Linkerd Identity ready
      ansible.builtin.command: >
        kubectl rollout status deployment linkerd-identity
        --namespace linkerd --timeout=300s
      changed_when: false

    - name: Attendi Linkerd Proxy Injector ready
      ansible.builtin.command: >
        kubectl rollout status deployment linkerd-proxy-injector
        --namespace linkerd --timeout=300s
      changed_when: false

    # =========================================================================
    # Helm — Linkerd Viz (Dashboard + metriche)
    # =========================================================================
    - name: Installa Linkerd Viz
      ansible.builtin.command: >
        helm upgrade --install linkerd-viz linkerd/linkerd-viz
        --namespace linkerd-viz
        -f {{ linkerd_k8s_dir }}/linkerd-viz-values.yml
      register: viz_result
      changed_when: "'STATUS: deployed' in viz_result.stdout"

    - name: Attendi Linkerd Viz ready
      ansible.builtin.command: >
        kubectl rollout status deployment web
        --namespace linkerd-viz --timeout=300s
      changed_when: false

    # =========================================================================
    # Manifest K8s (IngressRoute + Middleware via Kustomize)
    # =========================================================================
    - name: Applica manifest Kustomize (IngressRoute Viz Dashboard)
      ansible.builtin.command: kubectl apply -k {{ linkerd_k8s_dir }}
      register: kustomize_result
      changed_when: "'created' in kustomize_result.stdout or 'configured' in kustomize_result.stdout"

    # =========================================================================
    # Verifica
    # =========================================================================
    - name: Verifica pods Linkerd
      ansible.builtin.command: kubectl get pods -n linkerd
      register: pods_result
      changed_when: false

    - name: Verifica pods Linkerd Viz
      ansible.builtin.command: kubectl get pods -n linkerd-viz
      register: viz_pods_result
      changed_when: false

    - name: Verifica IngressRoute
      ansible.builtin.command: kubectl get ingressroute -n linkerd-viz
      register: ingress_result
      changed_when: false

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Riepilogo Linkerd
      ansible.builtin.debug:
        msg:
          - "=== Linkerd Setup Completato ==="
          - ""
          - "Dashboard:      https://linkerd.oci.santocaruso.eu"
          - "Auth:           Google SSO (via OAuth2 Proxy)"
          - "Prometheus:     prometheus-server.monitoring.svc (riuso esistente)"
          - "Certificati:    cert-manager (trust anchor 10y, issuer auto-rotate 48h)"
          - ""
          - "--- mTLS: come abilitare ---"
          - "Per namespace:  kubectl annotate namespace <ns> linkerd.io/inject=enabled"
          - "Per disabilitare: kubectl annotate namespace <ns> linkerd.io/inject-"
          - "Dopo annotazione: kubectl rollout restart deployment -n <ns>"
          - ""
          - "--- Pods Control Plane ---"
          - "{{ pods_result.stdout }}"
          - ""
          - "--- Pods Viz ---"
          - "{{ viz_pods_result.stdout }}"
          - ""
          - "--- IngressRoute ---"
          - "{{ ingress_result.stdout }}"
