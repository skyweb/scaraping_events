---
# Kong API Gateway + Kong Manager + SSO Plugin Configuration
# Installa Kong via Helm (con Manager UI integrata),
# e configura plugin SSO (key-auth, pre-function, session, acl, rate-limiting, cors).
#
# Prerequisiti:
#   - install_kong: true in oke.yml
#   - kong_postgres_password in oke-vault.yml
#   - kong_apikey_scraper, kong_apikey_airflow in oke-vault.yml
#   - PostgreSQL già installato (database-setup.yml)
#   - kubectl e helm configurati
#   - Traefik installato (traefik-setup.yml)
#   - DNS A record: api.oci.santocaruso.eu, gateway.oci.santocaruso.eu, kong.oci.santocaruso.eu
#
# Uso: ansible-playbook ansible/playbooks/kong-setup.yml --ask-vault-pass

- name: "Kong + Manager + SSO Setup"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  vars:
    kong_k8s_dir: "{{ playbook_dir }}/../../k8s/kong"
    kong_admin: "http://127.0.0.1:18001"

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica install_kong abilitato
      ansible.builtin.assert:
        that: install_kong | default(false)
        fail_msg: "install_kong non abilitato in oke.yml."

    - name: Verifica kubectl disponibile
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Verifica Helm disponibile
      ansible.builtin.command: helm version --short
      register: helm_version
      changed_when: false

    # =========================================================================
    # Database Kong su PostgreSQL condiviso
    # =========================================================================
    - name: Crea database kong su PostgreSQL
      ansible.builtin.shell: |
        kubectl exec -n database statefulset/postgres -- \
          psql -U postgres -d postgres -c \
          "SELECT 'exists' FROM pg_database WHERE datname = 'kong'" \
          | grep -q exists \
          || kubectl exec -n database statefulset/postgres -- \
          psql -U postgres -d postgres -c "CREATE DATABASE kong"
      register: db_result
      changed_when: "'CREATE DATABASE' in db_result.stdout"

    - name: Crea utente kong su PostgreSQL
      ansible.builtin.shell: |
        kubectl exec -n database statefulset/postgres -- \
          psql -U postgres -d postgres -c \
          "SELECT 'exists' FROM pg_roles WHERE rolname = 'kong'" \
          | grep -q exists \
          || kubectl exec -n database statefulset/postgres -- \
          psql -U postgres -d postgres -c \
          "CREATE USER kong WITH PASSWORD '{{ kong_postgres_password }}'; GRANT ALL PRIVILEGES ON DATABASE kong TO kong; ALTER DATABASE kong OWNER TO kong"
      register: user_result
      changed_when: "'CREATE ROLE' in user_result.stdout"

    # =========================================================================
    # Secret Kong
    # =========================================================================
    - name: Crea Secret kong-secret
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: kong-secret
            namespace: apps
          type: Opaque
          stringData:
            pg_password: "{{ kong_postgres_password }}"
      register: secret_result
      changed_when: "'created' in secret_result.stdout or 'configured' in secret_result.stdout"

    # =========================================================================
    # Kong via Helm
    # =========================================================================
    - name: Aggiungi Helm repo kong
      ansible.builtin.command: helm repo add kong https://charts.konghq.com
      register: repo_result
      changed_when: "'has been added' in repo_result.stdout"
      failed_when:
        - repo_result.rc != 0
        - "'already exists' not in repo_result.stderr"

    - name: Aggiorna Helm repos
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Installa Kong via Helm
      ansible.builtin.command: >
        helm upgrade --install kong kong/kong
        --namespace apps
        -f {{ kong_k8s_dir }}/kong-values.yml
      register: kong_result
      changed_when: "'STATUS: deployed' in kong_result.stdout"

    - name: Attendi Kong ready
      ansible.builtin.command: >
        kubectl rollout status deployment kong-kong
        --namespace apps --timeout=300s
      changed_when: false

    # =========================================================================
    # IngressRoutes via Kustomize (Kong API, Gateway, Manager)
    # =========================================================================
    - name: Applica Kustomize manifesti (IngressRoutes)
      ansible.builtin.command: kubectl apply -k {{ kong_k8s_dir }}
      register: kustomize_result
      changed_when: "'created' in kustomize_result.stdout or 'configured' in kustomize_result.stdout"

    # =========================================================================
    # Port-forward Kong Admin API (ClusterIP non raggiungibile da localhost)
    # =========================================================================
    - name: Avvia port-forward Kong Admin API
      ansible.builtin.shell: |
        # Chiudi eventuali port-forward precedenti sulla stessa porta
        lsof -ti:18001 | xargs kill -9 2>/dev/null || true
        # nohup + setsid per sopravvivere alla chiusura della shell Ansible
        nohup kubectl port-forward -n apps svc/kong-kong-admin 18001:8001 \
          </dev/null >/dev/null 2>&1 &
        # Attendi che il port-forward sia pronto
        for i in $(seq 1 30); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18001/status 2>/dev/null)
          [ "$STATUS" = "200" ] && exit 0
          sleep 2
        done
        exit 1
      changed_when: false

    # =========================================================================
    # Plugin Prometheus globale (metriche per Grafana)
    # =========================================================================
    - name: Abilita plugin Prometheus globale
      ansible.builtin.shell: |
        EXISTING=$(curl -s {{ kong_admin }}/plugins | python3 -c "import sys,json; data=json.load(sys.stdin); print(len([p for p in data.get('data',[]) if p.get('name')=='prometheus']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST {{ kong_admin }}/plugins \
            --data "name=prometheus" \
            --data "config.per_consumer=true" \
            --data "config.status_code_metrics=true" \
            --data "config.latency_metrics=true"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: plugin_prometheus
      changed_when: "'CREATED' in plugin_prometheus.stdout"

    # =========================================================================
    # Kong Service: backoffice Django
    # =========================================================================
    - name: Crea Service — backoffice
      ansible.builtin.shell: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" {{ kong_admin }}/services/backoffice)
        if [ "$STATUS" = "404" ]; then
          curl -s -X POST {{ kong_admin }}/services \
            --data "name=backoffice" \
            --data "url=http://backoffice.apps.svc:8000"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: svc_backoffice
      changed_when: "'CREATED' in svc_backoffice.stdout"

    # =========================================================================
    # Route: API esterne (key-auth — scraper, airflow, terze parti)
    # Host: api.oci.santocaruso.eu  Path: /api/external
    # =========================================================================
    - name: Crea Route — api-external (key-auth)
      ansible.builtin.shell: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" {{ kong_admin }}/routes/api-external)
        if [ "$STATUS" = "404" ]; then
          curl -s -X POST {{ kong_admin }}/services/backoffice/routes \
            --data "name=api-external" \
            --data "hosts[]=api.{{ base_domain }}" \
            --data "paths[]=/api/external" \
            --data "strip_path=false"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: route_api_external
      changed_when: "'CREATED' in route_api_external.stdout"

    # =========================================================================
    # Route: API pubbliche (nessuna auth — health, schema, docs)
    # Host: api.oci.santocaruso.eu  Path: /api/public
    # =========================================================================
    - name: Crea Route — api-public (no auth)
      ansible.builtin.shell: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" {{ kong_admin }}/routes/api-public)
        if [ "$STATUS" = "404" ]; then
          curl -s -X POST {{ kong_admin }}/services/backoffice/routes \
            --data "name=api-public" \
            --data "hosts[]=api.{{ base_domain }}" \
            --data "paths[]=/api/public" \
            --data "strip_path=false"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: route_api_public
      changed_when: "'CREATED' in route_api_public.stdout"

    # =========================================================================
    # Route: Admin Django (SSO — browser)
    # Host: gateway.oci.santocaruso.eu  Path: /admin
    # =========================================================================
    - name: Crea Route — gateway-admin (SSO)
      ansible.builtin.shell: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" {{ kong_admin }}/routes/gateway-admin)
        if [ "$STATUS" = "404" ]; then
          curl -s -X POST {{ kong_admin }}/services/backoffice/routes \
            --data "name=gateway-admin" \
            --data "hosts[]=gateway.{{ base_domain }}" \
            --data "paths[]=/admin" \
            --data "strip_path=false"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: route_gw_admin
      changed_when: "'CREATED' in route_gw_admin.stdout"

    # =========================================================================
    # Route: API interne (SSO — browser, Swagger)
    # Host: gateway.oci.santocaruso.eu  Path: /api
    # =========================================================================
    - name: Crea Route — gateway-api (SSO)
      ansible.builtin.shell: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" {{ kong_admin }}/routes/gateway-api)
        if [ "$STATUS" = "404" ]; then
          curl -s -X POST {{ kong_admin }}/services/backoffice/routes \
            --data "name=gateway-api" \
            --data "hosts[]=gateway.{{ base_domain }}" \
            --data "paths[]=/api" \
            --data "strip_path=false"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: route_gw_api
      changed_when: "'CREATED' in route_gw_api.stdout"

    # =========================================================================
    # Route: Static assets Django (SSO — browser, CSS/JS per admin)
    # Host: gateway.oci.santocaruso.eu  Path: /static
    # =========================================================================
    - name: Crea Route — gateway-static (SSO)
      ansible.builtin.shell: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" {{ kong_admin }}/routes/gateway-static)
        if [ "$STATUS" = "404" ]; then
          curl -s -X POST {{ kong_admin }}/services/backoffice/routes \
            --data "name=gateway-static" \
            --data "hosts[]=gateway.{{ base_domain }}" \
            --data "paths[]=/static" \
            --data "strip_path=false"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: route_gw_static
      changed_when: "'CREATED' in route_gw_static.stdout"

    # =========================================================================
    # Consumers
    # =========================================================================
    - name: Crea Consumer — admin-sso
      ansible.builtin.shell: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" {{ kong_admin }}/consumers/admin-sso)
        if [ "$STATUS" = "404" ]; then
          curl -s -X POST {{ kong_admin }}/consumers \
            --data "username=admin-sso" \
            --data "custom_id=sso-admin"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: consumer_admin
      changed_when: "'CREATED' in consumer_admin.stdout"

    - name: Crea Consumer — scraper
      ansible.builtin.shell: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" {{ kong_admin }}/consumers/scraper)
        if [ "$STATUS" = "404" ]; then
          curl -s -X POST {{ kong_admin }}/consumers \
            --data "username=scraper" \
            --data "custom_id=scrapy-service"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: consumer_scraper
      changed_when: "'CREATED' in consumer_scraper.stdout"

    - name: Crea Consumer — airflow
      ansible.builtin.shell: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" {{ kong_admin }}/consumers/airflow)
        if [ "$STATUS" = "404" ]; then
          curl -s -X POST {{ kong_admin }}/consumers \
            --data "username=airflow" \
            --data "custom_id=airflow-scheduler"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: consumer_airflow
      changed_when: "'CREATED' in consumer_airflow.stdout"

    # =========================================================================
    # ACL Groups
    # =========================================================================
    - name: Assegna ACL group 'admin' a admin-sso
      ansible.builtin.shell: |
        EXISTING=$(curl -s {{ kong_admin }}/consumers/admin-sso/acls | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([a for a in d.get('data',[]) if a.get('group')=='admin']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST {{ kong_admin }}/consumers/admin-sso/acls --data "group=admin"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: acl_admin
      changed_when: "'CREATED' in acl_admin.stdout"

    - name: Assegna ACL group 'api-consumer' a scraper
      ansible.builtin.shell: |
        EXISTING=$(curl -s {{ kong_admin }}/consumers/scraper/acls | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([a for a in d.get('data',[]) if a.get('group')=='api-consumer']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST {{ kong_admin }}/consumers/scraper/acls --data "group=api-consumer"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: acl_scraper
      changed_when: "'CREATED' in acl_scraper.stdout"

    - name: Assegna ACL group 'api-consumer' a airflow
      ansible.builtin.shell: |
        EXISTING=$(curl -s {{ kong_admin }}/consumers/airflow/acls | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([a for a in d.get('data',[]) if a.get('group')=='api-consumer']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST {{ kong_admin }}/consumers/airflow/acls --data "group=api-consumer"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: acl_airflow
      changed_when: "'CREATED' in acl_airflow.stdout"

    # =========================================================================
    # API Keys (key-auth credentials)
    # =========================================================================
    - name: Crea API key per scraper
      ansible.builtin.shell: |
        EXISTING=$(curl -s {{ kong_admin }}/consumers/scraper/key-auth | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('data',[])))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST {{ kong_admin }}/consumers/scraper/key-auth \
            --data "key={{ kong_apikey_scraper }}"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: key_scraper
      changed_when: "'CREATED' in key_scraper.stdout"

    - name: Crea API key per airflow
      ansible.builtin.shell: |
        EXISTING=$(curl -s {{ kong_admin }}/consumers/airflow/key-auth | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('data',[])))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST {{ kong_admin }}/consumers/airflow/key-auth \
            --data "key={{ kong_apikey_airflow }}"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: key_airflow
      changed_when: "'CREATED' in key_airflow.stdout"

    # =========================================================================
    # Plugin: key-auth su route api-external
    # =========================================================================
    - name: Abilita key-auth su route api-external
      ansible.builtin.shell: |
        ROUTE_ID=$(curl -s {{ kong_admin }}/routes/api-external | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
        EXISTING=$(curl -s "{{ kong_admin }}/routes/$ROUTE_ID/plugins" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([p for p in d.get('data',[]) if p.get('name')=='key-auth']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST "{{ kong_admin }}/routes/$ROUTE_ID/plugins" \
            --data "name=key-auth" \
            --data "config.key_names[]=apikey" \
            --data "config.key_in_header=true" \
            --data "config.key_in_query=false" \
            --data "config.key_in_body=false" \
            --data "config.hide_credentials=true"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: plugin_keyauth
      changed_when: "'CREATED' in plugin_keyauth.stdout"

    # =========================================================================
    # Plugin: ACL su route api-external (solo api-consumer e admin)
    # =========================================================================
    - name: Abilita ACL su route api-external
      ansible.builtin.shell: |
        ROUTE_ID=$(curl -s {{ kong_admin }}/routes/api-external | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
        EXISTING=$(curl -s "{{ kong_admin }}/routes/$ROUTE_ID/plugins" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([p for p in d.get('data',[]) if p.get('name')=='acl']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST "{{ kong_admin }}/routes/$ROUTE_ID/plugins" \
            --data "name=acl" \
            --data "config.allow[]=admin" \
            --data "config.allow[]=api-consumer"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: plugin_acl_api
      changed_when: "'CREATED' in plugin_acl_api.stdout"

    # =========================================================================
    # Plugin: rate-limiting su route api-external
    # =========================================================================
    - name: Abilita rate-limiting su route api-external
      ansible.builtin.shell: |
        ROUTE_ID=$(curl -s {{ kong_admin }}/routes/api-external | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
        EXISTING=$(curl -s "{{ kong_admin }}/routes/$ROUTE_ID/plugins" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([p for p in d.get('data',[]) if p.get('name')=='rate-limiting']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST "{{ kong_admin }}/routes/$ROUTE_ID/plugins" \
            --data "name=rate-limiting" \
            --data "config.minute={{ kong_rate_limit_minute | default(60) }}" \
            --data "config.hour={{ kong_rate_limit_hour | default(1000) }}" \
            --data "config.policy=local" \
            --data "config.limit_by=consumer"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: plugin_ratelimit
      changed_when: "'CREATED' in plugin_ratelimit.stdout"

    # =========================================================================
    # Plugin: CORS su route api-external
    # =========================================================================
    - name: Abilita CORS su route api-external
      ansible.builtin.shell: |
        ROUTE_ID=$(curl -s {{ kong_admin }}/routes/api-external | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
        EXISTING=$(curl -s "{{ kong_admin }}/routes/$ROUTE_ID/plugins" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([p for p in d.get('data',[]) if p.get('name')=='cors']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST "{{ kong_admin }}/routes/$ROUTE_ID/plugins" \
            --data "name=cors" \
            --data "config.origins[]=https://events.{{ base_domain }}" \
            --data "config.origins[]=https://gateway.{{ base_domain }}" \
            --data "config.methods[]=GET" \
            --data "config.methods[]=POST" \
            --data "config.methods[]=PUT" \
            --data "config.methods[]=DELETE" \
            --data "config.methods[]=OPTIONS" \
            --data "config.headers[]=Accept" \
            --data "config.headers[]=Content-Type" \
            --data "config.headers[]=apikey" \
            --data "config.credentials=true" \
            --data "config.max_age=3600"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: plugin_cors
      changed_when: "'CREATED' in plugin_cors.stdout"

    # =========================================================================
    # Plugin: pre-function su route gateway-admin (SSO email → consumer)
    # =========================================================================
    - name: Abilita pre-function su route gateway-admin
      ansible.builtin.shell: |
        ROUTE_ID=$(curl -s {{ kong_admin }}/routes/gateway-admin | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
        EXISTING=$(curl -s "{{ kong_admin }}/routes/$ROUTE_ID/plugins" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([p for p in d.get('data',[]) if p.get('name')=='pre-function']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST "{{ kong_admin }}/routes/$ROUTE_ID/plugins" \
            --data "name=pre-function" \
            --data-urlencode 'config.access[]=local email = kong.request.get_header("X-Auth-Request-Email") if not email then kong.response.exit(401, { message = "Not authenticated" }) end local map = { {{ kong_sso_email_map }} } local username = map[email] if not username then kong.response.exit(403, { message = "Email not authorized: " .. email }) end local consumer = kong.db.consumers:select_by_username(username) if consumer then kong.client.authenticate(consumer) end'
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: plugin_prefunction_admin
      changed_when: "'CREATED' in plugin_prefunction_admin.stdout"

    # =========================================================================
    # Plugin: pre-function su route gateway-api (SSO email → consumer)
    # =========================================================================
    - name: Abilita pre-function su route gateway-api
      ansible.builtin.shell: |
        ROUTE_ID=$(curl -s {{ kong_admin }}/routes/gateway-api | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
        EXISTING=$(curl -s "{{ kong_admin }}/routes/$ROUTE_ID/plugins" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([p for p in d.get('data',[]) if p.get('name')=='pre-function']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST "{{ kong_admin }}/routes/$ROUTE_ID/plugins" \
            --data "name=pre-function" \
            --data-urlencode 'config.access[]=local email = kong.request.get_header("X-Auth-Request-Email") if not email then kong.response.exit(401, { message = "Not authenticated" }) end local map = { {{ kong_sso_email_map }} } local username = map[email] if not username then kong.response.exit(403, { message = "Email not authorized: " .. email }) end local consumer = kong.db.consumers:select_by_username(username) if consumer then kong.client.authenticate(consumer) end'
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: plugin_prefunction_api
      changed_when: "'CREATED' in plugin_prefunction_api.stdout"

    # =========================================================================
    # Plugin: session su route gateway-admin e gateway-api
    # =========================================================================
    - name: Abilita session su route gateway-admin
      ansible.builtin.shell: |
        ROUTE_ID=$(curl -s {{ kong_admin }}/routes/gateway-admin | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
        EXISTING=$(curl -s "{{ kong_admin }}/routes/$ROUTE_ID/plugins" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([p for p in d.get('data',[]) if p.get('name')=='session']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST "{{ kong_admin }}/routes/$ROUTE_ID/plugins" \
            --data "name=session" \
            --data "config.cookie_name=kong_session" \
            --data "config.cookie_domain=.{{ base_domain }}" \
            --data "config.cookie_secure=true" \
            --data "config.cookie_httponly=true" \
            --data "config.cookie_samesite=Lax" \
            --data "config.storage=kong" \
            --data "config.cookie_lifetime=3600"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: plugin_session_admin
      changed_when: "'CREATED' in plugin_session_admin.stdout"

    - name: Abilita session su route gateway-api
      ansible.builtin.shell: |
        ROUTE_ID=$(curl -s {{ kong_admin }}/routes/gateway-api | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
        EXISTING=$(curl -s "{{ kong_admin }}/routes/$ROUTE_ID/plugins" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([p for p in d.get('data',[]) if p.get('name')=='session']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST "{{ kong_admin }}/routes/$ROUTE_ID/plugins" \
            --data "name=session" \
            --data "config.cookie_name=kong_session" \
            --data "config.cookie_domain=.{{ base_domain }}" \
            --data "config.cookie_secure=true" \
            --data "config.cookie_httponly=true" \
            --data "config.cookie_samesite=Lax" \
            --data "config.storage=kong" \
            --data "config.cookie_lifetime=3600"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: plugin_session_api
      changed_when: "'CREATED' in plugin_session_api.stdout"

    # =========================================================================
    # Plugin: ACL su route gateway (solo admin)
    # =========================================================================
    - name: Abilita ACL su route gateway-admin
      ansible.builtin.shell: |
        ROUTE_ID=$(curl -s {{ kong_admin }}/routes/gateway-admin | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
        EXISTING=$(curl -s "{{ kong_admin }}/routes/$ROUTE_ID/plugins" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([p for p in d.get('data',[]) if p.get('name')=='acl']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST "{{ kong_admin }}/routes/$ROUTE_ID/plugins" \
            --data "name=acl" \
            --data "config.allow[]=admin"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: plugin_acl_gw_admin
      changed_when: "'CREATED' in plugin_acl_gw_admin.stdout"

    - name: Abilita ACL su route gateway-api
      ansible.builtin.shell: |
        ROUTE_ID=$(curl -s {{ kong_admin }}/routes/gateway-api | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
        EXISTING=$(curl -s "{{ kong_admin }}/routes/$ROUTE_ID/plugins" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([p for p in d.get('data',[]) if p.get('name')=='acl']))")
        if [ "$EXISTING" = "0" ]; then
          curl -s -X POST "{{ kong_admin }}/routes/$ROUTE_ID/plugins" \
            --data "name=acl" \
            --data "config.allow[]=admin"
          echo "CREATED"
        else
          echo "EXISTS"
        fi
      register: plugin_acl_gw_api
      changed_when: "'CREATED' in plugin_acl_gw_api.stdout"

    # =========================================================================
    # Verifica
    # =========================================================================
    - name: Verifica pods Kong
      ansible.builtin.command: kubectl get pods -n apps -l app.kubernetes.io/name=kong
      register: kong_pods
      changed_when: false

    - name: Verifica Kong routes
      ansible.builtin.shell: |
        curl -s {{ kong_admin }}/routes | python3 -c "
        import sys,json
        data = json.load(sys.stdin)
        for r in data.get('data',[]):
            hosts = ','.join(r.get('hosts',[]))
            paths = ','.join(r.get('paths',[]))
            print(f\"  {r['name']:25s} {hosts:40s} {paths}\")
        "
      register: routes_list
      changed_when: false

    - name: Verifica Kong plugins
      ansible.builtin.shell: |
        curl -s {{ kong_admin }}/plugins | python3 -c "
        import sys,json
        data = json.load(sys.stdin)
        for p in data.get('data',[]):
            route = p.get('route',{})
            route_id = route.get('id','global') if route else 'global'
            print(f\"  {p['name']:25s} route={route_id[:12]}...\")
        "
      register: plugins_list
      changed_when: false

    - name: Verifica Kong consumers
      ansible.builtin.shell: |
        curl -s {{ kong_admin }}/consumers | python3 -c "
        import sys,json
        data = json.load(sys.stdin)
        for c in data.get('data',[]):
            print(f\"  {c['username']:20s} custom_id={c.get('custom_id','')}\")
        "
      register: consumers_list
      changed_when: false

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Kong SSO Setup completato
      ansible.builtin.debug:
        msg:
          - "=== Kong + Manager + SSO Setup Completato ==="
          - ""
          - "--- Route ---"
          - "{{ routes_list.stdout }}"
          - ""
          - "--- Plugin ---"
          - "{{ plugins_list.stdout }}"
          - ""
          - "--- Consumers ---"
          - "{{ consumers_list.stdout }}"
          - ""
          - "--- Flussi di autenticazione ---"
          - "API esterne (key-auth):  https://api.{{ base_domain }}/api/external/"
          - "  Header: apikey: <API_KEY>"
          - "  Consumers: scraper, airflow"
          - ""
          - "API pubbliche (no auth): https://api.{{ base_domain }}/api/public/"
          - ""
          - "Admin Django (SSO):      https://gateway.{{ base_domain }}/admin/"
          - "  Auth: Google SSO via OAuth2 Proxy"
          - ""
          - "API browser (SSO):       https://gateway.{{ base_domain }}/api/"
          - "  Auth: Google SSO via OAuth2 Proxy"
          - ""
          - "Kong Manager UI (SSO):   https://kong.{{ base_domain }}"
          - "  Auth: Google SSO via OAuth2 Proxy (no login richiesto)"
          - "Kong Admin API:          http://kong-kong-admin.apps.svc:8001 (solo interno)"

    # =========================================================================
    # Cleanup port-forward
    # =========================================================================
    - name: Chiudi port-forward Kong Admin
      ansible.builtin.shell: lsof -ti:18001 | xargs kill -9 2>/dev/null || true
      changed_when: false
