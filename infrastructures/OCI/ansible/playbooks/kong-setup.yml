---
# Kong API Gateway + Konga Admin UI
# Installa Kong via Helm e Konga via manifesti nativi K8s.
# Kong usa PostgreSQL condiviso (database: kong, konga).
#
# Prerequisiti:
#   - install_kong: true in oke.yml
#   - kong_postgres_password, konga_postgres_password in oke-vault.yml
#   - PostgreSQL già installato (database-setup.yml)
#   - kubectl e helm configurati
#   - Traefik installato (traefik-setup.yml)
#   - DNS A record: api.oci.santocaruso.eu, konga.oci.santocaruso.eu
#
# Uso: ansible-playbook ansible/playbooks/kong-setup.yml --ask-vault-pass

- name: "Kong + Konga Setup"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  vars:
    kong_k8s_dir: "{{ playbook_dir }}/../../k8s/kong"

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica install_kong abilitato
      ansible.builtin.assert:
        that: install_kong | default(false)
        fail_msg: "install_kong non abilitato in oke.yml."

    - name: Verifica kubectl disponibile
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Verifica Helm disponibile
      ansible.builtin.command: helm version --short
      register: helm_version
      changed_when: false

    # =========================================================================
    # Database Kong su PostgreSQL condiviso
    # =========================================================================
    - name: Crea database kong su PostgreSQL
      ansible.builtin.shell: |
        kubectl exec -n database statefulset/postgres -- \
          psql -U events -d events -c \
          "SELECT 'exists' FROM pg_database WHERE datname = 'kong'" \
          | grep -q exists \
          || kubectl exec -n database statefulset/postgres -- \
          psql -U events -d events -c "CREATE DATABASE kong"
      register: db_result
      changed_when: "'CREATE DATABASE' in db_result.stdout"

    - name: Crea utente kong su PostgreSQL
      ansible.builtin.shell: |
        kubectl exec -n database statefulset/postgres -- \
          psql -U events -d events -c \
          "SELECT 'exists' FROM pg_roles WHERE rolname = 'kong'" \
          | grep -q exists \
          || kubectl exec -n database statefulset/postgres -- \
          psql -U events -d events -c \
          "CREATE USER kong WITH PASSWORD '{{ kong_postgres_password }}'; GRANT ALL PRIVILEGES ON DATABASE kong TO kong; ALTER DATABASE kong OWNER TO kong"
      register: user_result
      changed_when: "'CREATE ROLE' in user_result.stdout"

    # =========================================================================
    # Database Konga su PostgreSQL condiviso
    # =========================================================================
    - name: Crea database konga su PostgreSQL
      ansible.builtin.shell: |
        kubectl exec -n database statefulset/postgres -- \
          psql -U events -d events -c \
          "SELECT 'exists' FROM pg_database WHERE datname = 'konga'" \
          | grep -q exists \
          || kubectl exec -n database statefulset/postgres -- \
          psql -U events -d events -c "CREATE DATABASE konga"
      register: db_konga_result
      changed_when: "'CREATE DATABASE' in db_konga_result.stdout"

    - name: Crea utente konga su PostgreSQL
      ansible.builtin.shell: |
        kubectl exec -n database statefulset/postgres -- \
          psql -U events -d events -c \
          "SELECT 'exists' FROM pg_roles WHERE rolname = 'konga'" \
          | grep -q exists \
          || kubectl exec -n database statefulset/postgres -- \
          psql -U events -d events -c \
          "CREATE USER konga WITH PASSWORD '{{ konga_postgres_password }}'; GRANT ALL PRIVILEGES ON DATABASE konga TO konga; ALTER DATABASE konga OWNER TO konga"
      register: user_konga_result
      changed_when: "'CREATE ROLE' in user_konga_result.stdout"

    # =========================================================================
    # Secret Kong
    # =========================================================================
    - name: Crea Secret kong-secret
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: kong-secret
            namespace: apps
          type: Opaque
          stringData:
            pg_password: "{{ kong_postgres_password }}"
      register: secret_result
      changed_when: "'created' in secret_result.stdout or 'configured' in secret_result.stdout"

    - name: Crea Secret konga-secret
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: konga-secret
            namespace: apps
          type: Opaque
          stringData:
            db_password: "{{ konga_postgres_password }}"
      register: konga_secret_result
      changed_when: "'created' in konga_secret_result.stdout or 'configured' in konga_secret_result.stdout"

    # =========================================================================
    # Kong via Helm
    # =========================================================================
    - name: Aggiungi Helm repo kong
      ansible.builtin.command: helm repo add kong https://charts.konghq.com
      register: repo_result
      changed_when: "'has been added' in repo_result.stdout"
      failed_when:
        - repo_result.rc != 0
        - "'already exists' not in repo_result.stderr"

    - name: Aggiorna Helm repos
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Installa Kong via Helm
      ansible.builtin.command: >
        helm upgrade --install kong kong/kong
        --namespace apps
        -f {{ kong_k8s_dir }}/kong-values.yml
      register: kong_result
      changed_when: "'STATUS: deployed' in kong_result.stdout"

    - name: Attendi Kong ready
      ansible.builtin.command: >
        kubectl rollout status deployment kong-kong
        --namespace apps --timeout=300s
      changed_when: false

    # =========================================================================
    # Konga + IngressRoutes via Kustomize
    # =========================================================================
    - name: Applica Kustomize manifesti (Konga + IngressRoutes)
      ansible.builtin.command: kubectl apply -k {{ kong_k8s_dir }}
      register: kustomize_result
      changed_when: "'created' in kustomize_result.stdout or 'configured' in kustomize_result.stdout"

    - name: Attendi Konga ready
      ansible.builtin.command: >
        kubectl rollout status deployment konga
        --namespace apps --timeout=300s
      changed_when: false

    # =========================================================================
    # Abilita Prometheus plugin globale (metriche per Grafana)
    # =========================================================================
    - name: Abilita Prometheus plugin su Kong
      ansible.builtin.shell: |
        kubectl exec -n apps deployment/kong-kong -- \
          kong config -c /etc/kong/kong.conf \
          2>/dev/null || true
        curl -s -o /dev/null -w "%{http_code}" \
          http://$(kubectl get svc -n apps kong-kong-admin -o jsonpath='{.spec.clusterIP}'):8001/plugins \
          --data "name=prometheus" \
          --data "config.per_consumer=true" \
          --data "config.status_code_metrics=true" \
          --data "config.latency_metrics=true" \
          | grep -qE '(201|409)'
      register: prometheus_plugin
      changed_when: "'201' in prometheus_plugin.stdout"
      failed_when: false

    # =========================================================================
    # Verifica
    # =========================================================================
    - name: Verifica pods Kong
      ansible.builtin.command: kubectl get pods -n apps -l app.kubernetes.io/name=kong
      register: kong_pods
      changed_when: false

    - name: Verifica pods Konga
      ansible.builtin.command: kubectl get pods -n apps -l app=konga
      register: konga_pods
      changed_when: false

    - name: Verifica services
      ansible.builtin.command: kubectl get svc -n apps
      register: svc_result
      changed_when: false

    - name: Verifica IngressRoutes
      ansible.builtin.command: kubectl get ingressroute -n apps
      register: ingress_result
      changed_when: false

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Kong + Konga Setup completato
      ansible.builtin.debug:
        msg:
          - "=== Kong + Konga Setup Completato ==="
          - ""
          - "Kong API Gateway:"
          - "  API (proxy):     https://api.{{ base_domain }}"
          - "  Admin API:       http://kong-kong-admin.apps.svc:8001 (solo interno)"
          - "  PostgreSQL:      postgres.database.svc:5432 (database: kong)"
          - ""
          - "Konga Admin UI:"
          - "  URL:             https://konga.{{ base_domain }}"
          - "  Auth:            Google SSO (via OAuth2 Proxy)"
          - "  PostgreSQL:      postgres.database.svc:5432 (database: konga)"
          - ""
          - "Plugin attivi:     prometheus (metriche per Grafana)"
          - ""
          - "Prossimi passi:"
          - "  1. Accedi a Konga e crea la connessione a Kong Admin: http://kong-kong-admin.apps.svc:8001"
          - "  2. Crea Service + Route per il backoffice Django"
          - "  3. Abilita plugin: rate-limiting, oauth2/oidc, cors, http-log"
          - ""
          - "--- Pods Kong ---"
          - "{{ kong_pods.stdout }}"
          - ""
          - "--- Pods Konga ---"
          - "{{ konga_pods.stdout }}"
          - ""
          - "--- Services ---"
          - "{{ svc_result.stdout }}"
