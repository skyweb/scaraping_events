---
# MinIO — Object Storage S3-compatible
# Installa MinIO nel namespace database e applica manifesti K8s da k8s/minio/
#
# Prerequisiti:
#   - install_minio: true in oke.yml
#   - minio_root_user, minio_root_password in oke-vault.yml
#   - kubectl configurato
#   - Traefik installato (traefik-setup.yml)
#   - DNS A record: minio.oci.santocaruso.eu, s3.oci.santocaruso.eu
#
# Uso: ansible-playbook ansible/playbooks/minio-setup.yml --ask-vault-pass

- name: "MinIO Setup"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  vars:
    minio_k8s_dir: "{{ playbook_dir }}/../../k8s/minio"

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica install_minio abilitato
      ansible.builtin.assert:
        that: install_minio | default(false)
        fail_msg: "install_minio non abilitato in oke.yml."

    - name: Verifica kubectl disponibile
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    # =========================================================================
    # Namespace (database — già creato da post-cluster-setup)
    # =========================================================================
    - name: Verifica namespace database esiste
      ansible.builtin.command: kubectl get namespace database
      register: ns_result
      changed_when: false
      failed_when: ns_result.rc != 0

    # =========================================================================
    # Secret MinIO
    # =========================================================================
    - name: Crea Secret minio-secret
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: minio-secret
            namespace: database
          type: Opaque
          stringData:
            MINIO_ROOT_USER: "{{ minio_root_user }}"
            MINIO_ROOT_PASSWORD: "{{ minio_root_password }}"
      register: secret_result
      changed_when: "'created' in secret_result.stdout or 'configured' in secret_result.stdout"

    # =========================================================================
    # Applica manifesti K8s (PVC, Deployment, Service, IngressRoute)
    # =========================================================================
    - name: Applica Kustomize manifesti MinIO
      ansible.builtin.command: kubectl apply -k {{ minio_k8s_dir }}
      register: kustomize_result
      changed_when: "'created' in kustomize_result.stdout or 'configured' in kustomize_result.stdout"

    # =========================================================================
    # Attendi MinIO ready
    # =========================================================================
    - name: Attendi MinIO ready
      ansible.builtin.command: >
        kubectl rollout status deployment minio
        --namespace database --timeout=300s
      changed_when: false

    # =========================================================================
    # Crea bucket di default (opzionale)
    # =========================================================================
    - name: Crea bucket di default per Airflow logs
      ansible.builtin.shell: |
        kubectl exec -n database deployment/minio -- \
          mc alias set local http://localhost:9000 {{ minio_root_user }} {{ minio_root_password }} 2>/dev/null
        kubectl exec -n database deployment/minio -- \
          mc mb --ignore-existing local/{{ item }}
      loop: "{{ minio_default_buckets | default([]) }}"
      register: bucket_result
      changed_when: "'Bucket created' in bucket_result.stdout"
      failed_when: false
      when: minio_default_buckets | default([]) | length > 0

    # =========================================================================
    # Verifica
    # =========================================================================
    - name: Verifica pods MinIO
      ansible.builtin.command: kubectl get pods -n database -l app=minio
      register: pods_result
      changed_when: false

    - name: Verifica services MinIO
      ansible.builtin.command: kubectl get svc -n database -l app=minio
      register: svc_result
      changed_when: false

    - name: Verifica IngressRoute MinIO
      ansible.builtin.command: kubectl get ingressroute -n database
      register: ingress_result
      changed_when: false

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: MinIO Setup completato
      ansible.builtin.debug:
        msg:
          - "=== MinIO Setup Completato ==="
          - ""
          - "Console:      https://minio.{{ base_domain }}"
          - "API (S3):     https://s3.{{ base_domain }}"
          - "Internal API: http://minio.database.svc:9000"
          - "Auth:         Google SSO (console), credenziali root (API)"
          - ""
          - "Bucket default: {{ minio_default_buckets | default([]) | join(', ') | default('nessuno') }}"
          - ""
          - "--- Pods ---"
          - "{{ pods_result.stdout }}"
          - ""
          - "--- Services ---"
          - "{{ svc_result.stdout }}"
          - ""
          - "--- IngressRoute ---"
          - "{{ ingress_result.stdout }}"
