---
# Grafana su micro-monitor VM via Podman
# Esegue via SSH sulla micro VM (richiede inventory configurato)
#
# Uso: ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/observability-vm-setup.yml
- name: OKE Observability - Grafana su Micro VM
  hosts: micro-monitor
  become: true
  gather_facts: true

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  vars:
    grafana_base_dir: /opt/grafana
    grafana_container_name: grafana
    grafana_image: "docker.io/grafana/grafana:{{ grafana_version | default('11.4.0') }}"
    caddy_base_dir: /opt/caddy
    caddy_container_name: caddy
    caddy_image: "docker.io/library/caddy:2-alpine"
    domain_grafana: "{{ grafana_subdomain | default('grafana') }}.{{ base_domain | default('') }}"
    grafana_root_url: "{{ 'https://' ~ domain_grafana if (base_domain is defined) else 'http://' ~ ansible_host ~ ':' ~ (grafana_port | default(3000)) }}"
    dashboard_source_dir: "{{ playbook_dir }}/../../../services/grafana/provisioning/dashboards/json"

  tasks:
    # =========================================================================
    # Prerequisiti - Podman
    # =========================================================================
    - name: Verifica se Podman e' installato
      ansible.builtin.command: podman --version
      register: podman_check
      changed_when: false
      failed_when: false

    - name: Installa Podman (Oracle Linux 8)
      ansible.builtin.command: dnf install -y podman
      register: podman_install
      changed_when: "'Complete!' in podman_install.stdout"
      when: podman_check.rc != 0

    # =========================================================================
    # Directory Grafana
    # =========================================================================
    - name: Crea directory Grafana
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "472"
        group: root
        mode: "0755"
      loop:
        - "{{ grafana_base_dir }}"
        - "{{ grafana_base_dir }}/data"
        - "{{ grafana_base_dir }}/provisioning"
        - "{{ grafana_base_dir }}/provisioning/datasources"
        - "{{ grafana_base_dir }}/provisioning/dashboards"
        - "{{ grafana_base_dir }}/provisioning/alerting"

    - name: Crea directory dashboard JSON
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "472"
        group: root
        mode: "0755"
      loop:
        - "{{ grafana_base_dir }}/provisioning/dashboards/json"
        - "{{ grafana_base_dir }}/provisioning/dashboards/json/application"
        - "{{ grafana_base_dir }}/provisioning/dashboards/json/health"
        - "{{ grafana_base_dir }}/provisioning/dashboards/json/infrastructure"
      when: install_grafana_dashboards | default(false)

    # =========================================================================
    # Datasource provisioning
    # Prometheus (uid), Loki (uid + derivedFields log→trace), Alertmanager
    # =========================================================================
    - name: Configura datasource Prometheus + Loki + Alertmanager
      ansible.builtin.copy:
        dest: "{{ grafana_base_dir }}/provisioning/datasources/observability.yml"
        owner: "472"
        group: root
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              access: proxy
              url: http://{{ k8s_node_ip }}:{{ prometheus_nodeport | default(31090) }}
              isDefault: true
              editable: false

            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://{{ k8s_node_ip }}:{{ loki_nodeport | default(31100) }}
              editable: false
              jsonData:
                derivedFields:
                  - datasourceUid: jaeger
                    matcherRegex: '"otelTraceID":\\s*"(\\w+)"'
                    name: TraceID
                    url: '$${__value.raw}'

            - name: Alertmanager
              type: alertmanager
              uid: alertmanager
              access: proxy
              url: http://{{ k8s_node_ip }}:{{ alertmanager_nodeport | default(31093) }}
              editable: false
              jsonData:
                implementation: prometheus
      notify: Restart Grafana

    - name: Configura datasource Jaeger
      ansible.builtin.copy:
        dest: "{{ grafana_base_dir }}/provisioning/datasources/jaeger.yml"
        owner: "472"
        group: root
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Jaeger
              type: jaeger
              uid: jaeger
              access: proxy
              url: http://{{ k8s_node_ip }}:{{ jaeger_nodeport | default(31686) }}
              editable: false
      notify: Restart Grafana
      when: install_jaeger | default(false)

    - name: Configura datasource OCI Monitoring + OCI Logging
      ansible.builtin.copy:
        dest: "{{ grafana_base_dir }}/provisioning/datasources/oci.yml"
        owner: "472"
        group: root
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: OCI Monitoring
              type: oci-metrics-datasource
              access: proxy
              editable: false
              jsonData:
                environment: "OCI Instance"
                tenancyOCID: "{{ oci_tenancy_ocid }}"
                defaultRegion: "{{ oci_region | default('eu-milan-1') }}"

            - name: OCI Logging
              type: oci-logs-datasource
              access: proxy
              editable: false
              jsonData:
                environment: "OCI Instance"
                tenancyOCID: "{{ oci_tenancy_ocid }}"
                defaultRegion: "{{ oci_region | default('eu-milan-1') }}"
      notify: Restart Grafana
      when: install_oci_datasources | default(true)

    # =========================================================================
    # Dashboard provisioning (copia JSON da Docker Compose)
    # =========================================================================
    - name: Configura dashboard provider
      ansible.builtin.copy:
        dest: "{{ grafana_base_dir }}/provisioning/dashboards/dashboards.yml"
        owner: "472"
        group: root
        mode: "0644"
        content: |
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /etc/grafana/provisioning/dashboards/json
                foldersFromFilesStructure: true
      notify: Restart Grafana
      when: install_grafana_dashboards | default(false)

    - name: Copia dashboard JSON application
      ansible.builtin.copy:
        src: "{{ dashboard_source_dir }}/application/"
        dest: "{{ grafana_base_dir }}/provisioning/dashboards/json/application/"
        owner: "472"
        group: root
        mode: "0644"
      notify: Restart Grafana
      when: install_grafana_dashboards | default(false)

    - name: Copia dashboard JSON health
      ansible.builtin.copy:
        src: "{{ dashboard_source_dir }}/health/"
        dest: "{{ grafana_base_dir }}/provisioning/dashboards/json/health/"
        owner: "472"
        group: root
        mode: "0644"
      notify: Restart Grafana
      when: install_grafana_dashboards | default(false)

    - name: Copia dashboard JSON infrastructure
      ansible.builtin.copy:
        src: "{{ dashboard_source_dir }}/infrastructure/"
        dest: "{{ grafana_base_dir }}/provisioning/dashboards/json/infrastructure/"
        owner: "472"
        group: root
        mode: "0644"
      notify: Restart Grafana
      when: install_grafana_dashboards | default(false)

    # =========================================================================
    # Alert rules (K8s-adapted labels)
    # =========================================================================
    - name: Configura alert rules K8s
      ansible.builtin.copy:
        dest: "{{ grafana_base_dir }}/provisioning/alerting/admin-alerts.yaml"
        owner: "472"
        group: root
        mode: "0644"
        content: |
          apiVersion: 1
          groups:
            - orgId: 1
              name: django-admin
              folder: Django
              interval: 1m
              rules:
                - uid: admin-errors
                  title: "Admin area errors (5xx)"
                  condition: threshold
                  data:
                    - refId: logs
                      relativeTimeRange:
                        from: 300
                        to: 0
                      datasourceUid: loki
                      model:
                        expr: 'count_over_time({namespace="events", container="backoffice", level="ERROR", logger="admin.requests"}[5m])'
                        refId: logs
                    - refId: threshold
                      relativeTimeRange:
                        from: 0
                        to: 0
                      datasourceUid: __expr__
                      model:
                        type: threshold
                        expression: logs
                        conditions:
                          - evaluator:
                              type: gt
                              params:
                                - 0
                            operator:
                              type: and
                            reducer:
                              type: last
                        refId: threshold
                  for: 0s
                  noDataState: OK
                  execErrState: Alerting
                  annotations:
                    summary: "Errori 5xx rilevati nell'area admin Django"
                    description: "Ci sono log ERROR dal middleware admin.requests nel container backoffice (namespace events) negli ultimi 5 minuti. Controlla Loki per i dettagli."
      notify: Restart Grafana
      when: install_grafana_alerting | default(false)

    # =========================================================================
    # Container Grafana (Podman)
    # =========================================================================
    - name: Ferma container Grafana esistente (se presente)
      ansible.builtin.command: podman stop {{ grafana_container_name }}
      register: stop_result
      changed_when: stop_result.rc == 0
      failed_when: false

    - name: Rimuovi container Grafana esistente (se presente)
      ansible.builtin.command: podman rm {{ grafana_container_name }}
      register: rm_result
      changed_when: rm_result.rc == 0
      failed_when: false

    - name: Pull immagine Grafana
      ansible.builtin.command: podman pull {{ grafana_image }}
      register: pull_result
      changed_when: "'Copying' in pull_result.stderr or 'Writing' in pull_result.stderr"

    - name: Crea container Grafana
      ansible.builtin.command: >
        podman create
        --name {{ grafana_container_name }}
        --publish {{ grafana_port | default(3000) }}:3000
        --volume {{ grafana_base_dir }}/data:/var/lib/grafana:Z
        --volume {{ grafana_base_dir }}/provisioning:/etc/grafana/provisioning:Z
        --env GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password | default('admin') }}
        --env GF_SERVER_ROOT_URL={{ grafana_root_url }}
        --env GF_USERS_ALLOW_SIGN_UP=false
        --env GF_AUTH_ANONYMOUS_ENABLED={{ grafana_allow_anonymous | default(false) | lower }}
        --env GF_AUTH_ANONYMOUS_ORG_ROLE={{ grafana_anonymous_role | default('Viewer') }}
        --env GF_INSTALL_PLUGINS=oci-metrics-datasource,oci-logs-datasource
        --restart always
        {{ grafana_image }}
      register: create_result
      changed_when: create_result.rc == 0

    # =========================================================================
    # Systemd service (auto-start)
    # =========================================================================
    - name: Genera systemd unit per Grafana
      ansible.builtin.command: >
        podman generate systemd
        --name {{ grafana_container_name }}
        --new
      register: systemd_unit
      changed_when: false

    - name: Scrivi systemd unit file
      ansible.builtin.copy:
        dest: /etc/systemd/system/grafana.service
        content: "{{ systemd_unit.stdout }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Abilita e avvia Grafana service
      ansible.builtin.systemd:
        name: grafana
        enabled: true
        state: started
        daemon_reload: true

    # =========================================================================
    # Firewalld
    # =========================================================================
    - name: Apri porta Grafana in firewalld
      ansible.posix.firewalld:
        port: "{{ grafana_port | default(3000) }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      when: ansible_facts.services is defined and 'firewalld.service' in ansible_facts.services
      failed_when: false

    - name: Apri porta Grafana in firewalld (fallback command)
      ansible.builtin.command: >
        firewall-cmd --permanent --add-port={{ grafana_port | default(3000) }}/tcp
      register: fw_result
      changed_when: "'success' in fw_result.stdout"
      failed_when: false

    - name: Ricarica firewalld
      ansible.builtin.command: firewall-cmd --reload
      changed_when: false
      failed_when: false

    # =========================================================================
    # Caddy reverse proxy (HTTPS automatico per Grafana)
    # Saltato quando install_reverse_proxy: true (Caddy su micro-cirunner gestisce tutto)
    # =========================================================================
    - name: Crea directory Caddy
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ caddy_base_dir }}"
        - "{{ caddy_base_dir }}/data"
        - "{{ caddy_base_dir }}/config"
      when:
        - base_domain is defined
        - not (install_reverse_proxy | default(false))

    - name: Scrivi Caddyfile
      ansible.builtin.copy:
        dest: "{{ caddy_base_dir }}/Caddyfile"
        owner: root
        group: root
        mode: "0644"
        content: |
          {{ domain_grafana }} {
            reverse_proxy localhost:{{ grafana_port | default(3000) }}
          }
      notify: Restart Caddy
      when:
        - base_domain is defined
        - not (install_reverse_proxy | default(false))

    - name: Ferma container Caddy esistente (se presente)
      ansible.builtin.command: podman stop {{ caddy_container_name }}
      register: stop_caddy
      changed_when: stop_caddy.rc == 0
      failed_when: false
      when:
        - base_domain is defined
        - not (install_reverse_proxy | default(false))

    - name: Rimuovi container Caddy esistente (se presente)
      ansible.builtin.command: podman rm {{ caddy_container_name }}
      register: rm_caddy
      changed_when: rm_caddy.rc == 0
      failed_when: false
      when:
        - base_domain is defined
        - not (install_reverse_proxy | default(false))

    - name: Pull immagine Caddy
      ansible.builtin.command: podman pull {{ caddy_image }}
      register: caddy_pull
      changed_when: "'Copying' in caddy_pull.stderr or 'Writing' in caddy_pull.stderr"
      when:
        - base_domain is defined
        - not (install_reverse_proxy | default(false))

    - name: Crea container Caddy
      ansible.builtin.command: >
        podman create
        --name {{ caddy_container_name }}
        --publish 80:80
        --publish 443:443
        --volume {{ caddy_base_dir }}/Caddyfile:/etc/caddy/Caddyfile:Z
        --volume {{ caddy_base_dir }}/data:/data:Z
        --volume {{ caddy_base_dir }}/config:/config:Z
        --restart always
        {{ caddy_image }}
      register: caddy_create
      changed_when: caddy_create.rc == 0
      when:
        - base_domain is defined
        - not (install_reverse_proxy | default(false))

    - name: Genera systemd unit per Caddy
      ansible.builtin.command: >
        podman generate systemd
        --name {{ caddy_container_name }}
        --new
      register: caddy_systemd
      changed_when: false
      when:
        - base_domain is defined
        - not (install_reverse_proxy | default(false))

    - name: Scrivi systemd unit file Caddy
      ansible.builtin.copy:
        dest: /etc/systemd/system/caddy.service
        content: "{{ caddy_systemd.stdout }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd
      when:
        - base_domain is defined
        - not (install_reverse_proxy | default(false))

    - name: Abilita e avvia Caddy service
      ansible.builtin.systemd:
        name: caddy
        enabled: true
        state: started
        daemon_reload: true
      when:
        - base_domain is defined
        - not (install_reverse_proxy | default(false))

    # =========================================================================
    # Health check
    # =========================================================================
    - name: Attendi che Grafana sia pronto (max 60s)
      ansible.builtin.uri:
        url: "http://localhost:{{ grafana_port | default(3000) }}/api/health"
        return_content: true
        status_code: 200
      register: health_check
      retries: 12
      delay: 5
      until: health_check.status == 200

    - name: Verifica datasource provisioned
      ansible.builtin.uri:
        url: "http://localhost:{{ grafana_port | default(3000) }}/api/datasources"
        user: admin
        password: "{{ grafana_admin_password | default('admin') }}"
        force_basic_auth: true
        return_content: true
      register: ds_check

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Riepilogo Grafana VM
      ansible.builtin.debug:
        msg:
          - "=== Grafana su Micro VM Completato ==="
          - ""
          - "URL:         {{ grafana_root_url }}"
          - "Login:       admin / {{ grafana_admin_password | default('admin') }}"
          - "Datasources: {{ ds_check.json | length }} configurati"
          - "Dashboards:  {{ 'provisioned (8 dashboard: application, health, infrastructure)' if (install_grafana_dashboards | default(false)) else 'nessuno (abilita con install_grafana_dashboards: true)' }}"
          - "Alert rules: {{ 'provisioned (admin-errors K8s labels)' if (install_grafana_alerting | default(false)) else 'nessuno (abilita con install_grafana_alerting: true)' }}"
          - "Service:     sudo systemctl status grafana"
          - "{{ 'Caddy:       sudo systemctl status caddy (HTTPS proxy → Grafana)' if (base_domain is defined) else '' }}"
          - ""
          - "--- Datasource endpoints ---"
          - "Prometheus:      http://{{ k8s_node_ip }}:{{ prometheus_nodeport | default(31090) }}"
          - "Loki:            http://{{ k8s_node_ip }}:{{ loki_nodeport | default(31100) }} (derivedFields: log→trace via Jaeger)"
          - "Alertmanager:    http://{{ k8s_node_ip }}:{{ alertmanager_nodeport | default(31093) }}"
          - "Jaeger:          {{ 'http://' ~ k8s_node_ip ~ ':' ~ (jaeger_nodeport | default(31686)) if (install_jaeger | default(false)) else 'saltato' }}"
          - "OCI Monitoring:  Instance Principal (metriche infra OCI)"
          - "OCI Logging:     Instance Principal (log OCI)"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Grafana
      ansible.builtin.systemd:
        name: grafana
        state: restarted

    - name: Restart Caddy
      ansible.builtin.systemd:
        name: caddy
        state: restarted
