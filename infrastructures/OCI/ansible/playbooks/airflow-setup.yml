---
# Airflow — Apache Airflow con LocalExecutor
# Crea namespace, database su PostgreSQL condiviso, Secret e applica i manifest K8s
#
# Prerequisiti:
#   - install_airflow: true in oke.yml
#   - airflow_postgres_password, airflow_admin_password, airflow_secret_key in oke-vault.yml
#   - PostgreSQL già installato nel namespace database (postgres.database.svc)
#   - kubectl configurato
#   - Traefik installato (traefik-setup.yml)
#   - OAuth2 Proxy installato (domain-setup.yml) per autenticazione
#   - DNS A record: airflow.oci.santocaruso.eu verso IP pubblico
#
# Uso: ansible-playbook ansible/playbooks/airflow-setup.yml --ask-vault-pass
- name: Airflow Setup
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  vars:
    airflow_k8s_dir: "{{ playbook_dir }}/../../k8s/airflow"

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica che install_airflow sia abilitato
      ansible.builtin.assert:
        that: install_airflow | default(false)
        fail_msg: "install_airflow non abilitato in oke.yml."

    - name: Verifica kubectl disponibile
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    # =========================================================================
    # Namespace
    # =========================================================================
    - name: Crea namespace airflow
      ansible.builtin.command: kubectl create namespace airflow
      register: ns_result
      changed_when: "'created' in ns_result.stdout"
      failed_when:
        - ns_result.rc != 0
        - "'already exists' not in ns_result.stderr"

    # =========================================================================
    # Database — Crea database airflow sul PostgreSQL esistente
    # =========================================================================
    - name: Crea database airflow su PostgreSQL esistente
      ansible.builtin.shell: |
        kubectl exec -n database statefulset/postgres -- \
          psql -U postgres -d postgres -c \
          "SELECT 'exists' FROM pg_database WHERE datname = 'airflow'" \
          | grep -q exists \
          || kubectl exec -n database statefulset/postgres -- \
          psql -U postgres -d postgres -c "CREATE DATABASE airflow"
      register: db_result
      changed_when: "'CREATE DATABASE' in db_result.stdout"

    - name: Crea utente airflow su PostgreSQL esistente
      ansible.builtin.shell: |
        kubectl exec -n database statefulset/postgres -- \
          psql -U postgres -d postgres -c \
          "SELECT 'exists' FROM pg_roles WHERE rolname = 'airflow'" \
          | grep -q exists \
          || kubectl exec -n database statefulset/postgres -- \
          psql -U postgres -d postgres -c \
          "CREATE USER airflow WITH PASSWORD '{{ airflow_postgres_password }}'; GRANT ALL PRIVILEGES ON DATABASE airflow TO airflow"
      register: user_result
      changed_when: "'CREATE ROLE' in user_result.stdout"

    # =========================================================================
    # Secret
    # =========================================================================
    - name: Crea Secret airflow-secret
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: airflow-secret
            namespace: airflow
          type: Opaque
          stringData:
            AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:{{ airflow_postgres_password }}@postgres.database.svc:5432/airflow"
            AIRFLOW__WEBSERVER__SECRET_KEY: "{{ airflow_secret_key }}"
            AIRFLOW_ADMIN_PASSWORD: "{{ airflow_admin_password }}"
            AIRFLOW_API_USER: "{{ airflow_api_user }}"
            AIRFLOW_API_PASSWORD: "{{ airflow_api_password }}"
      register: secret_result
      changed_when: "'created' in secret_result.stdout or 'configured' in secret_result.stdout"

    # =========================================================================
    # Manifest K8s (Kustomize)
    # =========================================================================
    - name: Applica manifest Kustomize (ConfigMap, PVC, Init Job, Deployments, Service, IngressRoute)
      ansible.builtin.command: kubectl apply -k {{ airflow_k8s_dir }}
      register: kustomize_result
      changed_when: "'created' in kustomize_result.stdout or 'configured' in kustomize_result.stdout"

    - name: Attendi Airflow Webserver ready
      ansible.builtin.command: >
        kubectl rollout status deployment airflow-webserver
        --namespace airflow --timeout=300s
      changed_when: false

    - name: Attendi Airflow Scheduler ready
      ansible.builtin.command: >
        kubectl rollout status deployment airflow-scheduler
        --namespace airflow --timeout=300s
      changed_when: false

    # =========================================================================
    # Verifica
    # =========================================================================
    - name: Verifica pods Airflow
      ansible.builtin.command: kubectl get pods -n airflow
      register: pods_result
      changed_when: false

    - name: Verifica IngressRoute
      ansible.builtin.command: kubectl get ingressroute -n airflow
      register: ingress_result
      changed_when: false

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Riepilogo Airflow
      ansible.builtin.debug:
        msg:
          - "=== Airflow Setup Completato ==="
          - ""
          - "URL:          https://airflow.oci.santocaruso.eu"
          - "User:         admin"
          - "Auth:         Google SSO (via OAuth2 Proxy)"
          - "PostgreSQL:   postgres.database.svc:5432 (database: airflow, user: airflow)"
          - ""
          - "--- Pods ---"
          - "{{ pods_result.stdout }}"
          - ""
          - "--- IngressRoute ---"
          - "{{ ingress_result.stdout }}"
