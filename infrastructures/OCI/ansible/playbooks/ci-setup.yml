---
# CI/CD — ArgoCD (GitOps) + Tekton Pipelines (CI)
# Installa ArgoCD via Helm e Tekton da release upstream.
# Applica manifest K8s da k8s/argocd/ e k8s/tekton/.
#
# Prerequisiti:
#   - install_argocd: true e/o install_tekton: true in oke.yml
#   - kubectl e helm configurati
#   - Traefik installato (traefik-setup.yml)
#   - DNS A record: argocd.oci.santocaruso.eu e tekton.oci.santocaruso.eu verso IP pubblico
#
# Uso: ansible-playbook ansible/playbooks/ci-setup.yml --ask-vault-pass
- name: CI/CD Setup (ArgoCD + Tekton)
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  vars:
    argocd_k8s_dir: "{{ playbook_dir }}/../../k8s/argocd"
    tekton_k8s_dir: "{{ playbook_dir }}/../../k8s/tekton"

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica kubectl disponibile
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Verifica Helm disponibile
      ansible.builtin.command: helm version --short
      register: helm_version
      changed_when: false

    # =========================================================================
    # ArgoCD
    # =========================================================================
    - name: Crea namespace argocd
      ansible.builtin.command: kubectl create namespace argocd
      register: ns_argocd
      changed_when: "'created' in ns_argocd.stdout"
      failed_when:
        - ns_argocd.rc != 0
        - "'already exists' not in ns_argocd.stderr"
      when: install_argocd | default(false)

    - name: Aggiungi Helm repo argo
      ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
      register: repo_argo
      changed_when: "'has been added' in repo_argo.stdout"
      failed_when:
        - repo_argo.rc != 0
        - "'already exists' not in repo_argo.stderr"
      when: install_argocd | default(false)

    - name: Aggiorna Helm repos
      ansible.builtin.command: helm repo update
      changed_when: false
      when: install_argocd | default(false)

    - name: Installa ArgoCD via Helm
      ansible.builtin.command: >
        helm upgrade --install argocd argo/argo-cd
        --namespace argocd
        --set global.nodeSelector.workload=light
        --set "configs.params.server\.insecure=true"
        --set server.service.type=ClusterIP
        --set dex.enabled=false
        --set notifications.enabled=false
        --set applicationSet.enabled=false
        --set server.resources.requests.cpu=50m
        --set server.resources.requests.memory=128Mi
        --set server.resources.limits.cpu=250m
        --set server.resources.limits.memory=256Mi
        --set controller.resources.requests.cpu=100m
        --set controller.resources.requests.memory=128Mi
        --set controller.resources.limits.cpu=500m
        --set controller.resources.limits.memory=512Mi
        --set repoServer.resources.requests.cpu=50m
        --set repoServer.resources.requests.memory=64Mi
        --set repoServer.resources.limits.cpu=250m
        --set repoServer.resources.limits.memory=256Mi
        --set redis.resources.requests.cpu=10m
        --set redis.resources.requests.memory=32Mi
        --set redis.resources.limits.cpu=100m
        --set redis.resources.limits.memory=128Mi
      register: argocd_result
      changed_when: "'STATUS: deployed' in argocd_result.stdout"
      when: install_argocd | default(false)

    - name: Attendi ArgoCD server ready
      ansible.builtin.command: >
        kubectl rollout status deployment argocd-server
        --namespace argocd --timeout=300s
      changed_when: false
      when: install_argocd | default(false)

    - name: Applica manifest Kustomize ArgoCD (IngressRoute)
      ansible.builtin.command: kubectl apply -k {{ argocd_k8s_dir }}
      register: argocd_kustomize
      changed_when: "'created' in argocd_kustomize.stdout or 'configured' in argocd_kustomize.stdout"
      when: install_argocd | default(false)

    # =========================================================================
    # Tekton Pipelines + Dashboard
    # =========================================================================
    - name: Crea namespace tekton-pipelines
      ansible.builtin.command: kubectl create namespace tekton-pipelines
      register: ns_tekton
      changed_when: "'created' in ns_tekton.stdout"
      failed_when:
        - ns_tekton.rc != 0
        - "'already exists' not in ns_tekton.stderr"
      when: install_tekton | default(false)

    - name: Installa Tekton Pipelines da release upstream
      ansible.builtin.command: >
        kubectl apply -f
        https://storage.googleapis.com/tekton-releases/pipeline/previous/v0.65.2/release.yaml
      register: tekton_pipes
      changed_when: "'created' in tekton_pipes.stdout"
      when: install_tekton | default(false)

    - name: Installa Tekton Dashboard da release upstream
      ansible.builtin.command: >
        kubectl apply -f
        https://github.com/tektoncd/dashboard/releases/download/v0.64.0/release.yaml
      register: tekton_dash
      changed_when: "'created' in tekton_dash.stdout"
      when: install_tekton | default(false)

    - name: Attendi Tekton controller ready
      ansible.builtin.command: >
        kubectl rollout status deployment tekton-pipelines-controller
        --namespace tekton-pipelines --timeout=180s
      changed_when: false
      when: install_tekton | default(false)

    - name: Attendi Tekton webhook ready
      ansible.builtin.command: >
        kubectl rollout status deployment tekton-pipelines-webhook
        --namespace tekton-pipelines --timeout=180s
      changed_when: false
      when: install_tekton | default(false)

    - name: Installa Task git-clone dal catalogo Tekton
      ansible.builtin.command: >
        kubectl apply -f
        https://raw.githubusercontent.com/tektoncd/catalog/main/task/git-clone/0.9/git-clone.yaml
        -n tekton-pipelines
      register: tekton_gitclone
      changed_when: "'created' in tekton_gitclone.stdout or 'configured' in tekton_gitclone.stdout"
      when: install_tekton | default(false)

    - name: Applica manifest Kustomize Tekton (IngressRoute, SA, Tasks, Pipeline)
      ansible.builtin.command: kubectl apply -k {{ tekton_k8s_dir }}
      register: tekton_kustomize
      changed_when: "'created' in tekton_kustomize.stdout or 'configured' in tekton_kustomize.stdout"
      when: install_tekton | default(false)

    # =========================================================================
    # Verifica
    # =========================================================================
    - name: Verifica pods ArgoCD
      ansible.builtin.command: kubectl get pods -n argocd
      register: argocd_pods
      changed_when: false
      when: install_argocd | default(false)

    - name: Verifica pods Tekton
      ansible.builtin.command: kubectl get pods -n tekton-pipelines
      register: tekton_pods
      changed_when: false
      when: install_tekton | default(false)

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Riepilogo CI/CD
      ansible.builtin.debug:
        msg:
          - "=== CI/CD Setup Completato ==="
          - ""
          - "--- ArgoCD ---"
          - "{{ 'URL: https://argocd.oci.santocaruso.eu' if (install_argocd | default(false)) else 'Saltato (install_argocd: false)' }}"
          - "{{ 'Password admin: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath=\"{.data.password}\" | base64 -d' if (install_argocd | default(false)) else '' }}"
          - ""
          - "--- Tekton ---"
          - "{{ 'URL: https://tekton.oci.santocaruso.eu' if (install_tekton | default(false)) else 'Saltato (install_tekton: false)' }}"
