---
# TCP Forwarding su micro-gw (IP stabile) via firewalld
# Inoltra traffico TCP grezzo (porte 80/443) a Traefik nel cluster K8s.
# Traefik gestisce TLS (Let's Encrypt ACME) e L7 routing.
#
# Architettura:
#   Internet:443 → micro-gw (firewalld DNAT) → k8s:30443 → Traefik (TLS + L7)
#   Internet:80  → micro-gw (firewalld DNAT) → k8s:30080 → Traefik (HTTP→HTTPS)
#
# Prerequisiti:
#   - install_reverse_proxy: true in oke.yml
#   - base_domain configurato in oke.yml
#   - k8s_node_ip configurato in oke.yml (IP privato nodo light)
#   - Inventory con micro-gw
#
# Uso: ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/reverse-proxy-setup.yml

- name: TCP Forwarding su micro-gw (firewalld DNAT → Traefik K8s)
  hosts: micro-gw
  become: true
  gather_facts: true

  vars_files:
    - ../vars/oke.yml
    - ../vars/oke-vault.yml

  tasks:
    # =========================================================================
    # Verifica prerequisiti
    # =========================================================================
    - name: Verifica che install_reverse_proxy sia abilitato
      ansible.builtin.assert:
        that: install_reverse_proxy | default(false)
        fail_msg: "install_reverse_proxy non abilitato in oke.yml."

    - name: Verifica che base_domain sia definito
      ansible.builtin.assert:
        that: base_domain is defined
        fail_msg: "base_domain non definito in oke.yml."

    - name: Verifica che k8s_node_ip sia definito
      ansible.builtin.assert:
        that:
          - k8s_node_ip is defined
          - k8s_node_ip != "K8S_NODE_PRIVATE_IP"
        fail_msg: "k8s_node_ip non configurato in oke.yml. Ottenere con: kubectl get nodes -o wide → INTERNAL-IP del nodo light."


    # =========================================================================
    # IP Forwarding
    # =========================================================================
    - name: Abilita IP forwarding (net.ipv4.ip_forward)
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    # =========================================================================
    # Firewalld — DNAT rules (TCP forwarding)
    # =========================================================================
    - name: Aggiungi forward-port HTTP (80 → k8s NodePort HTTP)
      ansible.builtin.command: >
        firewall-cmd --permanent
        --add-forward-port=port=80:proto=tcp:toaddr={{ k8s_node_ip }}:toport={{ traefik_http_nodeport | default(30080) }}
      register: fw_http_fwd
      changed_when: "'success' in fw_http_fwd.stdout"

    - name: Aggiungi forward-port HTTPS (443 → k8s NodePort HTTPS)
      ansible.builtin.command: >
        firewall-cmd --permanent
        --add-forward-port=port=443:proto=tcp:toaddr={{ k8s_node_ip }}:toport={{ traefik_https_nodeport | default(30443) }}
      register: fw_https_fwd
      changed_when: "'success' in fw_https_fwd.stdout"

    # =========================================================================
    # Firewalld — Masquerade + Porte
    # =========================================================================
    - name: Abilita masquerade (necessario per DNAT cross-host)
      ansible.builtin.command: firewall-cmd --permanent --add-masquerade
      register: fw_masq
      changed_when: "'success' in fw_masq.stdout"
      failed_when: false

    - name: Apri porta HTTP in firewalld
      ansible.builtin.command: firewall-cmd --permanent --add-port=80/tcp
      register: fw_http
      changed_when: "'success' in fw_http.stdout"
      failed_when: false

    - name: Apri porta HTTPS in firewalld
      ansible.builtin.command: firewall-cmd --permanent --add-port=443/tcp
      register: fw_https
      changed_when: "'success' in fw_https.stdout"
      failed_when: false

    - name: Ricarica firewalld per applicare regole
      ansible.builtin.command: firewall-cmd --reload
      changed_when: false

    # =========================================================================
    # Verifica
    # =========================================================================
    - name: Verifica forward-port rules attive
      ansible.builtin.command: firewall-cmd --list-forward-ports
      register: verify_forwards
      changed_when: false

    - name: Verifica masquerade attivo
      ansible.builtin.command: firewall-cmd --query-masquerade
      register: verify_masq
      changed_when: false
      failed_when: false

    - name: Verifica IP forwarding attivo
      ansible.builtin.command: sysctl net.ipv4.ip_forward
      register: verify_ipfwd
      changed_when: false

    # =========================================================================
    # Riepilogo
    # =========================================================================
    - name: Riepilogo TCP Forwarding
      ansible.builtin.debug:
        msg:
          - "=== TCP Forwarding su micro-gw Completato ==="
          - ""
          - "IP stabile:     {{ ansible_host }}"
          - "Target K8s:     {{ k8s_node_ip }}"
          - "Base domain:    {{ base_domain }}"
          - ""
          - "--- Flusso traffico ---"
          - "Internet:80  → firewalld DNAT → {{ k8s_node_ip }}:{{ traefik_http_nodeport | default(30080) }} (Traefik HTTP→HTTPS redirect)"
          - "Internet:443 → firewalld DNAT → {{ k8s_node_ip }}:{{ traefik_https_nodeport | default(30443) }} (Traefik TLS ACME + L7 routing)"
          - ""
          - "--- Stato ---"
          - "IP forwarding:  {{ verify_ipfwd.stdout }}"
          - "Masquerade:     {{ verify_masq.stdout | default('attivo') }}"
          - "Forward rules:  {{ verify_forwards.stdout_lines }}"
          - ""
          - "--- Comandi utili ---"
          - "firewall-cmd --list-forward-ports"
          - "firewall-cmd --query-masquerade"
          - "sysctl net.ipv4.ip_forward"
          - ""
          - "--- DNS ---"
          - "Puntare TUTTI i sottodomini *.{{ base_domain }} → {{ ansible_host }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
