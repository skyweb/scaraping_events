# ApisixRoute — Linkerd Viz Dashboard (namespace: linkerd-viz)
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: linkerd-viz-sso
  namespace: linkerd-viz
spec:
  http:
    - name: linkerd-viz-sso
      match:
        hosts:
          - linkerd.oci.santocaruso.eu
        paths:
          - /*
      backends:
        - serviceName: web
          servicePort: 8084
      plugins:
        - name: openid-connect
          enable: true
          config:
            client_id: backoffice-admin
            client_secret: "${{KEYCLOAK_BACKOFFICE_CLIENT_SECRET}}"
            discovery: http://keycloak.apps.svc:8080/realms/today-events/.well-known/openid-configuration
            issuer: https://auth.oci.santocaruso.eu/realms/today-events
            scope: openid profile email
            bearer_only: false
            redirect_uri: https://linkerd.oci.santocaruso.eu/callback
            logout_path: /sso-logout
            post_logout_redirect_uri: https://linkerd.oci.santocaruso.eu/
            set_userinfo_header: true
            set_id_token_header: true
            set_access_token_header: true
            access_token_in_authorization_header: false
            ssl_verify: false
            session:
              secret: "${{APISIX_SESSION_SECRET}}"
        - name: proxy-rewrite
          enable: true
          config:
            headers:
              set:
                Host: web.linkerd-viz.svc
        - name: opentelemetry
          enable: true
        - name: prometheus
          enable: true
