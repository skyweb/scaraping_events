# ServiceAccount per i pod spider lanciati da Airflow
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-scraper-sa
  namespace: scraping
  labels:
    app: scraping
    component: spider
---
# Role — permessi minimi per gestire pod effimeri spider
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scraper-pod-manager
  namespace: scraping
  labels:
    app: scraping
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
# RoleBinding — consente all'Airflow Scheduler (ns airflow) di creare pod in ns scraping
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-scraper-binding
  namespace: scraping
  labels:
    app: scraping
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scraper-pod-manager
subjects:
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: airflow
