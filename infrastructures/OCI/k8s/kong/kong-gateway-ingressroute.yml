# IngressRoute per Kong Gateway — accesso API via browser con Google SSO
# Protetto da google-auth middleware (OAuth2 Proxy)
# Il plugin pre-function di Kong mappa X-Auth-Request-Email al consumer Kong
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kong-gateway-https
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`gateway.oci.santocaruso.eu`)
      kind: Rule
      services:
        - name: kong-kong-proxy
          port: 8000
      middlewares:
        - name: google-auth
          namespace: traefik
  tls:
    certResolver: letsencrypt
