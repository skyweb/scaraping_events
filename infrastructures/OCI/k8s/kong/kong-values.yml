# Helm values per kong/kong
# Kong in DB mode (PostgreSQL) — API Gateway per il traffico API
# I secret (pg_password) vengono passati via kong-secret dal playbook Ansible.

# Immagine con registry completo (OKE/CRI-O richiede nomi non ambigui)
image:
  repository: docker.io/library/kong
  tag: "3.9"

# Kong NON è ingress controller — Traefik gestisce l'ingress
ingressController:
  enabled: false

env:
  database: postgres
  pg_host: postgres.database.svc
  pg_port: "5432"
  pg_user: kong
  pg_database: kong
  pg_password:
    valueFrom:
      secretKeyRef:
        name: kong-secret
        key: pg_password
  admin_gui_api_url: https://kong-admin.oci.santocaruso.eu

# Proxy — riceve traffico API da Traefik
proxy:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    containerPort: 8000
    servicePort: 8000
  tls:
    enabled: false

# Admin API — esposta via IngressRoute per Kong Manager
admin:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    containerPort: 8001
    servicePort: 8001
  tls:
    enabled: false

# Migrations
migrations:
  preUpgrade: true
  postUpgrade: true

nodeSelector:
  workload: heavy

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 384Mi

# Kong Manager (Admin UI integrata — sostituisce Konga, supporta ARM64)
manager:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    containerPort: 8002
    servicePort: 8002
  tls:
    enabled: false

# Prometheus plugin — metriche per Grafana
serviceMonitor:
  enabled: false

# Status endpoint per health check e metriche Prometheus
status:
  enabled: true
  http:
    enabled: true
    containerPort: 8100
    servicePort: 8100
