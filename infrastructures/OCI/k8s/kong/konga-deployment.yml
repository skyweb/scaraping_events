apiVersion: apps/v1
kind: Deployment
metadata:
  name: konga
  namespace: apps
  labels:
    app: konga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: konga
  template:
    metadata:
      labels:
        app: konga
    spec:
      nodeSelector:
        workload: light
      initContainers:
        - name: konga-prepare
          image: docker.io/pantsel/konga:latest
          command:
            - node
            - ./bin/konga.js
            - prepare
            - --adapter
            - postgres
            - --uri
            - "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_DATABASE)"
          env:
            - name: DB_HOST
              value: "postgres.database.svc"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "konga"
            - name: DB_DATABASE
              value: "konga"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: konga-secret
                  key: db_password
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: konga
          image: docker.io/pantsel/konga:latest
          ports:
            - containerPort: 1337
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_ADAPTER
              value: "postgres"
            - name: DB_HOST
              value: "postgres.database.svc"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "konga"
            - name: DB_DATABASE
              value: "konga"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: konga-secret
                  key: db_password
            - name: KONGA_HOOK_TIMEOUT
              value: "60000"
            - name: KONGA_LOG_LEVEL
              value: "warn"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 1337
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 1337
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
