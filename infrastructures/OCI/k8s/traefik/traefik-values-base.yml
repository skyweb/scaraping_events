# Traefik base — senza ACME, senza reverse proxy
# Valori dinamici (nodePort) passati via --set dal playbook Ansible.

service:
  type: NodePort

ports:
  traefik:
    expose:
      default: true

nodeSelector:
  workload: light

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true
