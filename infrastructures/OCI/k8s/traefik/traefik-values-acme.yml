# Traefik con ACME HTTPS + hostPort (accesso diretto, senza reverse proxy)
# Valori dinamici (nodePort, letsencrypt email) passati via --set dal playbook Ansible.

service:
  type: NodePort

ports:
  web:
    hostPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    hostPort: 443
  traefik:
    expose:
      default: true

nodeSelector:
  workload: light

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true

persistence:
  enabled: true
  path: /data
  size: 128Mi
