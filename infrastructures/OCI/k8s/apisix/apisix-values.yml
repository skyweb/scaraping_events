# APISIX Helm values — unico ingress/gateway (Traefik rimosso)
apisix:
  image:
    repository: apache/apisix
    tag: "3.11-debian"
  kind: Deployment
  replicaCount: 1
  nodeSelector:
    workload: heavy
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ssl:
    enabled: true
  # HTTP → HTTPS redirect globale
  globalRules:
    - id: 1
      plugins:
        redirect:
          http_to_https: true
  plugins:
    - openid-connect
    - jwt-auth
    - cors
    - prometheus
    - opentelemetry
    - proxy-rewrite
    - redirect
    - serverless-post-function
    - limit-count

gateway:
  type: NodePort
  http:
    enabled: true
    servicePort: 80
    containerPort: 9080
    nodePort: 30080
  tls:
    enabled: true
    servicePort: 443
    containerPort: 9443
    nodePort: 30443

admin:
  enabled: true
  type: ClusterIP
  port: 9180
  credentials:
    admin: apisix-admin-key
    viewer: apisix-viewer-key

etcd:
  enabled: true
  replicaCount: 1
  persistence:
    size: 2Gi
  nodeSelector:
    workload: light

dashboard:
  enabled: true
  image:
    repository: apache/apisix-dashboard
    tag: "3.0-alpine"

ingress-controller:
  enabled: true
  config:
    apisix:
      serviceNamespace: apps
      adminKey: apisix-admin-key
  # Cluster-wide: watch ApisixRoute CRD in tutti i namespace
  scope:
    enabled: false

pluginAttrs:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
  opentelemetry:
    resource:
      service.name: apisix-gateway
    collector:
      address: otel-collector.monitoring.svc:4317
      request_timeout: 3