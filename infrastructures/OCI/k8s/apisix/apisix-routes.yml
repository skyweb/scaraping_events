# =============================================================================
# ApisixRoute — route per i servizi nel namespace "apps"
#
# I placeholder ${{...}} fanno riferimento a variabili d'ambiente APISIX
# o secret configurati via Helm/etcd. In alternativa, sostituire con valori
# concreti o usare APISIX Secret Manager.
# =============================================================================

# --- API External (JWT bearer auth + rate limit) ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: api-external
  namespace: apps
spec:
  http:
    - name: api-external
      match:
        hosts:
          - api.oci.santocaruso.eu
        paths:
          - /api/external/*
      backends:
        - serviceName: backoffice
          servicePort: 8000
      plugins:
        - name: openid-connect
          enable: true
          config:
            client_id: backoffice-admin
            client_secret: "${{KEYCLOAK_BACKOFFICE_CLIENT_SECRET}}"
            discovery: http://keycloak.apps.svc:8080/realms/today-events/.well-known/openid-configuration
            issuer: https://auth.oci.santocaruso.eu/realms/today-events
            bearer_only: true
            ssl_verify: false
        - name: limit-count
          enable: true
          config:
            count: 60
            time_window: 60
            rejected_code: 429
            key: remote_addr
        - name: cors
          enable: true
        - name: opentelemetry
          enable: true
        - name: prometheus
          enable: true
---
# --- API Public (no auth) ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: api-public
  namespace: apps
spec:
  http:
    - name: api-public
      match:
        hosts:
          - api.oci.santocaruso.eu
        paths:
          - /api/public/*
      backends:
        - serviceName: backoffice
          servicePort: 8000
      plugins:
        - name: cors
          enable: true
        - name: opentelemetry
          enable: true
        - name: prometheus
          enable: true
---
# --- Backoffice Admin SSO (/admin/*) — priorita alta ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: backoffice-admin-sso
  namespace: apps
spec:
  http:
    - name: backoffice-admin-sso
      priority: 10
      match:
        hosts:
          - events.oci.santocaruso.eu
        paths:
          - /admin/*
      backends:
        - serviceName: backoffice
          servicePort: 8000
      plugins:
        - name: openid-connect
          enable: true
          config:
            client_id: backoffice-admin
            client_secret: "${{KEYCLOAK_BACKOFFICE_CLIENT_SECRET}}"
            discovery: http://keycloak.apps.svc:8080/realms/today-events/.well-known/openid-configuration
            issuer: https://auth.oci.santocaruso.eu/realms/today-events
            scope: openid profile email
            bearer_only: false
            redirect_uri: https://events.oci.santocaruso.eu/admin/callback
            logout_path: /admin/sso-logout
            post_logout_redirect_uri: https://events.oci.santocaruso.eu/
            set_userinfo_header: true
            set_id_token_header: true
            set_access_token_header: true
            access_token_in_authorization_header: false
            ssl_verify: false
            session:
              secret: "${{APISIX_SESSION_SECRET}}"
        - name: opentelemetry
          enable: true
        - name: prometheus
          enable: true
---
# --- Backoffice Public (static, media, api, docs — no SSO) ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: backoffice-public
  namespace: apps
spec:
  http:
    - name: backoffice-public
      match:
        hosts:
          - events.oci.santocaruso.eu
        paths:
          - /*
      backends:
        - serviceName: backoffice
          servicePort: 8000
      plugins:
        - name: opentelemetry
          enable: true
        - name: prometheus
          enable: true
---
# --- Keycloak (Identity Provider — no auth) ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: keycloak-proxy
  namespace: apps
spec:
  http:
    - name: keycloak-proxy
      match:
        hosts:
          - auth.oci.santocaruso.eu
        paths:
          - /*
      backends:
        - serviceName: keycloak
          servicePort: 8080
      plugins:
        - name: opentelemetry
          enable: true
        - name: prometheus
          enable: true
---
# --- APISIX Dashboard SSO ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: apisix-dashboard-sso
  namespace: apps
spec:
  http:
    - name: apisix-dashboard-sso
      match:
        hosts:
          - apisix.oci.santocaruso.eu
        paths:
          - /*
      backends:
        - serviceName: apisix-dashboard
          servicePort: 9000
      plugins:
        - name: openid-connect
          enable: true
          config:
            client_id: backoffice-admin
            client_secret: "${{KEYCLOAK_BACKOFFICE_CLIENT_SECRET}}"
            discovery: http://keycloak.apps.svc:8080/realms/today-events/.well-known/openid-configuration
            issuer: https://auth.oci.santocaruso.eu/realms/today-events
            scope: openid profile email
            bearer_only: false
            redirect_uri: https://apisix.oci.santocaruso.eu/callback
            logout_path: /sso-logout
            post_logout_redirect_uri: https://apisix.oci.santocaruso.eu/
            set_userinfo_header: true
            set_id_token_header: true
            set_access_token_header: true
            access_token_in_authorization_header: false
            ssl_verify: false
            session:
              secret: "${{APISIX_SESSION_SECRET}}"
        - name: opentelemetry
          enable: true
        - name: prometheus
          enable: true