apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-https
  namespace: clusters
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.oci.santocaruso.eu`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
  tls:
    certResolver: letsencrypt
