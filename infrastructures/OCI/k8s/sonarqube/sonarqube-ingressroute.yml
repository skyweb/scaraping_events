apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarqube-https
  namespace: devs
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sonarqube.oci.santocaruso.eu`)
      kind: Rule
      middlewares:
        - name: google-auth
          namespace: traefik
      services:
        - name: sonarqube-sonarqube
          port: 9000
  tls:
    certResolver: letsencrypt
