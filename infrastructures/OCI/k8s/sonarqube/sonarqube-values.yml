image:
  repository: docker.io/library/sonarqube

community:
  enabled: true

monitoringPasscode: "sonarqube-monitoring"

resources:
  limits:
    cpu: "500m"
    memory: 3Gi
  requests:
    cpu: 250m
    memory: 1536Mi

startupProbe:
  failureThreshold: 60
  periodSeconds: 10

nodeSelector:
  workload: heavy

persistence:
  enabled: true
  size: 5Gi

# Disabilita PostgreSQL integrato — usa istanza esistente nel cluster (postgres.database.svc)
postgresql:
  enabled: false

jdbcOverwrite:
  enable: true
  jdbcUrl: "jdbc:postgresql://postgres.database.svc:5432/sonarqube"
  jdbcUsername: "sonarqube"
  jdbcSecretName: "sonarqube-secret"
  jdbcSecretPasswordKey: "jdbc-password"

account:
  existingSecret: sonarqube-secret
