# Grafana Alloy — sostituto Promtail (EOL marzo 2026)
# Raccolta log container Kubernetes → Loki
alloy:
  configMap:
    content: |
      // Discovery pod Kubernetes
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "kube-system|cert-manager|linkerd.*"
          action        = "drop"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pipeline.receiver]
      }

      loki.process "pipeline" {
        // Parsing JSON dai container Django/Celery
        stage.match {
          selector = "{namespace=\"apps\", container=~\"backoffice|celery-worker|celery-beat\"}"

          stage.json {
            expressions = {
              level  = "level",
              logger = "logger",
            }
          }

          stage.labels {
            values = {
              level  = "",
              logger = "",
            }
          }
        }

        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

controller:
  type: daemonset
