server:
  retention: "7d"
  persistentVolume:
    size: 10Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  nodeSelector:
    workload: heavy

alertmanager:
  enabled: true
  nodeSelector:
    workload: light
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  persistentVolume:
    size: 2Gi

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi

prometheus-node-exporter:
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi

extraScrapeConfigs: |
  - job_name: otel-spanmetrics
    static_configs:
      - targets: ['otel-collector-opentelemetry-collector.monitoring.svc:8889']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: django
    static_configs:
      - targets: ['backoffice.apps.svc:8000']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter.database.svc:9121']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: celery-exporter
    static_configs:
      - targets: ['celery-exporter.database.svc:9808']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: apisix
    static_configs:
      - targets: ['apisix-gateway.apps.svc:9091']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ['keycloak.apps.svc:8080']
    scrape_interval: 15s

  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter-prometheus-postgres-exporter.monitoring.svc:80']
    metrics_path: /metrics
    scrape_interval: 15s

  # Metriche container/pod da kubelet cAdvisor di ogni nodo
  - job_name: kubelet-cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    scrape_interval: 15s
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

