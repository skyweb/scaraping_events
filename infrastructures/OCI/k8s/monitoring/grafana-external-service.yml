# Grafana External Service
# Grafana gira su micro-monitor VM (non nel cluster K8s).
# Questo Service senza selector + Endpoints manuali permette a Traefik
# di instradare il traffico alla VM via VCN privata.
#
# IP hardcoded: 10.0.3.8 (micro-monitor private IP)
# Aggiornare se l'IP della VM cambia.
apiVersion: v1
kind: Service
metadata:
  name: grafana-external
  namespace: monitoring
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: grafana-external
  namespace: monitoring
subsets:
  - addresses:
      - ip: 10.0.3.8
    ports:
      - name: http
        port: 3000
