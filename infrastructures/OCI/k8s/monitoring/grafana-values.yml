replicas: 1

adminUser: admin
# Password da Secret K8s (non in chiaro nei values)
envFromSecret: grafana-secret

persistence:
  enabled: true
  size: 2Gi

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector:
  workload: heavy

grafana.ini:
  auth.proxy:
    enabled: true
    header_name: X-Auth-Request-Email
    header_property: email
    auto_sign_up: true
    enable_login_token: false
    sync_ttl: 60
  auth:
    disable_login_form: true
  users:
    auto_assign_org_role: Admin

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc:80
        access: proxy
        isDefault: true

      - name: Loki
        type: loki
        url: http://loki.monitoring.svc:3100
        access: proxy

      - name: Tempo
        type: tempo
        url: http://tempo.monitoring.svc:3100
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
