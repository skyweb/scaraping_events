replicas: 1

adminUser: admin
# Password da Secret K8s (non in chiaro nei values)
envFromSecret: grafana-secret

persistence:
  enabled: true
  size: 2Gi

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector:
  workload: heavy

grafana.ini:
  auth.proxy:
    enabled: true
    header_name: X-Auth-Request-Email
    header_property: email
    auto_sign_up: true
    enable_login_token: false
    sync_ttl: 60
  auth:
    disable_login_form: true
  users:
    auto_assign_org_role: Admin

# Plugin esterni — installati automaticamente all'avvio del container Grafana
plugins:
  - oci-logs-datasource

# Credenziali iniettate da secret K8s (monitoring namespace)
# - grafana-postgres-secret: POSTGRES_USER, POSTGRES_PASSWORD (da oke-vault.yml)
# - grafana-oci-secret: OCI_TENANCY_OCID, OCI_USER_OCID, OCI_FINGERPRINT, OCI_REGION, OCI_PRIVATE_KEY
# Entrambi creati da monitoring-setup.yml
envFromSecrets:
  - name: grafana-postgres-secret
  - name: grafana-oci-secret

# Monta OCI config e chiave privata nel container Grafana
# subPath monta singoli file del secret al path desiderato
# /home/grafana/.oci/config è il path default dell'OCI SDK Go
extraSecretMounts:
  - name: oci-config-file
    mountPath: /home/grafana/.oci/config
    secretName: grafana-oci-secret
    subPath: OCI_CONFIG
    readOnly: true
  - name: oci-key-file
    mountPath: /home/grafana/.oci/key.pem
    secretName: grafana-oci-secret
    subPath: OCI_PRIVATE_KEY
    readOnly: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: PostgreSQL
        type: postgres
        url: postgres.database.svc:5432
        user: ${POSTGRES_USER}
        secureJsonData:
          password: ${POSTGRES_PASSWORD}
        jsonData:
          database: events
          sslmode: disable
          maxOpenConns: 10
          maxIdleConns: 2
          connMaxLifetime: 14400
          postgresVersion: 1600
          timescaledb: false

      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc:80
        access: proxy
        isDefault: true

      - name: Loki
        type: loki
        url: http://loki.monitoring.svc:3100
        access: proxy

      - name: OCI Logs
        type: oci-logs-datasource
        jsonData:
          # local = User Principal: legge ~/.oci/config montato via volume
          # Chiave API dedicata (senza passphrase) creata per Grafana
          environment: local
          tenancymode: single
          profile0: DEFAULT
          tenancy0: ${OCI_TENANCY_OCID}
          region0: ${OCI_REGION}

      - name: Tempo
        type: tempo
        url: http://tempo.monitoring.svc:3100
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: kubernetes
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes
      - name: nodes
        orgId: 1
        folder: Infrastructure
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/nodes
      - name: database
        orgId: 1
        folder: Database
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/database

dashboards:
  kubernetes:
    # Kubernetes / Views / Global — panoramica completa del cluster
    k8s-views-global:
      gnetId: 15760
      revision: 37
      datasource: Prometheus
    # Kubernetes / Views / Namespaces — risorse per namespace
    k8s-views-namespaces:
      gnetId: 15757
      revision: 43
      datasource: Prometheus
    # Kubernetes / Views / Nodes — CPU/RAM/disk per nodo
    k8s-views-nodes:
      gnetId: 15758
      revision: 35
      datasource: Prometheus
    # Kubernetes / Views / Pods — CPU, RAM, restart, network per pod
    k8s-views-pods:
      gnetId: 15759
      revision: 29
      datasource: Prometheus
    # Kubernetes Deployment / StatefulSet / DaemonSet — stato repliche
    k8s-deployments:
      gnetId: 8685
      revision: 1
      datasource: Prometheus
    # Kubernetes Persistent Volumes — utilizzo PVC
    k8s-pvcs:
      gnetId: 13646
      revision: 2
      datasource: Prometheus
  nodes:
    # Node Exporter Full — metriche dettagliate CPU/RAM/disk/network dei nodi
    node-exporter-full:
      gnetId: 1860
      revision: 37
      datasource: Prometheus
  database:
    # PostgreSQL Database — connessioni, query, locks, cache hit ratio
    postgresql:
      gnetId: 9628
      revision: 7
      datasource: PostgreSQL
