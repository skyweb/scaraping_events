apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: airflow
  labels:
    app: airflow
    component: webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
      component: webserver
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: airflow
        component: webserver
    spec:
      nodeSelector:
        workload: heavy
      securityContext:
        fsGroup: 0
      initContainers:
        - name: fix-log-permissions
          image: docker.io/busybox:1.36
          command: ["sh", "-c", "chown -R 50000:0 /opt/airflow/logs"]
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: webserver
          image: docker.io/apache/airflow:2.9.2
          command: ["airflow", "webserver"]
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secret
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: logs
              mountPath: /opt/airflow/logs
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.4.0
          env:
            - name: GITSYNC_REPO
              valueFrom:
                secretKeyRef:
                  name: airflow-secret
                  key: GITSYNC_REPO
            - name: GITSYNC_REF
              value: "main"
            - name: GITSYNC_PERIOD
              value: "60s"
            - name: GITSYNC_ROOT
              value: "/git"
            - name: GITSYNC_LINK
              value: "repo"
            - name: GITSYNC_USERNAME
              value: "git"
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-secret
                  key: GITSYNC_PASSWORD
          volumeMounts:
            - name: dags
              mountPath: /git
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: dags
          emptyDir: {}
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs
