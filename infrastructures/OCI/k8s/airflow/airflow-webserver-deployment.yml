apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: airflow
  labels:
    app: airflow
    component: webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
      component: webserver
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: airflow
        component: webserver
    spec:
      nodeSelector:
        workload: heavy
      securityContext:
        fsGroup: 0
      initContainers:
        - name: fix-log-permissions
          image: docker.io/busybox:1.36
          command: ["sh", "-c", "chown -R 50000:0 /opt/airflow/logs"]
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: webserver
          image: docker.io/apache/airflow:2.9.2
          command: ["airflow", "webserver", "--pid", "/tmp/airflow-webserver.pid"]
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secret
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: logs
              mountPath: /opt/airflow/logs
            - name: webserver-config
              mountPath: /opt/airflow/webserver_config.py
              subPath: webserver_config.py
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
        # git-sync sidecar disabilitato — riattivare quando il repo DAG è pronto
        # Aggiungere GITSYNC_REPO e GITSYNC_PASSWORD al secret airflow-secret
      volumes:
        - name: dags
          emptyDir: {}
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs
        - name: webserver-config
          configMap:
            name: airflow-webserver-config
