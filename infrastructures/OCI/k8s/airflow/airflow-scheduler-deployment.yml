apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: airflow
  labels:
    app: airflow
    component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
      component: scheduler
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: airflow
        component: scheduler
    spec:
      nodeSelector:
        workload: heavy
      securityContext:
        fsGroup: 0
      initContainers:
        - name: fix-log-permissions
          image: docker.io/busybox:1.36
          command: ["sh", "-c", "chown -R 50000:0 /opt/airflow/logs"]
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: scheduler
          image: docker.io/apache/airflow:2.9.2
          command: ["airflow", "scheduler"]
          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secret
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: logs
              mountPath: /opt/airflow/logs
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - airflow jobs check --job-type SchedulerJob --hostname $(hostname)
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
        # git-sync sidecar disabilitato — riattivare quando il repo DAG è pronto
        # Aggiungere GITSYNC_REPO e GITSYNC_PASSWORD al secret airflow-secret
      volumes:
        - name: dags
          emptyDir: {}
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs
