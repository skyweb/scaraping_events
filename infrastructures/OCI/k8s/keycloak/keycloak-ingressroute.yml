apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.oci.santocaruso.eu`)
      kind: Rule
      services:
        - name: keycloak
          port: 8080
  tls:
    certResolver: letsencrypt
