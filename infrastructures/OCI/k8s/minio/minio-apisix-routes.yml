# ApisixRoute — MinIO (namespace: database)

# --- MinIO Console SSO ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: minio-console-sso
  namespace: database
spec:
  http:
    - name: minio-console-sso
      match:
        hosts:
          - minio.oci.santocaruso.eu
        paths:
          - /*
      backends:
        - serviceName: minio
          servicePort: 9001
      plugins:
        - name: openid-connect
          enable: true
          config:
            client_id: backoffice-admin
            client_secret: "${{KEYCLOAK_BACKOFFICE_CLIENT_SECRET}}"
            discovery: http://keycloak.apps.svc:8080/realms/today-events/.well-known/openid-configuration
            issuer: https://auth.oci.santocaruso.eu/realms/today-events
            scope: openid profile email
            bearer_only: false
            redirect_uri: https://minio.oci.santocaruso.eu/callback
            logout_path: /sso-logout
            post_logout_redirect_uri: https://minio.oci.santocaruso.eu/
            set_userinfo_header: true
            set_id_token_header: true
            set_access_token_header: true
            access_token_in_authorization_header: false
            ssl_verify: false
            session:
              secret: "${{APISIX_SESSION_SECRET}}"
        - name: opentelemetry
          enable: true
        - name: prometheus
          enable: true
---
# --- MinIO S3 API (no auth) ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: minio-s3-api
  namespace: database
spec:
  http:
    - name: minio-s3-api
      match:
        hosts:
          - s3.oci.santocaruso.eu
        paths:
          - /*
      backends:
        - serviceName: minio
          servicePort: 9000
      plugins:
        - name: opentelemetry
          enable: true
        - name: prometheus
          enable: true
