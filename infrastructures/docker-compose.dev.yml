services:
  # PostgreSQL con PostGIS
  postgres:
    image: imresamu/postgis:16-3.4
    container_name: dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./services/postgres/init.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      dev-network:
        aliases:
          - postgres

  # Redis
  redis:
    image: redis:7-alpine
    container_name: dev-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-dev-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      dev-network:
        aliases:
          - redis

  # Prometheus (metriche spanmetrics per Jaeger Monitor)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: dev-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
      - --web.enable-remote-write-receiver
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.middlewares=forward-auth"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    networks:
      dev-network:
        aliases:
          - prometheus

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: dev-otel-collector
    restart: unless-stopped
    command: ["--config", "/etc/otel-collector-config.yaml"]
    volumes:
      - ./services/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
      - prometheus
    networks:
      dev-network:
        aliases:
          - otel-collector

  # Jaeger v2 (tracing UI + Monitor tab con SPM)
  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: dev-jaeger
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./services/jaeger/jaeger-v2-config.yaml:/etc/jaeger/config.yaml:ro
      - ./services/jaeger/ui-config.json:/etc/jaeger/ui-config.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jaeger.rule=Host(`jaeger.${DOMAIN}`)"
      - "traefik.http.routers.jaeger.entrypoints=websecure"
      - "traefik.http.routers.jaeger.tls=true"
      - "traefik.http.routers.jaeger.middlewares=forward-auth"
      - "traefik.http.services.jaeger.loadbalancer.server.port=16686"
    depends_on:
      - prometheus
    networks:
      dev-network:
        aliases:
          - jaeger

  # Django Backoffice (dev: runserver + volume mount, no production build)
  backoffice:
    build:
      context: ../microservices/backoffice-service
      dockerfile: Dockerfile.dev
    container_name: dev-backoffice
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app/backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "backoffice.${DOMAIN},backoffice,localhost,127.0.0.1"
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      CORS_ALLOWED_ORIGINS: "https://frontend.${DOMAIN},http://localhost:3000"
      CSRF_TRUSTED_ORIGINS: "https://frontend.${DOMAIN},https://backoffice.${DOMAIN},http://localhost:3000"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://:redis_secret_2026@redis:6379/2}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: backoffice-django
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ../microservices/backoffice-service/backend:/app/backend
    labels:
      - "traefik.enable=true"
      # Router protetto per /admin/ — priorità alta
      - "traefik.http.routers.backoffice-admin.rule=Host(`backoffice.${DOMAIN}`) && PathPrefix(`/admin/`)"
      - "traefik.http.routers.backoffice-admin.entrypoints=websecure"
      - "traefik.http.routers.backoffice-admin.tls=true"
      - "traefik.http.routers.backoffice-admin.service=backoffice-svc"
      - "traefik.http.routers.backoffice-admin.middlewares=forward-auth"
      - "traefik.http.routers.backoffice-admin.priority=10"
      # Router default per API, static, oauth2 — nessuna auth
      - "traefik.http.routers.backoffice.rule=Host(`backoffice.${DOMAIN}`)"
      - "traefik.http.routers.backoffice.entrypoints=websecure"
      - "traefik.http.routers.backoffice.tls=true"
      - "traefik.http.routers.backoffice.service=backoffice-svc"
      - "traefik.http.routers.backoffice.priority=1"
      # Definizione servizio (condivisa tra i due router)
      - "traefik.http.services.backoffice-svc.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      dev-network:
        aliases:
          - backoffice

  # Celery Worker
  backoffice-celery-worker:
    build:
      context: ../microservices/backoffice-service
      dockerfile: Dockerfile.dev
    container_name: dev-backoffice-celery-worker
    restart: unless-stopped
    command: celery -A backoffice worker -l info
    working_dir: /app/backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://:redis_secret_2026@redis:6379/2}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: backoffice-celery-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ../microservices/backoffice-service/backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - dev-network

  # Celery Beat
  backoffice-celery-beat:
    build:
      context: ../microservices/backoffice-service
      dockerfile: Dockerfile.dev
    container_name: dev-backoffice-celery-beat
    restart: unless-stopped
    command: celery -A backoffice beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    working_dir: /app/backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://:redis_secret_2026@redis:6379/2}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: backoffice-celery-beat
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ../microservices/backoffice-service/backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - dev-network

  # Flower — UI monitoraggio Celery
  flower:
    image: mher/flower:2.0
    container_name: dev-flower
    restart: unless-stopped
    command: celery flower --broker=${CELERY_BROKER_URL} --persistent=True --db=/data/flower.db
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
    volumes:
      - flower-dev-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flower.rule=Host(`flower.${DOMAIN}`)"
      - "traefik.http.routers.flower.entrypoints=websecure"
      - "traefik.http.routers.flower.tls=true"
      - "traefik.http.routers.flower.middlewares=forward-auth"
      - "traefik.http.services.flower.loadbalancer.server.port=5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - flower

  # oauth2-proxy — SSO Google OAuth2 con session store Redis
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: dev-oauth2-proxy
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}
      # Restrizione email — * = qualsiasi account Google, oppure es. "mycompany.com"
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REDIRECT_URL: "https://auth.${DOMAIN}/oauth2/callback"
      # Redis session store — DB 5 (Django: 0-2, Superset: 3-4)
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: "redis://:${REDIS_PASSWORD}@redis:6379/5"
      # Cookie — true perche' dev usa HTTPS (mkcert)
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_COOKIE_NAME: "_oauth2_proxy"
      # Upstream placeholder: Traefik usa ForwardAuth, non il proxy diretto
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_REAL_CLIENT_IP_HEADER: "X-Real-IP"
      # Cookie cross-subdomain: tutti i servizi sotto .${DOMAIN} condividono la sessione
      # NOTA: deve essere COOKIE_DOMAINS (plurale) — oauth2-proxy ignora COOKIE_DOMAIN (singolare)
      OAUTH2_PROXY_COOKIE_DOMAINS: "${DOMAIN}"
      OAUTH2_PROXY_SKIP_AUTH_PREFLIGHT: "true"
      # Abilita header X-Auth-Request-Email / X-Auth-Request-User sulle richieste autenticate
      # Usato da OAuth2ProxyAdminMiddleware per il login automatico in Django Admin
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # Whitelist domini per redirect post-auth (URL assoluti passati come ?rd=)
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".${DOMAIN}"
      # CSRF cookie unico per flusso OAuth → evita collisioni multi-tab / multi-subdomain
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
      # Template personalizzato: auto-redirect JS su 401 (via Traefik errors middleware)
      OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR: "/etc/oauth2-proxy/templates"
      OAUTH2_PROXY_LOGGING_FILENAME: ""
      OAUTH2_PROXY_STANDARD_LOGGING: "true"
      OAUTH2_PROXY_REQUEST_LOGGING: "true"
      OAUTH2_PROXY_AUTH_LOGGING: "true"
    labels:
      - "traefik.enable=true"
      # Route pubblica per sign_in, callback, sign_out, userinfo
      - "traefik.http.routers.auth.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls=true"
      - "traefik.http.services.auth.loadbalancer.server.port=4180"
      # ForwardAuth (fw-auth): controlla sessione su /oauth2/auth → 202 ok, 401 non autenticato
      - "traefik.http.middlewares.fw-auth.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth"
      - "traefik.http.middlewares.fw-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.fw-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email,Set-Cookie"
      # Errors: intercetta 401 da fw-auth e fa redirect → /oauth2/start (che restituisce 302 → Google OAuth)
      - "traefik.http.middlewares.auth-errors.errors.status=401"
      - "traefik.http.middlewares.auth-errors.errors.service=auth-redirect@docker"
      - "traefik.http.middlewares.auth-errors.errors.query=/"
      # Chain forward-auth = auth-errors (esterno) + fw-auth (interno)
      # Tutti i router esistenti che usano "forward-auth" continuano a funzionare senza modifiche
      - "traefik.http.middlewares.forward-auth.chain.middlewares=auth-errors,fw-auth"
    volumes:
      - ./services/oauth2-proxy/templates:/etc/oauth2-proxy/templates:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - oauth2-proxy

  # Frontend (React + Vite dev server)
  frontend:
    build:
      context: ../microservices/frontend-service
      dockerfile: Dockerfile.dev
    container_name: dev-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: https://backoffice.${DOMAIN}/api
    volumes:
      - ../microservices/frontend-service:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`frontend.${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    networks:
      dev-network:
        aliases:
          - frontend

  # Loki (log backend)
  loki:
    image: grafana/loki:3.1.0
    container_name: dev-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./services/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-dev-data:/loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`loki.${DOMAIN}`)"
      - "traefik.http.routers.loki.entrypoints=websecure"
      - "traefik.http.routers.loki.tls=true"
      - "traefik.http.routers.loki.middlewares=forward-auth"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      dev-network:
        aliases:
          - loki

  # Promtail (log collector da Docker)
  promtail:
    image: grafana/promtail:3.1.0
    container_name: dev-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./services/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - dev-network

  # Grafana (UI unificata: log, metriche, traces)
  grafana:
    image: grafana/grafana:11.1.0
    container_name: dev-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SERVER_ROOT_URL: "https://grafana.${DOMAIN}/"
    volumes:
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-dev-data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.middlewares=forward-auth"
      - "traefik.http.services.grafana.loadbalancer.server.port=3001"
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      dev-network:
        aliases:
          - grafana

  # Apache Superset Init (setup una tantum)
  superset-init:
    image: apache/superset:4.0.2
    container_name: dev-superset-init
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-superset-secret-dev-change-me}
      DATABASE_HOST: postgres
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_PORT: "5432"
      DATABASE_DB: superset
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@superset.local}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      # DB applicativo da esporre come sorgente dati in Superset
      EVENTS_DB_NAME: ${POSTGRES_DB:-today_events}
    volumes:
      - ./services/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./services/superset/init.sh:/app/init.sh:ro
      - ./services/superset/assets:/app/assets:ro
    command: bash /app/init.sh
    networks:
      - dev-network
    restart: "no"

  # Apache Superset (BI Dashboard eventi)
  superset:
    image: apache/superset:4.0.2
    container_name: dev-superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-superset-secret-dev-change-me}
      DATABASE_HOST: postgres
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_PORT: "5432"
      DATABASE_DB: superset
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - ./services/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset-dev-data:/app/superset_home
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.superset.rule=Host(`superset.${DOMAIN}`)"
      - "traefik.http.routers.superset.entrypoints=websecure"
      - "traefik.http.routers.superset.tls=true"
      - "traefik.http.routers.superset.middlewares=forward-auth"
      - "traefik.http.services.superset.loadbalancer.server.port=8088"
    restart: unless-stopped
    networks:
      dev-network:
        aliases:
          - superset

  # Apache Airflow Init (setup una tantum: migrate DB + crea admin)
  airflow-init:
    image: apache/airflow:2.9.2
    container_name: dev-airflow-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__WEBSERVER__BASE_URL: https://airflow.${DOMAIN}
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags:ro
      - ./services/airflow/plugins:/opt/airflow/plugins:ro
      - ./services/airflow/data:/opt/airflow/data
      - airflow-logs-dev:/opt/airflow/logs
    command:
      - bash
      - -c
      - >
        airflow db migrate &&
        airflow users create
        --username "${AIRFLOW_ADMIN_USER:-admin}"
        --password "${AIRFLOW_ADMIN_PASSWORD:-admin}"
        --firstname Admin
        --lastname User
        --role Admin
        --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}"
    networks:
      - dev-network

  # Apache Airflow Webserver
  airflow-webserver:
    image: apache/airflow:2.9.2
    container_name: dev-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__WEBSERVER__BASE_URL: https://airflow.${DOMAIN}
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    command: webserver
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags:ro
      - ./services/airflow/plugins:/opt/airflow/plugins:ro
      - ./services/airflow/data:/opt/airflow/data
      - airflow-logs-dev:/opt/airflow/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airflow.rule=Host(`airflow.${DOMAIN}`)"
      - "traefik.http.routers.airflow.entrypoints=websecure"
      - "traefik.http.routers.airflow.tls=true"
      - "traefik.http.routers.airflow.middlewares=forward-auth"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      dev-network:
        aliases:
          - airflow-webserver

  # Apache Airflow Scheduler
  airflow-scheduler:
    image: apache/airflow:2.9.2
    container_name: dev-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__WEBSERVER__BASE_URL: https://airflow.${DOMAIN}
    command: scheduler
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags:ro
      - ./services/airflow/plugins:/opt/airflow/plugins:ro
      - ./services/airflow/data:/opt/airflow/data
      - airflow-logs-dev:/opt/airflow/logs
    networks:
      - dev-network

  # Ollama — LLM locale (API REST su :11434)
  # Il traffico esterno passa da ollama-metrics (proxy con metriche Prometheus)
  ollama:
    image: ollama/ollama:latest
    container_name: dev-ollama
    restart: unless-stopped
    volumes:
      - ollama-dev-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      dev-network:
        aliases:
          - ollama

  # Ollama Init — scarica llama3.1:8b al primo avvio
  ollama-init:
    image: ollama/ollama:latest
    container_name: dev-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "llama3.1:8b"]
    networks:
      - dev-network

  # Ollama Metrics — proxy trasparente con metriche Prometheus per Ollama
  ollama-metrics:
    image: ghcr.io/norskhelsenett/ollama-metrics:latest
    container_name: dev-ollama-metrics
    restart: unless-stopped
    environment:
      OLLAMA_HOST: http://ollama:11434
      PORT: "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.${DOMAIN}`)"
      - "traefik.http.routers.ollama.entrypoints=websecure"
      - "traefik.http.routers.ollama.tls=true"
      - "traefik.http.routers.ollama.middlewares=forward-auth"
      - "traefik.http.services.ollama.loadbalancer.server.port=8080"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - ollama-metrics

  # n8n — workflow automation
  n8n:
    image: n8nio/n8n:latest
    container_name: dev-n8n
    restart: unless-stopped
    environment:
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_EDITOR_BASE_URL: https://n8n.${DOMAIN}/
      # Database PostgreSQL
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Encryption key per credenziali (cambiare in produzione)
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-n8n-encryption-key-dev-change-me}
      # Cookie non-secure in dev (HTTP) — true solo con HTTPS in produzione
      N8N_SECURE_COOKIE: "false"
      # Disabilita telemetria
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - n8n-dev-data:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.middlewares=forward-auth"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - n8n

  # Open WebUI (slim) — interfaccia chat leggera per Ollama (successore di ollama-webui-lite)
  # Usa ollama-metrics come proxy per catturare metriche Prometheus
  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main-slim
    container_name: dev-ollama-webui
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama-metrics:8080
      WEBUI_AUTH: "false"
    volumes:
      - ollama-webui-dev-data:/app/backend/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama-webui.rule=Host(`chat.${DOMAIN}`)"
      - "traefik.http.routers.ollama-webui.entrypoints=websecure"
      - "traefik.http.routers.ollama-webui.tls=true"
      - "traefik.http.routers.ollama-webui.middlewares=forward-auth"
      - "traefik.http.services.ollama-webui.loadbalancer.server.port=8080"
    depends_on:
      ollama-metrics:
        condition: service_started
    networks:
      dev-network:
        aliases:
          - ollama-webui

  # auth-redirect — pagina statica con JS redirect verso auth.DOMAIN/oauth2/start
  # Usata da Traefik errors middleware per intercettare 401 senza manipolare cookie
  auth-redirect:
    image: nginx:alpine
    container_name: dev-auth-redirect
    restart: unless-stopped
    volumes:
      - ./services/auth-redirect/index.html:/usr/share/nginx/html/index.html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.auth-redirect.loadbalancer.server.port=80"
    networks:
      - dev-network

  # docker-api-proxy — nginx che riscrive versioni API Docker obsolete a 1.47
  # Fix per Docker Desktop 4.62+ che richiede MinAPIVersion=1.44 ma
  # Traefik SDK usa di default una versione inferiore.
  docker-api-proxy:
    image: nginx:alpine
    container_name: dev-docker-api-proxy
    restart: unless-stopped
    volumes:
      - ./services/docker-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - dev-network

  # Traefik — reverse proxy e service discovery via Docker labels
  # HTTPS locale con certificati mkcert (trusted dal browser)
  traefik:
    image: traefik:v3.3
    container_name: dev-traefik
    restart: unless-stopped
    depends_on:
      - docker-api-proxy
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=dev-network
      - --providers.docker.endpoint=tcp://docker-api-proxy:2375
      # HTTP entrypoint + redirect a HTTPS
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # HTTPS entrypoint (certificati mkcert via dynamic config)
      - --entrypoints.websecure.address=:443
      # Configurazione dinamica (certificati TLS)
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --api.dashboard=true
      - --api.insecure=true
      - --metrics.prometheus=true
      - --metrics.prometheus.addServicesLabels=true
      - --metrics.prometheus.addRoutersLabels=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
      - "8082:8080"
    volumes:
      - ./services/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./services/traefik/certs:/certs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=forward-auth"
    networks:
      - dev-network

  # Redis Exporter (metriche Prometheus per Redis)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: dev-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis-exporter.rule=Host(`redis-exporter.${DOMAIN}`)"
      - "traefik.http.routers.redis-exporter.entrypoints=websecure"
      - "traefik.http.routers.redis-exporter.tls=true"
      - "traefik.http.routers.redis-exporter.middlewares=forward-auth"
      - "traefik.http.services.redis-exporter.loadbalancer.server.port=9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - redis-exporter

  # Celery Exporter (metriche Prometheus per task Celery)
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    container_name: dev-celery-exporter
    environment:
      CE_BROKER_URL: ${CELERY_BROKER_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.celery-exporter.rule=Host(`celery-exporter.${DOMAIN}`)"
      - "traefik.http.routers.celery-exporter.entrypoints=websecure"
      - "traefik.http.routers.celery-exporter.tls=true"
      - "traefik.http.routers.celery-exporter.middlewares=forward-auth"
      - "traefik.http.services.celery-exporter.loadbalancer.server.port=9808"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - celery-exporter

  # cAdvisor (metriche risorse container Docker)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: dev-cadvisor
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cadvisor.rule=Host(`cadvisor.${DOMAIN}`)"
      - "traefik.http.routers.cadvisor.entrypoints=websecure"
      - "traefik.http.routers.cadvisor.tls=true"
      - "traefik.http.routers.cadvisor.middlewares=forward-auth"
      - "traefik.http.services.cadvisor.loadbalancer.server.port=8080"
    networks:
      dev-network:
        aliases:
          - cadvisor

volumes:
  postgres-dev-data:
    name: dev-postgres-data
  redis-dev-data:
    name: dev-redis-data
  loki-dev-data:
    name: dev-loki-data
  grafana-dev-data:
    name: dev-grafana-data
  superset-dev-data:
    name: dev-superset-data
  flower-dev-data:
    name: dev-flower-data
  airflow-logs-dev:
    name: dev-airflow-logs
  ollama-dev-data:
    name: dev-ollama-data
  ollama-webui-dev-data:
    name: dev-ollama-webui-data
  n8n-dev-data:
    name: dev-n8n-data

networks:
  dev-network:
    name: dev-network
    driver: bridge
