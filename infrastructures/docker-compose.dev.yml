services:
  # PostgreSQL con PostGIS
  postgres:
    image: imresamu/postgis:16-3.4
    container_name: dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./services/postgres/init.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      dev-network:
        aliases:
          - postgres

  # Redis
  redis:
    image: redis:7-alpine
    container_name: dev-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-dev-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      dev-network:
        aliases:
          - redis

  # Prometheus (metriche spanmetrics per Jaeger Monitor)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: dev-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
      - --web.enable-remote-write-receiver
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      dev-network:
        aliases:
          - prometheus

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: dev-otel-collector
    restart: unless-stopped
    command: ["--config", "/etc/otel-collector-config.yaml"]
    volumes:
      - ./services/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
      - prometheus
    networks:
      dev-network:
        aliases:
          - otel-collector

  # Jaeger v2 (tracing UI + Monitor tab con SPM)
  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: dev-jaeger
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./services/jaeger/jaeger-v2-config.yaml:/etc/jaeger/config.yaml:ro
      - ./services/jaeger/ui-config.json:/etc/jaeger/ui-config.json:ro
    ports:
      - "16686:16686"
    depends_on:
      - prometheus
    networks:
      dev-network:
        aliases:
          - jaeger

  # Django Backoffice (dev: runserver + volume mount, no production build)
  backoffice:
    build:
      context: ../microservices/backoffice-service
      dockerfile: Dockerfile.dev
    container_name: dev-backoffice
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app/backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backoffice,nginx}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:8000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:8000}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://:redis_secret_2026@redis:6379/2}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: backoffice-django
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ../microservices/backoffice-service/backend:/app/backend
    ports:
      - "${BACKOFFICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      dev-network:
        aliases:
          - backoffice

  # Celery Worker
  backoffice-celery-worker:
    build:
      context: ../microservices/backoffice-service
      dockerfile: Dockerfile.dev
    container_name: dev-backoffice-celery-worker
    restart: unless-stopped
    command: celery -A backoffice worker -l info
    working_dir: /app/backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://:redis_secret_2026@redis:6379/2}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: backoffice-celery-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ../microservices/backoffice-service/backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - dev-network

  # Celery Beat
  backoffice-celery-beat:
    build:
      context: ../microservices/backoffice-service
      dockerfile: Dockerfile.dev
    container_name: dev-backoffice-celery-beat
    restart: unless-stopped
    command: celery -A backoffice beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    working_dir: /app/backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://:redis_secret_2026@redis:6379/2}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: backoffice-celery-beat
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ../microservices/backoffice-service/backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - dev-network

  # Frontend (React + Vite dev server)
  frontend:
    build:
      context: ../microservices/frontend-service
      dockerfile: Dockerfile.dev
    container_name: dev-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost/api
    volumes:
      - ../microservices/frontend-service:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    networks:
      dev-network:
        aliases:
          - frontend

  # Loki (log backend)
  loki:
    image: grafana/loki:3.1.0
    container_name: dev-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./services/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-dev-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      dev-network:
        aliases:
          - loki

  # Promtail (log collector da Docker)
  promtail:
    image: grafana/promtail:3.1.0
    container_name: dev-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./services/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - dev-network

  # Grafana (UI unificata: log, metriche, traces)
  grafana:
    image: grafana/grafana:11.1.0
    container_name: dev-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-dev-data:/var/lib/grafana
    ports:
      - "3001:3001"
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      dev-network:
        aliases:
          - grafana

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: dev-nginx
    restart: unless-stopped
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/nginx/502.html:/etc/nginx/conf.d/502.html:ro
    ports:
      - "80:80"
    depends_on:
      - backoffice
      - frontend
    networks:
      - dev-network

  # Redis Exporter (metriche Prometheus per Redis)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: dev-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - redis-exporter

  # Celery Exporter (metriche Prometheus per task Celery)
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    container_name: dev-celery-exporter
    environment:
      CE_BROKER_URL: ${CELERY_BROKER_URL}
    ports:
      - "9808:9808"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - celery-exporter

  # cAdvisor (metriche risorse container Docker)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: dev-cadvisor
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"
    networks:
      dev-network:
        aliases:
          - cadvisor

volumes:
  postgres-dev-data:
    name: dev-postgres-data
  redis-dev-data:
    name: dev-redis-data
  loki-dev-data:
    name: dev-loki-data
  grafana-dev-data:
    name: dev-grafana-data

networks:
  dev-network:
    name: dev-network
    driver: bridge
