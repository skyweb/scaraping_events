services:
  # PostgreSQL con PostGIS
  postgres:
    image: imresamu/postgis:16-3.4
    container_name: dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./services/postgres/init.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      dev-network:
        aliases:
          - postgres

  # Redis
  redis:
    image: redis:7-alpine
    container_name: dev-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-dev-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      dev-network:
        aliases:
          - redis

  # Prometheus (metriche spanmetrics da OTel Collector)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: dev-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
      - --web.enable-remote-write-receiver
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.service=apisix-gateway-svc@docker"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    networks:
      dev-network:
        aliases:
          - prometheus

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: dev-otel-collector
    restart: unless-stopped
    command: ["--config", "/etc/otel-collector-config.yaml"]
    volumes:
      - ./services/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - prometheus
    networks:
      dev-network:
        aliases:
          - otel-collector

  # Django Backoffice
  backoffice:
    build:
      context: ../microservices/backoffice-service
      dockerfile: Dockerfile.dev
    container_name: dev-backoffice
    restart: unless-stopped
    entrypoint: ["/app/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app/backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "backoffice.${DOMAIN},gateway.${DOMAIN},backoffice,localhost,127.0.0.1"
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      CORS_ALLOWED_ORIGINS: "https://frontend.${DOMAIN},http://localhost:3000"
      CSRF_TRUSTED_ORIGINS: "https://frontend.${DOMAIN},https://backoffice.${DOMAIN},https://gateway.${DOMAIN},http://localhost:3000"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://:redis_secret_2026@redis:6379/2}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: backoffice-django
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: today-events
      KEYCLOAK_AUDIENCE: account
    volumes:
      - ../microservices/backoffice-service/backend:/app/backend
    labels:
      - "traefik.enable=true"
      # Admin: protetto da Keycloak SSO via APISIX openid-connect
      - "traefik.http.routers.backoffice-admin.rule=Host(`backoffice.${DOMAIN}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.backoffice-admin.entrypoints=websecure"
      - "traefik.http.routers.backoffice-admin.tls=true"
      - "traefik.http.routers.backoffice-admin.service=apisix-gateway-svc@docker"
      - "traefik.http.routers.backoffice-admin.priority=2"
      # API e static: accesso diretto (JWT o pubblico)
      - "traefik.http.routers.backoffice.rule=Host(`backoffice.${DOMAIN}`)"
      - "traefik.http.routers.backoffice.entrypoints=websecure"
      - "traefik.http.routers.backoffice.tls=true"
      - "traefik.http.routers.backoffice.service=backoffice-svc"
      - "traefik.http.routers.backoffice.priority=1"
      - "traefik.http.services.backoffice-svc.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      dev-network:
        aliases:
          - backoffice

  # Celery Worker
  backoffice-celery-worker:
    build:
      context: ../microservices/backoffice-service
      dockerfile: Dockerfile.dev
    container_name: dev-backoffice-celery-worker
    restart: unless-stopped
    command: celery -A backoffice worker -l info
    working_dir: /app/backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://:redis_secret_2026@redis:6379/2}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: backoffice-celery-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: today-events
      KEYCLOAK_AUDIENCE: account
    volumes:
      - ../microservices/backoffice-service/backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - dev-network

  # Flower — UI monitoraggio Celery
  flower:
    image: mher/flower:2.0
    container_name: dev-flower
    restart: unless-stopped
    command: celery flower --broker=${CELERY_BROKER_URL} --persistent=True --db=/data/flower.db
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
    volumes:
      - flower-dev-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flower.rule=Host(`flower.${DOMAIN}`)"
      - "traefik.http.routers.flower.entrypoints=websecure"
      - "traefik.http.routers.flower.tls=true"
      - "traefik.http.routers.flower.service=apisix-gateway-svc@docker"
      - "traefik.http.services.flower.loadbalancer.server.port=5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - flower

  # Loki (log backend)
  loki:
    image: grafana/loki:3.1.0
    container_name: dev-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./services/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-dev-data:/loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`loki.${DOMAIN}`)"
      - "traefik.http.routers.loki.entrypoints=websecure"
      - "traefik.http.routers.loki.tls=true"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      dev-network:
        aliases:
          - loki

  # Promtail (log collector da Docker)
  promtail:
    image: grafana/promtail:3.1.0
    container_name: dev-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./services/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - dev-network

  # Grafana (UI unificata: log, metriche, traces)
  grafana:
    image: grafana/grafana:11.1.0
    container_name: dev-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Auth proxy: identità dall'header APISIX (via serverless-pre-function Lua)
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Auth-Request-Email
      GF_AUTH_PROXY_HEADER_PROPERTY: email
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SERVER_ROOT_URL: "https://grafana.${DOMAIN}/"
    volumes:
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-dev-data:/var/lib/grafana
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.service=apisix-gateway-svc@docker"
      - "traefik.http.services.grafana.loadbalancer.server.port=3001"
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      dev-network:
        aliases:
          - grafana

  # Grafana Tempo — trace backend (riceve trace via OTel Collector)
  tempo:
    image: grafana/tempo:2.6.1
    container_name: dev-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./services/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-dev-data:/var/tempo
    networks:
      dev-network:
        aliases:
          - tempo

  # Apache Airflow Init (setup una tantum: migrate DB + crea admin)
  airflow-init:
    image: apache/airflow:2.9.2
    container_name: dev-airflow-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__WEBSERVER__BASE_URL: https://airflow.${DOMAIN}
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags:ro
      - ./services/airflow/plugins:/opt/airflow/plugins:ro
      - ./services/airflow/data:/opt/airflow/data
      - airflow-logs-dev:/opt/airflow/logs
    command:
      - bash
      - -c
      - >
        airflow db migrate &&
        airflow users create
        --username "${AIRFLOW_ADMIN_USER:-admin}"
        --password "${AIRFLOW_ADMIN_PASSWORD:-admin}"
        --firstname Admin
        --lastname User
        --role Admin
        --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}"
    networks:
      - dev-network

  # Apache Airflow Webserver
  airflow-webserver:
    image: apache/airflow:2.9.2
    container_name: dev-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__WEBSERVER__BASE_URL: https://airflow.${DOMAIN}
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    command: webserver
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags:ro
      - ./services/airflow/plugins:/opt/airflow/plugins:ro
      - ./services/airflow/data:/opt/airflow/data
      - airflow-logs-dev:/opt/airflow/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airflow.rule=Host(`airflow.${DOMAIN}`)"
      - "traefik.http.routers.airflow.entrypoints=websecure"
      - "traefik.http.routers.airflow.tls=true"
      - "traefik.http.routers.airflow.service=apisix-gateway-svc@docker"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      dev-network:
        aliases:
          - airflow-webserver

  # Apache Airflow Scheduler
  airflow-scheduler:
    image: apache/airflow:2.9.2
    container_name: dev-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__WEBSERVER__BASE_URL: https://airflow.${DOMAIN}
    command: scheduler
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags:ro
      - ./services/airflow/plugins:/opt/airflow/plugins:ro
      - ./services/airflow/data:/opt/airflow/data
      - airflow-logs-dev:/opt/airflow/logs
    networks:
      - dev-network

  # docker-api-proxy — nginx che riscrive versioni API Docker obsolete a 1.47
  # Fix per Docker Desktop 4.62+ che richiede MinAPIVersion=1.44 ma
  # Traefik SDK usa di default una versione inferiore.
  docker-api-proxy:
    image: nginx:alpine
    container_name: dev-docker-api-proxy
    restart: unless-stopped
    volumes:
      - ./services/docker-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - dev-network

  # Traefik — reverse proxy e service discovery via Docker labels
  # HTTPS locale con certificati mkcert (trusted dal browser)
  traefik:
    image: traefik:v3.3
    container_name: dev-traefik
    restart: unless-stopped
    depends_on:
      - docker-api-proxy
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=dev-network
      - --providers.docker.endpoint=tcp://docker-api-proxy:2375
      # HTTP entrypoint + redirect a HTTPS
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # HTTPS entrypoint (certificati mkcert via dynamic config)
      - --entrypoints.websecure.address=:443
      # Configurazione dinamica (certificati TLS)
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --api.dashboard=true
      - --api.insecure=true
      - --metrics.prometheus=true
      - --metrics.prometheus.addServicesLabels=true
      - --metrics.prometheus.addRoutersLabels=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
      - "8082:8080"
    volumes:
      - ./services/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./services/traefik/certs:/certs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.service=apisix-gateway-svc@docker"
    networks:
      - dev-network

  # Redis Exporter (metriche Prometheus per Redis)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: dev-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis-exporter.rule=Host(`redis-exporter.${DOMAIN}`)"
      - "traefik.http.routers.redis-exporter.entrypoints=websecure"
      - "traefik.http.routers.redis-exporter.tls=true"
      - "traefik.http.routers.redis-exporter.service=apisix-gateway-svc@docker"
      - "traefik.http.services.redis-exporter.loadbalancer.server.port=9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - redis-exporter

  # Celery Exporter (metriche Prometheus per task Celery)
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    container_name: dev-celery-exporter
    environment:
      CE_BROKER_URL: ${CELERY_BROKER_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.celery-exporter.rule=Host(`celery-exporter.${DOMAIN}`)"
      - "traefik.http.routers.celery-exporter.entrypoints=websecure"
      - "traefik.http.routers.celery-exporter.tls=true"
      - "traefik.http.routers.celery-exporter.service=apisix-gateway-svc@docker"
      - "traefik.http.services.celery-exporter.loadbalancer.server.port=9808"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - celery-exporter

  # MinIO — S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret_2026}
    volumes:
      - minio-dev-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      # Console UI
      - "traefik.http.routers.minio-console.rule=Host(`minio.${DOMAIN}`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls=true"
      - "traefik.http.routers.minio-console.service=minio-console-svc"
      - "traefik.http.services.minio-console-svc.loadbalancer.server.port=9001"
      # API S3
      - "traefik.http.routers.minio-api.rule=Host(`s3.${DOMAIN}`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls=true"
      - "traefik.http.routers.minio-api.service=minio-api-svc"
      - "traefik.http.services.minio-api-svc.loadbalancer.server.port=9000"
    networks:
      dev-network:
        aliases:
          - minio

  # SonarQube — code quality and security analysis
  sonarqube:
    image: sonarqube:community
    container_name: dev-sonarqube
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: ${POSTGRES_USER}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_JDBC_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - sonarqube-dev-data:/opt/sonarqube/data
      - sonarqube-dev-extensions:/opt/sonarqube/extensions
      - sonarqube-dev-logs:/opt/sonarqube/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarqube.rule=Host(`sonarqube.${DOMAIN}`)"
      - "traefik.http.routers.sonarqube.entrypoints=websecure"
      - "traefik.http.routers.sonarqube.tls=true"
      - "traefik.http.routers.sonarqube.service=apisix-gateway-svc@docker"
      - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - sonarqube

  # etcd — store configurazione per APISIX
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: dev-etcd
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    volumes:
      - etcd-dev-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      dev-network:
        aliases:
          - etcd

  # APISIX — API Gateway
  apisix:
    image: apache/apisix:3.11.0-debian
    container_name: dev-apisix
    restart: unless-stopped
    volumes:
      - ./services/apisix/config.yaml:/usr/local/apisix/conf/config.yaml
    labels:
      - "traefik.enable=true"
      # API Gateway proxy
      - "traefik.http.routers.apisix-gateway.rule=Host(`gateway.${DOMAIN}`)"
      - "traefik.http.routers.apisix-gateway.entrypoints=websecure"
      - "traefik.http.routers.apisix-gateway.tls=true"
      - "traefik.http.routers.apisix-gateway.service=apisix-gateway-svc"
      - "traefik.http.services.apisix-gateway-svc.loadbalancer.server.port=9080"
    depends_on:
      etcd:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - apisix

  # APISIX Init — configura route/upstream al primo avvio
  apisix-init:
    image: curlimages/curl:8.11.0
    container_name: dev-apisix-init
    command: sh /init-routes.sh
    volumes:
      - ./services/apisix/init-routes.sh:/init-routes.sh:ro
    environment:
      DOMAIN: ${DOMAIN:-127.0.0.1.nip.io}
      KEYCLOAK_BACKOFFICE_CLIENT_SECRET: ${KEYCLOAK_BACKOFFICE_CLIENT_SECRET:-CHANGE_ME_BACKOFFICE_SECRET}
    depends_on:
      apisix:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - apisix-init
    restart: "no"

  # APISIX Dashboard — UI gestione route/plugin
  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    container_name: dev-apisix-dashboard
    restart: unless-stopped
    volumes:
      - ./services/apisix/dashboard.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apisix-dashboard.rule=Host(`apisix-dashboard.${DOMAIN}`)"
      - "traefik.http.routers.apisix-dashboard.entrypoints=websecure"
      - "traefik.http.routers.apisix-dashboard.tls=true"
      - "traefik.http.routers.apisix-dashboard.service=apisix-gateway-svc@docker"
      - "traefik.http.services.apisix-dashboard.loadbalancer.server.port=9000"
    depends_on:
      etcd:
        condition: service_healthy
    networks:
      dev-network:
        aliases:
          - apisix-dashboard

  # Keycloak — Identity Provider (SSO + Client Credentials)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: dev-keycloak
    restart: unless-stopped
    command: start-dev --import-realm --features=opentelemetry
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: "http://otel-collector:4317"
      KC_TRACING_JDBC_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: "https://keycloak.${DOMAIN}"
      KC_HOSTNAME_ADMIN: "https://keycloak.${DOMAIN}"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HTTP_ENABLED: "true"
      # Social Login Identity Providers
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - ./services/keycloak/realm-today-events.json:/opt/keycloak/data/import/realm-today-events.json:ro
      - ./services/keycloak/themes/today-events:/opt/keycloak/themes/today-events:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.${DOMAIN}`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'status.*UP'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      dev-network:
        aliases:
          - keycloak

volumes:
  postgres-dev-data:
    name: dev-postgres-data
  redis-dev-data:
    name: dev-redis-data
  loki-dev-data:
    name: dev-loki-data
  grafana-dev-data:
    name: dev-grafana-data
  flower-dev-data:
    name: dev-flower-data
  airflow-logs-dev:
    name: dev-airflow-logs
  minio-dev-data:
    name: dev-minio-data
  sonarqube-dev-data:
    name: dev-sonarqube-data
  sonarqube-dev-extensions:
    name: dev-sonarqube-extensions
  sonarqube-dev-logs:
    name: dev-sonarqube-logs
  etcd-dev-data:
    name: dev-etcd-data
  tempo-dev-data:
    name: dev-tempo-data

networks:
  dev-network:
    name: dev-network
    driver: bridge
