# Promtail config — scrape log container Docker, filtra solo dev-*
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["dev-*"]

    relabel_configs:
      # Usa il nome container come label
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: container_name
      # Usa il nome del servizio compose come label
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service

    pipeline_stages:
      - docker: {}
      # Parsing JSON dai container Django/Celery — estrae level come label Loki
      - match:
          selector: '{container_name=~"dev-backoffice.*"}'
          stages:
            - json:
                expressions:
                  level: level
                  logger: logger
            - labels:
                level:
                logger:
