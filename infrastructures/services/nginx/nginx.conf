upstream backoffice {
    server backoffice:8000;
}

upstream frontend {
    server frontend:5173;
}

upstream flower {
    server flower:5555;
}

upstream grafana {
    server grafana:3001;
}

upstream jaeger {
    server jaeger:16686;
}

upstream prometheus {
    server prometheus:9090;
}

upstream superset {
    server superset:8088;
}

upstream airflow {
    server airflow-webserver:8080;
}

upstream oauth2-proxy {
    server oauth2-proxy:4180;
}

upstream loki {
    server loki:3100;
}

upstream redis-exporter {
    server redis-exporter:9121;
}

upstream cadvisor {
    server cadvisor:8080;
}

upstream n8n {
    server n8n:5678;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # Custom error page for 502 Bad Gateway
    error_page 502 /502.html;
    location /502.html {
        root /etc/nginx/conf.d;
        internal;
    }

    # SSO — redirect al login Google quando auth_request ritorna 401
    location @oauth2_sign_in {
        return 302 /oauth2/sign_in?rd=$scheme://$host$request_uri;
    }

    # oauth2-proxy — auth subrequest (chiamato internamente da auth_request)
    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy;
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # oauth2-proxy — endpoint pubblici (sign_in, callback, sign_out, userinfo)
    location /oauth2/ {
        proxy_pass http://oauth2-proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    # Backoffice API
    location /api/ {
        proxy_pass http://backoffice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin — protetto da oauth2-proxy (SSO Google)
    # Il middleware OAuth2ProxyAdminMiddleware legge X-Auth-Request-Email e fa auto-login
    location /admin/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_pass http://backoffice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files
    location /static/ {
        proxy_pass http://backoffice;
        proxy_set_header Host $host;
    }

    # Superset static files — Flask-AppBuilder e bundle React
    # Più specifici di /static/, nginx usa la corrispondenza più lunga.
    # Necessari perché i template Superset usano path assoluti /static/...
    # (non url_for), che altrimenti andrebbero al backoffice Django.
    location /static/appbuilder/ {
        proxy_pass http://superset/static/appbuilder/;
        proxy_set_header Host $host;
    }

    location /static/assets/ {
        proxy_pass http://superset/static/assets/;
        proxy_set_header Host $host;
    }

    # OAuth2 (token endpoint)
    location /o/ {
        proxy_pass http://backoffice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana — log, metriche, traces
    # GF_SERVER_SERVE_FROM_SUB_PATH=true fa sì che Grafana serva su /grafana/
    # nginx NON rimuove il prefisso (proxy_pass senza URI trailing slash)
    # così Grafana riceve GET /grafana/ e non fa redirect loop
    location /grafana/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        proxy_pass http://grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Jaeger — distributed tracing UI
    # jaeger_query.base_path=/jaeger nel config YAML fa servire la UI su /jaeger
    location /jaeger/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        proxy_pass http://jaeger/jaeger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus — metriche
    # --web.route-prefix=/prometheus fa servire tutte le route su /prometheus
    location /prometheus/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        proxy_pass http://prometheus/prometheus/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Superset API (/api/v1/) — React frontend usa path assoluto hardcoded /api/v1/...
    # senza prefisso /superset/. Django usa solo /api/ (senza /v1/): nessun conflitto.
    # location /api/v1/ è più lunga di /api/ → nginx usa questa per /api/v1/...
    location /api/v1/ {
        proxy_pass http://superset/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Superset /superset/log/ — React SPA chiama /superset/log/?explode=events
    # con il prefisso blueprint ma senza lo SCRIPT_NAME prefix.
    # Il blocco generico /superset/ stripperebbe → /log/ → Flask 404.
    # Questa location più specifica preserva il path completo /superset/log/.
    location /superset/log/ {
        proxy_pass http://superset/superset/log/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Superset — BI dashboard
    # proxy_pass con trailing slash: nginx strippa il prefisso /superset/
    # prima di passare la richiesta a Superset (es. /superset/welcome/ → /welcome/).
    # X-Forwarded-Prefix: /superset → ProxyFix setta SCRIPT_NAME=/superset
    # così Flask genera URL corretti (url_for prepend SCRIPT_NAME).
    # Nota: a causa del blueprint Superset (url_prefix='/superset'), i link generati
    # da url_for avranno doppio prefisso nell'URL del browser (/superset/superset/welcome/)
    # ma il routing funziona correttamente perché nginx strippa un livello.
    # Remote-User: email dall'oauth2-proxy → FAB auto-login (AUTH_REMOTE_USER).
    location /superset/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        proxy_pass http://superset/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_set_header Remote-User $auth_email;
        # Superset root (/) ha un redirect hardcoded verso /superset/welcome/,
        # ignorando SCRIPT_NAME. nginx lo riscrive a /superset/superset/welcome/
        # in modo che dopo lo strip del prefisso arrivi /superset/welcome/ a Flask (blueprint).
        proxy_redirect /superset/welcome/ /superset/superset/welcome/;
    }

    # Airflow — orchestrazione DAG
    # AIRFLOW__WEBSERVER__BASE_URL=http://localhost/airflow fa sì che Airflow
    # generi link corretti; ENABLE_PROXY_FIX gestisce l'header X-Forwarded-Prefix
    location /airflow/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        proxy_pass http://airflow/airflow/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (per log live e trigger)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120;
    }

    # Flower — Celery monitoring UI
    location /flower/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        proxy_pass http://flower/flower/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # WebSocket support (per live updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Loki — log backend
    # Loki non ha UI alla root: redirect a /ready per mostrare lo stato
    # Endpoint utili: /loki/ready  /loki/metrics  /loki/loki/api/v1/...
    location = /loki/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;
        return 302 /loki/ready;
    }

    location /loki/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        proxy_pass http://loki/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redis Exporter — metriche Redis (Prometheus scrape + UI)
    # sub_filter: riscrive i link assoluti /metrics → /redis-exporter/metrics nell'HTML della root page
    location /redis-exporter/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        proxy_pass http://redis-exporter/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Disabilita la compressione upstream per permettere sub_filter
        proxy_set_header Accept-Encoding "";
        sub_filter "href='/metrics'" "href='/redis-exporter/metrics'";
        sub_filter_once off;
    }

    # cAdvisor — metriche container Docker
    # --url_base_prefix=/cadvisor fa sì che cAdvisor serva tutto sotto /cadvisor/
    # nginx NON rimuove il prefisso (proxy_pass senza trailing slash)
    location /cadvisor/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        proxy_pass http://cadvisor;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # n8n — workflow automation UI
    # N8N_PATH=/n8n/ fa sì che n8n serva UI e API sotto /n8n/
    # nginx NON rimuove il prefisso (proxy_pass senza trailing slash)
    location /n8n/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        proxy_pass http://n8n;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (editor live updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }

    # Ollama — LLM API locale
    # nginx strippa /ollama/ prima di passare la richiesta (proxy_pass con trailing slash)
    # Protetto da oauth2-proxy: solo utenti autenticati possono accedere alle API LLM
    # Usa variabile per proxy_pass: nginx risolve il DNS a runtime (non al reload)
    # così nginx non va in crash se Ollama non è ancora avviato.
    location /ollama/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_sign_in;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        resolver 127.0.0.11 valid=10s;
        set $ollama_upstream http://ollama:11434;
        proxy_pass $ollama_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming responses (generazione token LLM)
        proxy_buffering off;
        proxy_read_timeout 300;
    }

    # Frontend (React SPA)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
