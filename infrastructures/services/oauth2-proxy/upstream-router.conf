server {
    listen 8080;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Routing basato su X-Forwarded-Host (impostato da Traefik)
    set $upstream "";

    if ($http_x_forwarded_host ~* "^backoffice\.") { set $upstream http://backoffice:8000; }
    if ($http_x_forwarded_host ~* "^grafana\.") { set $upstream http://grafana:3001; }
    if ($http_x_forwarded_host ~* "^prometheus\.") { set $upstream http://prometheus:9090; }
    if ($http_x_forwarded_host ~* "^flower\.") { set $upstream http://flower:5555; }
    if ($http_x_forwarded_host ~* "^sonarqube\.") { set $upstream http://sonarqube:9000; }
    if ($http_x_forwarded_host ~* "^redis-exporter\.") { set $upstream http://redis-exporter:9121; }
    if ($http_x_forwarded_host ~* "^celery-exporter\.") { set $upstream http://celery-exporter:9808; }
    if ($http_x_forwarded_host ~* "^airflow\.") { set $upstream http://airflow-webserver:8080; }
    if ($http_x_forwarded_host ~* "^apisix-dashboard\.") { set $upstream http://apisix-dashboard:9000; }
    if ($http_x_forwarded_host ~* "^traefik\.") { set $upstream http://traefik:8080; }

    location / {
        proxy_pass $upstream;
        proxy_set_header Host $http_x_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
