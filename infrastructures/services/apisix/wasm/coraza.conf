{
  "directives_map": {
    "default": [
      "SecRuleEngine On",
      "SecRequestBodyAccess On",
      "SecResponseBodyAccess Off",
      "SecRequestBodyLimit 13107200",
      "SecAuditEngine RelevantOnly",
      "SecAuditLog /dev/stdout",
      "SecAuditLogType Serial",
      "SecAuditLogFormat JSON",
      "SecRule ARGS|ARGS_NAMES \"@rx (?i)(union.*select|select.*from|insert.*into|delete.*from|drop\\s+table|1\\s*=\\s*1|or\\s+1\\s*=\\s*1)\" \"id:1001,phase:2,deny,status:403,log,msg:SQL Injection detected\"",
      "SecRule ARGS|ARGS_NAMES \"@rx (?i)(<script|javascript:|on\\w+\\s*=)\" \"id:1002,phase:2,deny,status:403,log,msg:XSS detected\"",
      "SecRule REQUEST_URI \"@rx (?i)(\\.\\./)\" \"id:1003,phase:1,deny,status:403,log,msg:Path traversal detected\"",
      "SecRule REQUEST_URI \"@rx (?i)(/etc/passwd|/proc/self|/var/log)\" \"id:1004,phase:1,deny,status:403,log,msg:Sensitive file access detected\"",
      "SecRule ARGS|ARGS_NAMES \"@rx (?i)(exec\\s*\\(|system\\s*\\(|passthru|shell_exec|eval\\s*\\()\" \"id:1005,phase:2,deny,status:403,log,msg:Remote code execution detected\"",
      "SecRule REQUEST_HEADERS:Content-Type \"@rx (?i)text/xml\" \"id:1006,phase:1,deny,status:403,log,msg:XXE attack vector blocked\""
    ]
  },
  "default_directives": "default"
}
