---
# APISIX config per dev — docker-compose
apisix:
  node_listen: 9080
  enable_admin: true
  admin_listen:
    ip: 0.0.0.0
    port: 9180
  admin_key:
    - role: admin
      name: admin
      key: apisix-dev-admin-key
  router:
    http: radixtree_host_uri
    ssl: radixtree_sni
  enable_control: true
  enable_http2: true
  enable_reuseport: true
  ssl:
    enable: false

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key_required: true
    admin_listen:
      port: 9180
      ip: 0.0.0.0
    admin_key:
      - role: admin
        name: admin
        key: apisix-dev-admin-key
    allow_admin:
      - 0.0.0.0/0
  etcd:
    host:
      - http://etcd:2379
    prefix: /apisix
    timeout: 30

nginx_config:
  http:
    charset: utf-8
    underscores_in_headers: "on"
    real_ip_header: X-Real-IP
    real_ip_from:
      - 0.0.0.0/0
    client_max_body_size: 0
    keepalive_timeout: 60s
    lua_shared_dict:
      introspection: 10m
      plugin-limit-count: 10m
      prometheus-metrics: 10m
      tracing_buffer: 10m
      upstream-healthcheck: 10m
      worker-events: 10m
      lrucache-lock: 10m
      balancer-ewma: 10m
      balancer-ewma-locks: 10m
      balancer-ewma-last-touched-at: 10m
      etcd-cluster-health-check: 10m
      discovery: 1m
      jwks: 1m
      access-tokens: 1m
      internal-status: 10m

plugins:
  - openid-connect
  - jwt-auth
  - consumer-restriction
  - limit-count
  - cors
  - prometheus
  - opentelemetry
  - proxy-rewrite
  - response-rewrite

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    export_addr:
      port: 9091
      ip: 0.0.0.0
    metric_prefix: apisix_
    enable_export_server: true
  opentelemetry:
    trace_id_source: x-request-id
    resource:
      service.name: apisix-gateway
    collector:
      address: otel-collector:4317
      request_timeout: 3
    batch_span_processor:
      max_export_batch_size: 16
      inactive_timeout: 1
