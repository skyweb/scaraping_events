# Docker API Proxy — version compat fix per Docker Desktop 4.62+ (MinAPIVersion=1.44)
# I worker girano come root per accedere a /var/run/docker.sock (srw-rw---- root:root)
user root;
worker_processes 1;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    upstream docker_socket {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;

        # Riscrivi versioni API obsolete (< 1.44) a 1.47
        # Traefik SDK v27.1.1 usa defaultVersion="1.24"
        location ~ "^/v1\.(2[0-9]|3[0-9]|4[0-3])(/|$)" {
            rewrite "^/v1\.(2[0-9]|3[0-9]|4[0-3])(/.+)$" "/v1.47$2" break;
            rewrite "^/v1\.(2[0-9]|3[0-9]|4[0-3])$"       "/v1.47"   break;
            proxy_pass              http://docker_socket;
            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        Host "localhost";
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
        }

        location / {
            proxy_pass              http://docker_socket;
            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        Host "localhost";
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
        }
    }
}
