# Prometheus - Configurazione sviluppo
# Scrape metriche spanmetrics da OTel Collector e Jaeger

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: jaeger-spanmetrics
    static_configs:
      - targets: ["jaeger:8889"]

  - job_name: django
    static_configs:
      - targets: ["backoffice:8000"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9808"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]

  - job_name: apisix
    static_configs:
      - targets: ["apisix:9091"]

  - job_name: keycloak
    static_configs:
      - targets: ["keycloak:8080"]
    metrics_path: /metrics

